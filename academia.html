<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#03050a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="manifest.json">
<title>Academia Heroica · Choque de Héroes TCG</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@600;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#03050a; --bg2:#07090f; --bg3:#0b0e18;
  --card:#0b0e18; --border:#141c2a;
  --text:#e0eeff; --muted:#6a7f9a;
  --accent:#00ff9d; --accent-glow:rgba(0,255,157,.08);
  --gold:#f5a623; --gold-glow:rgba(245,166,35,.1);
  --purple:#cc55ff; --purple-glow:rgba(180,70,255,.1);
  --blue:#00cfff; --blue-glow:rgba(0,207,255,.09);
  --red:#ff2244;
}
html,body{
  min-height:100%;background:var(--bg);color:var(--text);
  font-family:'Rajdhani',sans-serif;
  -webkit-tap-highlight-color:transparent;
  overflow-x:hidden;
}
body::after{
  content:'';position:fixed;inset:0;
  background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,.06) 3px,rgba(0,0,0,.06) 4px);
  pointer-events:none;z-index:1000;
}
body::before{
  content:'';position:fixed;inset:0;
  background:
    radial-gradient(ellipse 70% 40% at 15% 10%,var(--accent-glow) 0%,transparent 60%),
    radial-gradient(ellipse 70% 40% at 85% 90%,var(--blue-glow) 0%,transparent 60%),
    radial-gradient(ellipse 50% 50% at 50% 40%,var(--purple-glow) 0%,transparent 60%);
  pointer-events:none;
}
#wrap{max-width:480px;margin:0 auto;padding:16px 12px 40px;position:relative;}

/* ── HEADER ── */
header{position:relative;padding:14px 8px 20px;margin-bottom:14px;border-bottom:1px solid var(--border);}
header::after{content:'';position:absolute;bottom:0;left:8%;right:8%;height:1px;background:linear-gradient(90deg,transparent,var(--accent),transparent);opacity:.4;}
.back-btn{position:absolute;top:14px;left:6px;background:var(--card);border:1px solid var(--border);border-radius:8px;color:var(--muted);font-size:1.2rem;width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;text-decoration:none;transition:all .2s;}
.back-btn:active{color:var(--accent);border-color:var(--accent);transform:scale(.94);}
.header-title{text-align:center;padding-top:6px;}
.h-tag{font-family:'Orbitron',sans-serif;font-size:.6rem;letter-spacing:4px;color:var(--muted);text-transform:uppercase;}
.h-title{font-family:'Cinzel Decorative',serif;font-size:1.5rem;font-weight:900;color:var(--gold);text-shadow:0 0 6px rgba(245,166,35,.35),0 0 16px rgba(245,166,35,.2);margin-top:4px;letter-spacing:2px;}
.h-subtitle{font-family:'Orbitron',sans-serif;font-size:.55rem;letter-spacing:3px;color:var(--muted);text-transform:uppercase;margin-top:6px;}

/* ── CARD ── */
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px 14px;margin-bottom:12px;position:relative;}
.badge{display:inline-block;font-family:'Orbitron',sans-serif;font-size:9px;letter-spacing:3px;color:var(--accent);background:var(--accent-glow);border:1px solid rgba(0,255,157,0.2);padding:4px 12px;border-radius:2px;margin-bottom:12px;}
.badge.gold{color:var(--gold);background:var(--gold-glow);border-color:rgba(245,166,35,.25);}
.empty-msg{text-align:center;color:var(--muted);font-size:.9rem;padding:20px 10px;}

/* ── LISTADO DE BARAJAS ── */
.baraja-card{background:linear-gradient(135deg,rgba(11,14,24,.9),rgba(11,14,24,.6));border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:12px;cursor:pointer;position:relative;overflow:hidden;transition:all .2s;}
.baraja-card:active{transform:scale(.98);}
.baraja-card:hover{border-color:var(--accent);box-shadow:0 0 12px rgba(0,255,157,.12);}
.baraja-card.destacada{border-color:var(--gold);box-shadow:0 0 12px rgba(245,166,35,.15);background:linear-gradient(135deg,rgba(245,166,35,.06),rgba(11,14,24,.7));}
.baraja-card.destacada::before{content:'⭐ DESTACADA';position:absolute;top:8px;right:10px;font-family:'Orbitron',sans-serif;font-size:.55rem;letter-spacing:1.5px;color:var(--gold);background:rgba(245,166,35,.1);padding:2px 8px;border-radius:3px;border:1px solid rgba(245,166,35,.3);}
.bc-titulo{font-family:'Cinzel',serif;font-size:1.1rem;font-weight:900;color:var(--text);margin-bottom:4px;padding-right:80px;}
.bc-autor{font-family:'Orbitron',sans-serif;font-size:.65rem;letter-spacing:1.5px;color:var(--accent);text-transform:uppercase;margin-bottom:8px;}
.bc-descripcion{font-size:.85rem;color:var(--muted);line-height:1.4;margin-bottom:10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.bc-meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;}
.bc-chip{font-family:'Orbitron',sans-serif;font-size:.55rem;letter-spacing:1px;padding:3px 8px;border-radius:3px;text-transform:uppercase;background:rgba(255,255,255,.04);border:1px solid var(--border);color:var(--muted);}
.bc-chip.dificultad-principiante{background:rgba(0,255,157,.08);border-color:rgba(0,255,157,.3);color:var(--accent);}
.bc-chip.dificultad-intermedio{background:rgba(0,207,255,.08);border-color:rgba(0,207,255,.3);color:var(--blue);}
.bc-chip.dificultad-avanzado{background:rgba(255,34,68,.08);border-color:rgba(255,34,68,.3);color:var(--red);}
.bc-chip.dificultad-experto{background:rgba(180,70,255,.08);border-color:rgba(180,70,255,.3);color:var(--purple);}
.bc-footer{display:flex;justify-content:space-between;align-items:center;padding-top:8px;border-top:1px solid var(--border);}
.bc-fecha{font-family:'Orbitron',sans-serif;font-size:.6rem;color:var(--muted);letter-spacing:1px;}
.bc-likes{display:flex;align-items:center;gap:4px;font-family:'Orbitron',sans-serif;font-size:.7rem;color:var(--muted);}
.bc-likes.liked{color:var(--red);}

/* ── FILTROS ── */
.filtros{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
.filtro-btn{font-family:'Orbitron',sans-serif;font-size:.6rem;letter-spacing:1.5px;padding:6px 12px;border-radius:4px;background:transparent;border:1px solid var(--border);color:var(--muted);cursor:pointer;transition:all .15s;text-transform:uppercase;}
.filtro-btn.active{background:rgba(0,255,157,.1);border-color:var(--accent);color:var(--accent);}

/* ── VISTA DETALLE ── */
#vista-detalle{display:none;}
.detalle-header{margin-bottom:16px;}
.detalle-titulo{font-family:'Cinzel Decorative',serif;font-size:1.5rem;font-weight:900;color:var(--gold);text-shadow:0 0 6px rgba(245,166,35,.3);line-height:1.2;}
.detalle-autor{font-family:'Orbitron',sans-serif;font-size:.7rem;letter-spacing:2px;color:var(--accent);margin-top:6px;text-transform:uppercase;}
.detalle-fecha{font-family:'Orbitron',sans-serif;font-size:.6rem;letter-spacing:1.5px;color:var(--muted);margin-top:3px;}
.detalle-descripcion{background:rgba(255,255,255,.02);border-left:2px solid var(--accent);padding:10px 14px;margin:12px 0;font-size:.9rem;color:var(--text);line-height:1.5;white-space:pre-wrap;}
.detalle-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}

/* ── SECCIONES DE BARAJA ── */
.deck-section{margin-bottom:16px;}
.deck-section-title{font-family:'Orbitron',sans-serif;font-size:.7rem;letter-spacing:2.5px;color:var(--muted);text-transform:uppercase;padding-bottom:8px;border-bottom:1px solid var(--border);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;}
.deck-section-title .dst-count{color:var(--accent);font-size:.65rem;}
.cartas-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
.carta-mini{position:relative;aspect-ratio:63/88;background:var(--bg3);border:1px solid var(--border);border-radius:5px;overflow:hidden;cursor:pointer;transition:transform .12s,border-color .15s;}
.carta-mini:active{transform:scale(.96);}
.carta-mini:hover{border-color:var(--accent);}
.carta-mini img{width:100%;height:100%;object-fit:cover;display:block;}
.carta-mini .carta-nombre-fallback{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-family:'Orbitron',sans-serif;font-size:.55rem;color:var(--muted);text-align:center;padding:4px;line-height:1.2;letter-spacing:.5px;}
.carta-qty{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.85);color:var(--accent);font-family:'Orbitron',sans-serif;font-size:.6rem;font-weight:900;padding:2px 6px;border-radius:3px;border:1px solid rgba(0,255,157,.4);}

/* ── ACCIONES ── */
.btn-accion{width:100%;font-family:'Orbitron',sans-serif;font-size:.75rem;font-weight:900;letter-spacing:2px;padding:14px;border-radius:6px;cursor:pointer;text-transform:uppercase;transition:all .15s;margin-bottom:8px;border:1px solid;}
.btn-primario{background:linear-gradient(135deg,var(--accent),#00c875);color:#000;border-color:var(--accent);}
.btn-primario:active{transform:scale(.98);box-shadow:0 0 20px var(--accent);}
.btn-secundario{background:var(--card);color:var(--accent);border-color:var(--accent);}
.btn-secundario:active{background:var(--accent-glow);}
.btn-peligro{background:transparent;color:var(--red);border-color:var(--red);}
.btn-like{display:flex;align-items:center;justify-content:center;gap:8px;}

/* ── MODAL ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(4px);z-index:1500;display:none;align-items:flex-end;justify-content:center;}
.modal-overlay.active{display:flex;}
.modal-content{background:var(--card);border:1px solid var(--border);border-radius:12px 12px 0 0;padding:20px 18px 30px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;}
.modal-titulo{font-family:'Orbitron',sans-serif;font-size:.9rem;letter-spacing:2px;color:var(--gold);text-transform:uppercase;margin-bottom:14px;}
.form-label{display:block;font-family:'Orbitron',sans-serif;font-size:.6rem;letter-spacing:1.5px;color:var(--muted);margin-bottom:5px;text-transform:uppercase;margin-top:12px;}
.form-input,.form-textarea,.form-select{width:100%;background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:5px;padding:10px 12px;font-family:'Rajdhani',sans-serif;font-size:.95rem;color:var(--text);}
.form-input:focus,.form-textarea:focus,.form-select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 6px rgba(0,255,157,.2);}
.form-textarea{min-height:80px;resize:vertical;font-family:inherit;}
.form-modal-actions{display:flex;gap:8px;margin-top:16px;}
.form-modal-actions button{flex:1;}

/* ── ZOOM DE CARTA ── */
#zoom-overlay{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:2000;display:none;align-items:center;justify-content:center;padding:20px;}
#zoom-overlay.active{display:flex;}
#zoom-overlay img{max-width:95%;max-height:90vh;border-radius:12px;box-shadow:0 0 30px rgba(0,255,157,.3);}
#zoom-overlay .zoom-close{position:absolute;top:20px;right:20px;background:var(--card);border:1px solid var(--border);color:var(--text);width:44px;height:44px;border-radius:50%;font-size:1.2rem;cursor:pointer;}

/* ── ADMIN BADGE ── */
.admin-badge{display:inline-block;background:rgba(180,70,255,.15);color:var(--purple);border:1px solid rgba(180,70,255,.3);padding:2px 8px;border-radius:3px;font-family:'Orbitron',sans-serif;font-size:.55rem;letter-spacing:1.5px;margin-left:8px;text-transform:uppercase;}
.admin-actions{background:rgba(180,70,255,.05);border:1px dashed rgba(180,70,255,.3);border-radius:6px;padding:10px 12px;margin-top:14px;}
.admin-actions-title{font-family:'Orbitron',sans-serif;font-size:.6rem;letter-spacing:1.5px;color:var(--purple);margin-bottom:8px;text-transform:uppercase;}
.admin-actions button{margin-bottom:6px;}

/* ── LOADING ── */
.loading-msg{text-align:center;color:var(--muted);font-size:.85rem;font-style:italic;padding:20px;}

/* ── TOAST ── */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--card);border:1px solid var(--accent);color:var(--text);padding:12px 20px;border-radius:8px;font-family:'Orbitron',sans-serif;font-size:.75rem;letter-spacing:1px;box-shadow:0 0 15px rgba(0,255,157,.3);z-index:3000;transition:transform .3s;max-width:90%;text-align:center;}
.toast.show{transform:translateX(-50%) translateY(0);}
.toast.error{border-color:var(--red);box-shadow:0 0 15px rgba(255,34,68,.3);}
</style>
</head>
<body>
<div id="wrap">

  <header>
    <a href="index.html" class="back-btn">←</a>
    <div class="header-title">
      <div class="h-tag">Choque de Héroes TCG</div>
      <div class="h-title">Academia Heroica</div>
      <div class="h-subtitle">Barajas · Estrategias · Consejos</div>
    </div>
  </header>

  <!-- VISTA LISTADO -->
  <div id="vista-listado">
    <div id="admin-panel" style="display:none;" class="card">
      <div class="badge" style="color:var(--purple);background:rgba(180,70,255,.08);border-color:rgba(180,70,255,.3);">🛡️ MODO ADMIN</div>
      <p style="font-size:.85rem;color:var(--muted);margin-bottom:10px;">Puedes publicar barajas desde el constructor y editar/eliminar las tuyas desde aquí.</p>
      <button class="btn-accion btn-primario" onclick="window.location.href='constructor.html'">📚 IR AL CONSTRUCTOR</button>
    </div>

    <div class="card">
      <div class="badge gold">📚 BARAJAS COMPARTIDAS</div>
      <div class="filtros">
        <button class="filtro-btn active" data-filtro="todas" onclick="filtrar('todas')">TODAS</button>
        <button class="filtro-btn" data-filtro="destacadas" onclick="filtrar('destacadas')">⭐ DESTACADAS</button>
        <button class="filtro-btn" data-filtro="mis_likes" onclick="filtrar('mis_likes')">❤️ MIS FAVORITAS</button>
      </div>
      <div id="listado-container">
        <div class="loading-msg">⏳ Cargando barajas...</div>
      </div>
    </div>
  </div>

  <!-- VISTA DETALLE -->
  <div id="vista-detalle">
    <button class="btn-accion btn-secundario" onclick="volverAlListado()" style="margin-bottom:14px;">← VOLVER</button>

    <div class="card" id="detalle-container">
      <div class="loading-msg">⏳ Cargando baraja...</div>
    </div>
  </div>

</div>

<!-- Modal edición -->
<div class="modal-overlay" id="edit-modal" onclick="if(event.target===this)cerrarEditModal()">
  <div class="modal-content">
    <div class="modal-titulo">✏️ Editar Baraja</div>
    <label class="form-label">Título</label>
    <input type="text" class="form-input" id="edit-titulo" maxlength="60">
    <label class="form-label">Descripción</label>
    <textarea class="form-textarea" id="edit-descripcion" maxlength="500"></textarea>
    <label class="form-label">Arquetipo (mixto separado por coma)</label>
    <input type="text" class="form-input" id="edit-arquetipo" maxlength="80" placeholder="Ej: Hermandad, Túneles Perdidos">
    <label class="form-label">Dificultad</label>
    <select class="form-select" id="edit-dificultad">
      <option value="principiante">Principiante</option>
      <option value="intermedio">Intermedio</option>
      <option value="avanzado">Avanzado</option>
      <option value="experto">Experto</option>
    </select>
    <div class="form-modal-actions">
      <button class="btn-accion btn-secundario" onclick="cerrarEditModal()">CANCELAR</button>
      <button class="btn-accion btn-primario" onclick="confirmarEdicion()">GUARDAR</button>
    </div>
  </div>
</div>

<!-- Zoom carta -->
<div id="zoom-overlay" onclick="cerrarZoom()">
  <button class="zoom-close" onclick="cerrarZoom();event.stopPropagation();">✕</button>
  <img id="zoom-img" src="" alt="">
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ══════════════════════════════════════════════════════════════
//  CONFIGURACIÓN — EDITAR CON EL URL DE TU APPS SCRIPT DEPLOY
// ══════════════════════════════════════════════════════════════
const ACADEMIA_URL = 'PON_AQUI_EL_URL_DEL_APPS_SCRIPT';

// ══════════════════════════════════════════════════════════════
//  ESTADO
// ══════════════════════════════════════════════════════════════
let jugador = null;
let esAdmin = false;
let allCards = [];
let barajas = [];
let misLikes = new Set();
let filtroActual = 'todas';
let barajaActual = null;

// ══════════════════════════════════════════════════════════════
//  INIT
// ══════════════════════════════════════════════════════════════
window.addEventListener('load', async () => {
  // Cargar sesión
  const saved = localStorage.getItem('nhSesion');
  if (saved) {
    try {
      const s = JSON.parse(saved);
      if (s.tipo !== 'tienda') jugador = s;
    } catch(e) {}
  }

  // Cargar catálogo de cartas y admin en paralelo
  await Promise.all([
    cargarCatalogo(),
    verificarAdmin(),
    cargarMisLikes()
  ]);

  // Si viene con ?baraja=xxx, ir directo al detalle
  const urlParams = new URLSearchParams(window.location.search);
  const barajaId = urlParams.get('baraja');
  if (barajaId) {
    verBaraja(barajaId);
  } else {
    cargarListado();
  }
});

async function cargarCatalogo() {
  try {
    const res = await fetch('cartas.json');
    allCards = await res.json();
  } catch(e) {
    console.error('Error cargando cartas.json:', e);
    allCards = [];
  }
}

async function verificarAdmin() {
  if (!jugador) return;
  document.getElementById('admin-panel').style.display = 'none';
  try {
    const res = await fetch(`${ACADEMIA_URL}?action=es_admin&player_id=${encodeURIComponent(jugador.id)}`);
    const data = await res.json();
    esAdmin = data.es_admin === true;
    if (esAdmin) document.getElementById('admin-panel').style.display = 'block';
  } catch(e) {
    console.warn('No se pudo verificar admin:', e);
  }
}

async function cargarMisLikes() {
  if (!jugador) return;
  try {
    const res = await fetch(`${ACADEMIA_URL}?action=mis_likes&player_id=${encodeURIComponent(jugador.id)}`);
    const data = await res.json();
    if (data.status === 'ok') misLikes = new Set(data.likes);
  } catch(e) {}
}

// ══════════════════════════════════════════════════════════════
//  LISTADO
// ══════════════════════════════════════════════════════════════
async function cargarListado() {
  const cont = document.getElementById('listado-container');
  cont.innerHTML = '<div class="loading-msg">⏳ Cargando barajas...</div>';
  try {
    const res = await fetch(`${ACADEMIA_URL}?action=listar`);
    const data = await res.json();
    if (data.status !== 'ok') throw new Error(data.message);
    barajas = data.barajas || [];
    renderListado();
  } catch(e) {
    cont.innerHTML = `<div class="empty-msg">⚠️ Error: ${e.message}</div>`;
  }
}

function renderListado() {
  const cont = document.getElementById('listado-container');
  let filtradas = barajas;

  if (filtroActual === 'destacadas') {
    filtradas = barajas.filter(b => b.destacado);
  } else if (filtroActual === 'mis_likes') {
    filtradas = barajas.filter(b => misLikes.has(b.id));
  }

  if (!filtradas.length) {
    cont.innerHTML = `<div class="empty-msg">📋 Sin barajas en esta vista.</div>`;
    return;
  }

  cont.innerHTML = filtradas.map(b => {
    const dif = (b.dificultad || 'intermedio').toLowerCase();
    const arqs = (b.arquetipo || '').split(',').map(a=>a.trim()).filter(Boolean);
    const yaLike = misLikes.has(b.id);
    const fecha = b.fecha ? new Date(b.fecha).toLocaleDateString('es-MX', {day:'2-digit',month:'short',year:'numeric'}) : '';
    return `<div class="baraja-card ${b.destacado?'destacada':''}" onclick="verBaraja('${b.id}')">
      <div class="bc-titulo">${escape(b.titulo)}</div>
      <div class="bc-autor">👤 ${escape(b.autor_nombre || b.autor_id)}</div>
      ${b.descripcion ? `<div class="bc-descripcion">${escape(b.descripcion)}</div>` : ''}
      <div class="bc-meta">
        <span class="bc-chip dificultad-${dif}">${dif}</span>
        ${arqs.map(a => `<span class="bc-chip">${escape(a)}</span>`).join('')}
      </div>
      <div class="bc-footer">
        <span class="bc-fecha">${fecha}</span>
        <span class="bc-likes ${yaLike?'liked':''}">${yaLike?'❤️':'🤍'} ${b.likes}</span>
      </div>
    </div>`;
  }).join('');
}

function filtrar(f) {
  filtroActual = f;
  document.querySelectorAll('.filtro-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.filtro === f);
  });
  renderListado();
}

// ══════════════════════════════════════════════════════════════
//  DETALLE
// ══════════════════════════════════════════════════════════════
async function verBaraja(id) {
  document.getElementById('vista-listado').style.display = 'none';
  document.getElementById('vista-detalle').style.display = 'block';
  window.scrollTo(0,0);
  const cont = document.getElementById('detalle-container');
  cont.innerHTML = '<div class="loading-msg">⏳ Cargando baraja...</div>';

  try {
    const res = await fetch(`${ACADEMIA_URL}?action=obtener&id=${encodeURIComponent(id)}`);
    const data = await res.json();
    if (data.status !== 'ok') throw new Error(data.message);
    barajaActual = data.baraja;
    renderDetalle(barajaActual);

    // Marcar como visto para notificaciones
    localStorage.setItem('chh_last_academia', id);
  } catch(e) {
    cont.innerHTML = `<div class="empty-msg">⚠️ Error: ${e.message}</div>`;
  }
}

function renderDetalle(b) {
  const cont = document.getElementById('detalle-container');
  const dif = (b.dificultad || 'intermedio').toLowerCase();
  const arqs = (b.arquetipo || '').split(',').map(a=>a.trim()).filter(Boolean);
  const yaLike = misLikes.has(b.id);
  const fecha = b.fecha ? new Date(b.fecha).toLocaleDateString('es-MX', {day:'2-digit',month:'long',year:'numeric'}) : '';
  const esAutor = jugador && jugador.id && jugador.id.toUpperCase() === (b.autor_id||'').toUpperCase();

  cont.innerHTML = `
    <div class="detalle-header">
      <div class="detalle-titulo">${escape(b.titulo)} ${b.destacado?'<span style="color:var(--gold);font-size:1rem;">⭐</span>':''}</div>
      <div class="detalle-autor">👤 ${escape(b.autor_nombre || b.autor_id)}</div>
      <div class="detalle-fecha">${fecha}</div>
      <div class="detalle-meta">
        <span class="bc-chip dificultad-${dif}">${dif}</span>
        ${arqs.map(a => `<span class="bc-chip">${escape(a)}</span>`).join('')}
      </div>
    </div>
    ${b.descripcion ? `<div class="detalle-descripcion">${escape(b.descripcion)}</div>` : ''}

    ${renderDeckSection('Baraja Principal (BP)', b.bp, 40)}
    ${renderDeckSection('Baraja de Almas (BA)', b.ba, 15)}
    ${renderDeckSection('Baraja de Amalgamas (BS)', b.bs, 15)}

    <div style="margin-top:20px;">
      <button class="btn-accion btn-primario" onclick="copiarAlConstructor()">📥 CARGAR EN MI CONSTRUCTOR</button>
      <button class="btn-accion btn-secundario btn-like ${yaLike?'liked':''}" onclick="darLike()">
        ${yaLike ? '❤️ TE GUSTA' : '🤍 ME GUSTA'} · ${b.likes}
      </button>
    </div>

    ${esAdmin && esAutor ? renderAdminActions(b) : ''}
  `;
}

function renderDeckSection(titulo, cartas, max) {
  if (!cartas || !cartas.length) return '';
  const total = cartas.reduce((s,c) => s + (c.cant||1), 0);

  const cartasHTML = cartas.map(c => {
    const info = allCards.find(x => String(x.id) === String(c.id));
    if (!info) {
      return `<div class="carta-mini" title="Carta no encontrada: ${c.id}">
        <div class="carta-nombre-fallback">${escape(c.id)}</div>
        <span class="carta-qty">x${c.cant}</span>
      </div>`;
    }
    return `<div class="carta-mini" onclick="abrirZoom('${escapeAttr(info.imagen || info.miniatura)}', '${escapeAttr(info.nombre)}')" title="${escape(info.nombre)}">
      ${info.miniatura ? `<img src="${escapeAttr(info.miniatura)}" alt="${escape(info.nombre)}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';"><div class="carta-nombre-fallback" style="display:none">${escape(info.nombre)}</div>` : `<div class="carta-nombre-fallback">${escape(info.nombre)}</div>`}
      <span class="carta-qty">x${c.cant}</span>
    </div>`;
  }).join('');

  return `<div class="deck-section">
    <div class="deck-section-title">
      <span>${titulo}</span>
      <span class="dst-count">${total}${max?'/'+max:''}</span>
    </div>
    <div class="cartas-grid">${cartasHTML}</div>
  </div>`;
}

function renderAdminActions(b) {
  return `<div class="admin-actions">
    <div class="admin-actions-title">🛡️ Acciones de autor</div>
    <button class="btn-accion btn-secundario" onclick="abrirEditModal()">✏️ EDITAR</button>
    <button class="btn-accion btn-peligro" onclick="eliminarBaraja()">🗑️ ELIMINAR</button>
  </div>`;
}

function volverAlListado() {
  document.getElementById('vista-detalle').style.display = 'none';
  document.getElementById('vista-listado').style.display = 'block';
  barajaActual = null;
  window.scrollTo(0,0);
}

// ══════════════════════════════════════════════════════════════
//  ZOOM DE CARTA
// ══════════════════════════════════════════════════════════════
function abrirZoom(src, nombre) {
  if (!src) return;
  const overlay = document.getElementById('zoom-overlay');
  const img = document.getElementById('zoom-img');
  img.src = src;
  img.alt = nombre;
  overlay.classList.add('active');
}
function cerrarZoom() {
  document.getElementById('zoom-overlay').classList.remove('active');
}

// ══════════════════════════════════════════════════════════════
//  COPIAR AL CONSTRUCTOR
// ══════════════════════════════════════════════════════════════
function copiarAlConstructor() {
  if (!barajaActual) return;
  if (!jugador) {
    toast('Debes iniciar sesión primero', true);
    return;
  }

  // Expandir formato compacto {id, cant} a array plano tipo constructor
  const expandir = (arr) => {
    const out = [];
    arr.forEach(c => {
      const info = allCards.find(x => String(x.id) === String(c.id));
      if (info) for (let i = 0; i < (c.cant||1); i++) out.push(info);
    });
    return out;
  };

  const nuevaBaraja = {
    name: `${barajaActual.titulo} (de ${barajaActual.autor_nombre})`,
    date: new Date().toISOString(),
    decks: {
      BP: expandir(barajaActual.bp),
      BA: expandir(barajaActual.ba),
      BS: expandir(barajaActual.bs)
    }
  };

  const saved = JSON.parse(localStorage.getItem('chh_decks') || '[]');
  saved.push(nuevaBaraja);
  localStorage.setItem('chh_decks', JSON.stringify(saved));

  toast('✅ Baraja copiada a tu constructor');
  setTimeout(() => { window.location.href = 'constructor.html'; }, 1200);
}

// ══════════════════════════════════════════════════════════════
//  LIKE
// ══════════════════════════════════════════════════════════════
async function darLike() {
  if (!jugador) {
    toast('Debes iniciar sesión primero', true);
    return;
  }
  if (!barajaActual) return;
  try {
    const url = `${ACADEMIA_URL}?action=like&baraja_id=${encodeURIComponent(barajaActual.id)}&player_id=${encodeURIComponent(jugador.id)}`;
    const res = await fetch(url, { method: 'POST' });
    const data = await res.json();
    if (data.status !== 'ok') throw new Error(data.message);
    if (data.liked) {
      misLikes.add(barajaActual.id);
      barajaActual.likes += 1;
    } else {
      misLikes.delete(barajaActual.id);
      barajaActual.likes = Math.max(0, barajaActual.likes - 1);
    }
    renderDetalle(barajaActual);
  } catch(e) {
    toast('Error al dar like: ' + e.message, true);
  }
}

// ══════════════════════════════════════════════════════════════
//  EDITAR / ELIMINAR
// ══════════════════════════════════════════════════════════════
function abrirEditModal() {
  if (!barajaActual) return;
  document.getElementById('edit-titulo').value = barajaActual.titulo || '';
  document.getElementById('edit-descripcion').value = barajaActual.descripcion || '';
  document.getElementById('edit-arquetipo').value = barajaActual.arquetipo || '';
  document.getElementById('edit-dificultad').value = barajaActual.dificultad || 'intermedio';
  document.getElementById('edit-modal').classList.add('active');
}
function cerrarEditModal() {
  document.getElementById('edit-modal').classList.remove('active');
}

async function confirmarEdicion() {
  if (!barajaActual || !jugador) return;
  const titulo = document.getElementById('edit-titulo').value.trim();
  if (!titulo) { toast('El título es obligatorio', true); return; }
  const body = new URLSearchParams({
    action: 'editar',
    id: barajaActual.id,
    autor_id: jugador.id,
    titulo,
    descripcion: document.getElementById('edit-descripcion').value.trim(),
    arquetipo:   document.getElementById('edit-arquetipo').value.trim(),
    dificultad:  document.getElementById('edit-dificultad').value
  });
  try {
    const res = await fetch(ACADEMIA_URL, { method:'POST', body });
    const data = await res.json();
    if (data.status !== 'ok') throw new Error(data.message);
    toast('✅ Baraja actualizada');
    cerrarEditModal();
    verBaraja(barajaActual.id);
  } catch(e) {
    toast('Error: ' + e.message, true);
  }
}

async function eliminarBaraja() {
  if (!barajaActual || !jugador) return;
  if (!confirm('¿Eliminar esta baraja de la Academia? No se puede deshacer.')) return;
  const body = new URLSearchParams({
    action: 'eliminar',
    id: barajaActual.id,
    autor_id: jugador.id
  });
  try {
    const res = await fetch(ACADEMIA_URL, { method:'POST', body });
    const data = await res.json();
    if (data.status !== 'ok') throw new Error(data.message);
    toast('✅ Baraja eliminada');
    setTimeout(() => volverAlListado(), 1000);
    cargarListado();
  } catch(e) {
    toast('Error: ' + e.message, true);
  }
}

// ══════════════════════════════════════════════════════════════
//  UTILIDADES
// ══════════════════════════════════════════════════════════════
function escape(s) {
  return String(s||'').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}
function escapeAttr(s) {
  return String(s||'').replace(/["'&<>]/g, ch => ({'"':'&quot;',"'":'&#39;','&':'&amp;','<':'&lt;','>':'&gt;'}[ch]));
}
function toast(msg, isError) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.toggle('error', !!isError);
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2800);
}
</script>
