<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<script src="config.js"></script><script src="nucleo.js"></script>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#04061a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="manifest.json">
<title>Choque de Héroes TCG</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<!--
  CORTINA DE INICIO
  1) © 2016–2026 CODEX STUDIO   2) Logo 1 (fade)   3) Logo 2 (fade)   4) Pantalla de título → index.html
  Imágenes opcionales en assets/inicio/ (si no existen se usan las de siempre):
    logo_1.png        primer logo      (si falta: footer-logo.png)
    logo_2.png        segundo logo     (si falta: assets/nexotlan/titulo/logo.png)
    titulo_logo.png   logo del título  (si falta: logo-hd.png)
    titulo_fondo.jpg  fondo del título (si falta: fondo generado)
    titulo_heroe.png  héroe del título (opcional)
    titulo.mp3        música del título (suena si el navegador lo permite)
    comenzar.mp3      sonido al pulsar el botón de inicio (si falta: sonido sintetizado)
  Tocar durante los logos los salta. Dentro de la misma sesión se va directo al título.
-->
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#04061a;--steel:#2b3f86;--violet:#8b5cff;--cyan:#36d6ff;--gold:#f5c842;--txt:#eef2ff;--mut:#8d9bc7}
html,body{height:100%;background:var(--ink);color:var(--txt);overflow:hidden;font-family:'Rajdhani',system-ui,sans-serif;
  -webkit-tap-highlight-color:transparent;user-select:none}
.scene{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;opacity:0;pointer-events:none;transition:opacity .9s ease}
.scene.on{opacity:1;pointer-events:auto}

/* 1 · Estudio */
#sStudio{background:#000;gap:14px}
#sStudio .yr{font-family:'Orbitron',sans-serif;font-weight:500;font-size:clamp(11px,2.6vw,14px);letter-spacing:.5em;color:var(--mut);padding-left:.5em}
#sStudio .nm{font-family:'Orbitron',sans-serif;font-weight:900;font-size:clamp(26px,7.2vw,58px);letter-spacing:.32em;padding-left:.32em;color:#fff}
#sStudio .ln{height:1px;width:0;background:linear-gradient(90deg,transparent,var(--cyan),var(--gold),transparent);transition:width 1.6s cubic-bezier(.2,.8,.2,1)}
#sStudio.on .ln{width:min(70vw,460px)}
#sStudio .nm span{display:inline-block;opacity:0;transform:translateY(8px);transition:opacity .5s,transform .5s}
#sStudio.on .nm span{opacity:1;transform:none}

/* 2 y 3 · Logos */
.slogo{background:#000}
.slogo img{width:min(52vw,360px);max-height:46vh;object-fit:contain;opacity:0;transform:scale(.96);transition:opacity 1.1s ease,transform 2.6s ease}
.slogo.on img{opacity:1;transform:scale(1)}

/* 4 · Título */
#sTitle{background:var(--ink);overflow:hidden;cursor:pointer}
#sTitle .bgimg{position:absolute;inset:0;background:center/cover no-repeat;opacity:.55}
#sTitle .shaft{position:absolute;top:-40%;height:180%;width:34vmax;transform:rotate(38deg);transform-origin:center;
  background:linear-gradient(90deg,rgba(43,63,134,0),rgba(70,105,200,.7) 40%,rgba(43,63,134,.35) 70%,rgba(43,63,134,0))}
#sTitle .s1{left:18%}
#sTitle .s2{left:52%;width:16vmax;opacity:.6}
#sTitle .s3{left:-14%;width:10vmax;opacity:.45}
#sTitle .vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,transparent 30%,rgba(4,6,26,.85) 85%),
  linear-gradient(180deg,rgba(4,6,26,.6),transparent 30%,transparent 70%,rgba(30,10,60,.7))}
#sTitle .scan{position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(255,255,255,.025) 3px 4px);pointer-events:none}
.mote{position:absolute;width:3px;height:3px;border-radius:50%;background:#8fb0ff;box-shadow:0 0 6px #6f8cff;opacity:0;animation:mote linear infinite}
@keyframes mote{0%{opacity:0;transform:translateY(0)}15%{opacity:.9}100%{opacity:0;transform:translateY(-38vh)}}
#sTitle .hero{position:absolute;bottom:0;right:4%;height:78%;object-fit:contain;opacity:0;filter:drop-shadow(0 0 30px rgba(139,92,255,.35));transition:opacity 1.4s .3s}
#sTitle.on .hero.ok{opacity:.9}
#sTitle .core{position:relative;display:flex;flex-direction:column;align-items:center;gap:clamp(18px,4vh,40px);z-index:2}
#sTitle .logo{width:min(78vw,520px);max-height:52vh;object-fit:contain;
  filter:drop-shadow(0 0 22px rgba(54,214,255,.45)) drop-shadow(0 10px 30px rgba(0,0,0,.8));transform:scale(.9);opacity:0;transition:transform 1.2s cubic-bezier(.2,.9,.25,1.15),opacity .9s}
#sTitle.on .logo{transform:none;opacity:1}
/* el triángulo de MD → un rombo escalonado tipo greca detrás del logo */
#sTitle .glyph{position:absolute;top:50%;left:50%;width:min(70vw,440px);aspect-ratio:1;transform:translate(-50%,-56%) rotate(45deg);
  border:1.5px solid rgba(143,176,255,.35);box-shadow:0 0 30px rgba(54,214,255,.15) inset;opacity:0;transition:opacity 1.6s .4s}
#sTitle .glyph::after{content:'';position:absolute;inset:14px;border:1px solid rgba(245,200,66,.22)}
#sTitle.on .glyph{opacity:1}
#press{font-family:'Orbitron',sans-serif;font-weight:700;font-size:clamp(12px,3vw,16px);letter-spacing:.42em;padding-left:.42em;color:#fff;
  display:flex;align-items:center;gap:14px;opacity:0;transition:opacity .6s 1s;background:none;border:0;cursor:pointer}
#sTitle.on #press{opacity:1;animation:blink 2.2s 1.6s ease-in-out infinite}
#press i{font-style:normal;width:30px;height:30px;border-radius:50%;border:2px solid #fff;display:inline-flex;align-items:center;justify-content:center;font-size:13px;letter-spacing:0;padding:0}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
.corner{position:absolute;font-size:clamp(11px,2.4vw,14px);font-weight:600;color:#c8d4f5;line-height:1.5;z-index:2;letter-spacing:.04em}
.tl{top:max(16px,env(safe-area-inset-top));left:max(18px,env(safe-area-inset-left))}
.bl{bottom:max(16px,env(safe-area-inset-bottom));left:max(18px,env(safe-area-inset-left));color:var(--mut)}
.br{bottom:max(14px,env(safe-area-inset-bottom));right:max(18px,env(safe-area-inset-right))}
.br img{width:42px;opacity:.75}
.fx{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:50}
.fx.go{animation:flash .7s ease-out forwards}
@keyframes flash{0%{opacity:0}25%{opacity:.9}100%{opacity:0}}
body.out .scene{transition:opacity .45s;opacity:0}
#skip{position:fixed;right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));z-index:40;font-family:'Orbitron',sans-serif;
  font-size:10px;letter-spacing:.3em;color:#7d8ab3;background:none;border:1px solid #2a3561;border-radius:20px;padding:7px 12px;opacity:.7}
#skip[hidden]{display:none}
@media (orientation:portrait){#sTitle .hero{right:-18%;height:62%;opacity:0}#sTitle.on .hero.ok{opacity:.5}}
@media (prefers-reduced-motion:reduce){.mote,#press{animation:none!important}#sTitle .logo,.slogo img{transition:opacity .6s}}
</style>
</head>
<body>
<section class="scene" id="sStudio" aria-label="Codex Studio">
  <div class="yr">© 2016–2026</div>
  <div class="ln"></div>
  <div class="nm" id="studioName"></div>
  <div class="ln"></div>
</section>
<section class="scene slogo" id="sLogo1"><img id="logo1" alt=""></section>
<section class="scene slogo" id="sLogo2"><img id="logo2" alt=""></section>
<section class="scene" id="sTitle" aria-label="Pantalla de título">
  <div class="bgimg" id="tBg"></div>
  <div class="shaft s3"></div><div class="shaft s1"></div><div class="shaft s2"></div>
  <div id="motes"></div>
  <img class="hero" id="tHero" alt="">
  <div class="vig"></div><div class="scan"></div>
  <div class="glyph"></div>
  <div class="core">
    <img class="logo" id="tLogo" src="logo-hd.png" alt="Choque de Héroes · Nexo de Héroes">
    <button id="press" type="button"><span id="pressTxt">TOCA PARA COMENZAR</span></button>
  </div>
  <div class="corner tl"><div id="ver">Ver. —</div><div id="pid">Jugador: invitado</div></div>
  <div class="corner bl">© 2016–2026 Codex Studio · Codex Cómics</div>
  <div class="corner br"><img src="footer-logo.png" alt=""></div>
</section>
<div class="fx" id="fx"></div>
<button id="skip" type="button" hidden>OMITIR</button>

<script>
(function(){
  var $=function(id){return document.getElementById(id);};
  var DIR='assets/inicio/';
  function probar(lista){return new Promise(function(res){var i=0;(function sig(){if(i>=lista.length)return res(null);var u=lista[i++],im=new Image();im.onload=function(){res(u);};im.onerror=sig;im.src=u;})();});}
  var studio='CODEX STUDIO';
  $('studioName').innerHTML=studio.split('').map(function(c,i){return '<span style="transition-delay:'+(0.25+i*0.06)+'s">'+(c===' '?'&nbsp;':c)+'</span>';}).join('');

  // Recursos (cada uno con su respaldo)
  var listos=Promise.all([
    probar([DIR+'logo_1.png',DIR+'logo_1.webp','footer-logo.png']),
    probar([DIR+'logo_2.png',DIR+'logo_2.webp','assets/nexotlan/titulo/logo.png']),
    probar([DIR+'titulo_logo.png',DIR+'titulo_logo.webp','logo-hd.png']),
    probar([DIR+'titulo_fondo.jpg',DIR+'titulo_fondo.webp']),
    probar([DIR+'titulo_heroe.png',DIR+'titulo_heroe.webp'])
  ]).then(function(r){
    if(r[0])$('logo1').src=r[0];
    if(r[1])$('logo2').src=r[1];
    if(r[2])$('tLogo').src=r[2];
    if(r[3])$('tBg').style.backgroundImage='url("'+r[3]+'")';
    if(r[4]){$('tHero').src=r[4];$('tHero').classList.add('ok');}
    return r;
  });

  // Datos de la esquina: versión (de sw.js) e ID del jugador
  fetch('sw.js',{cache:'no-cache'}).then(function(r){return r.text();}).then(function(t){var m=t.match(/CACHE_NAME\s*=\s*['"][^'"]*?v(\d+)['"]/);if(m)$('ver').textContent='Ver. '+(m[1]/100).toFixed(2);}).catch(function(){});
  try{var s=JSON.parse(localStorage.getItem('nhSesion')||'null');if(s&&s.id)$('pid').textContent=(s.tipo==='tienda'?'Tienda: ':'Jugador: ')+s.id;}catch(e){}

  // Partículas del título
  var mo=$('motes');for(var k=0;k<26;k++){var d=document.createElement('i');d.className='mote';d.style.left=Math.random()*100+'%';d.style.top=(45+Math.random()*60)+'%';
    d.style.animationDuration=(7+Math.random()*9)+'s';d.style.animationDelay=(-Math.random()*12)+'s';mo.appendChild(d);}

  var escenas=['sStudio','sLogo1','sLogo2','sTitle'], actual=-1, timers=[], enTitulo=false, saliendo=false;
  function mostrar(i){escenas.forEach(function(id,j){$(id).classList.toggle('on',j===i);});actual=i;}
  function limpiar(){timers.forEach(clearTimeout);timers=[];}
  function titulo(){
    limpiar();enTitulo=true;$('skip').hidden=true;mostrar(3);
    try{sessionStorage.setItem('chh_boot_visto','1');}catch(e){}
    musicaTitulo();
    if(window.GP_CFG)setTimeout(function(){try{if(window.GP&&GP.activo())GP.enfocar($('press'));}catch(e){}},400);
  }
  function secuencia(){
    var t=0;
    timers.push(setTimeout(function(){mostrar(0);},(t+=250)));
    timers.push(setTimeout(function(){mostrar(-1);},(t+=2900)));
    timers.push(setTimeout(function(){mostrar(1);},(t+=900)));
    timers.push(setTimeout(function(){mostrar(-1);},(t+=2300)));
    timers.push(setTimeout(function(){mostrar(2);},(t+=900)));
    timers.push(setTimeout(function(){mostrar(-1);},(t+=2300)));
    timers.push(setTimeout(titulo,(t+=800)));
  }

  // Música del título (solo si el navegador permite reproducir sin tocar antes)
  var aud=null;
  function musicaTitulo(){
    try{if(localStorage.getItem('bgm_muted')==='1'||localStorage.getItem('chh_bgm_mute')==='1')return;}catch(e){}
    fetch(DIR+'titulo.mp3',{method:'HEAD'}).then(function(r){if(!r.ok)return;aud=new Audio(DIR+'titulo.mp3');aud.loop=true;aud.volume=.55;aud.play().catch(function(){});}).catch(function(){});
  }
  // Sonido al comenzar: assets/inicio/comenzar.mp3 si existe; si no, el sintetizado
  var sfx=null;
  try{fetch(DIR+'comenzar.mp3',{method:'HEAD'}).then(function(r){if(!r.ok)return;sfx=new Audio(DIR+'comenzar.mp3');sfx.preload='auto';sfx.volume=.9;sfx.load();}).catch(function(){});}catch(e){}
  function sonInicio(){
    if(sfx){try{sfx.currentTime=0;var p=sfx.play();if(p&&p.catch)p.catch(function(){});return;}catch(e){}}
    try{var C=new (window.AudioContext||window.webkitAudioContext)(),t=C.currentTime+.02;
      [[392,0],[587.3,.09],[784,.18],[1174.7,.27]].forEach(function(n){var o=C.createOscillator(),g=C.createGain();o.type='triangle';o.frequency.value=n[0];
        g.gain.setValueAtTime(0,t+n[1]);g.gain.linearRampToValueAtTime(.18,t+n[1]+.01);g.gain.exponentialRampToValueAtTime(.001,t+n[1]+.6);o.connect(g);g.connect(C.destination);o.start(t+n[1]);o.stop(t+n[1]+.65);});
    }catch(e){}
  }
  function comenzar(){
    if(saliendo)return;saliendo=true;
    sonInicio();try{navigator.vibrate&&navigator.vibrate(30);}catch(e){}
    try{if(window.GP&&GP.vibrar)GP.vibrar(120,.6);}catch(e){}
    $('fx').classList.add('go');
    if(aud){var a=aud,v=a.volume,iv=setInterval(function(){v-=.08;if(v<=0){clearInterval(iv);a.pause();}else a.volume=v;},40);}
    // Con sonido propio se espera a que termine (máximo 2.5 s) antes de pasar al menú
    var dur=(sfx&&isFinite(sfx.duration)&&sfx.duration>0)?Math.min(2500,Math.max(850,sfx.duration*1000)):850;
    setTimeout(function(){document.body.classList.add('out');},dur-500);
    setTimeout(function(){location.href='index.html';},dur);
  }
  $('sTitle').addEventListener('click',function(){if(enTitulo)comenzar();});
  $('press').addEventListener('click',function(e){e.stopPropagation();if(enTitulo)comenzar();});
  // Tocar durante la cortina la salta
  function saltar(){if(!enTitulo)titulo();}
  ['sStudio','sLogo1','sLogo2'].forEach(function(id){$(id).addEventListener('click',saltar);});
  $('skip').addEventListener('click',saltar);
  document.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '||e.key==='Escape'){e.preventDefault();enTitulo?comenzar():saltar();}});
  window.GP_CFG={principal:function(){return enTitulo?$('press'):$('skip');},inicial:function(){return enTitulo?$('press'):$('skip');},principalTxt:'Comenzar'};
  var gpTxt=function(){try{if(window.GP&&GP.activo())$('pressTxt').innerHTML='PRESIONA <i>A</i>';}catch(e){}};
  window.addEventListener('gamepadconnected',function(){setTimeout(gpTxt,200);});

  var visto=false;try{visto=sessionStorage.getItem('chh_boot_visto')==='1';}catch(e){}
  listos.then(function(){if(visto)titulo();else{$('skip').hidden=false;secuencia();}});
  setTimeout(function(){if(actual===-1&&!enTitulo&&!timers.length)titulo();},4000);   // por si una imagen tarda demasiado
})();
</script>
<script src="gamepad.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js', {scope:'./'})
      .then(function(reg){ if(reg.waiting) reg.waiting.postMessage({type:'SKIP_WAITING'}); })
      .catch(function(err){ console.log('[Boot] SW error:',err); });
  }
</script>
</body>
</html>
