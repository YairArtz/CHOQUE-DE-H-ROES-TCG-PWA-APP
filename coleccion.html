<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="theme-color" content="#03050a">
  <title>Mi Colección — Nexo de Héroes</title>
  <link rel="manifest" href="manifest.json"/>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    :root{
      --gold:#f5a623; --purple:#cc55ff;
      --bg:#03050a; --card:rgba(10,12,24,0.97);
      --border:#1c1a2e; --text:#e0eeff; --muted:#6a7f9a;
      --danger:#ff4d6d;
    }
    html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:'Rajdhani',sans-serif;-webkit-tap-highlight-color:transparent;}
    body{min-height:100vh;overflow-x:hidden;position:relative;}
    body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(245,166,35,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(204,85,255,.025) 1px,transparent 1px);background-size:44px 44px;pointer-events:none;z-index:0;}
    body::after{content:'';position:fixed;top:-20%;left:50%;transform:translateX(-50%);width:700px;height:500px;background:radial-gradient(ellipse,rgba(204,85,255,.07) 0%,transparent 70%);pointer-events:none;z-index:0;}

    /* NAV */
    #chh-nav{position:sticky;top:0;z-index:50;background:rgba(3,5,10,.96);border-bottom:1px solid var(--border);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:flex;align-items:center;padding:8px 14px;gap:10px;}
    #chh-nav::after{content:'';position:absolute;bottom:0;left:5%;right:5%;height:1px;background:linear-gradient(90deg,transparent,var(--gold),var(--purple),transparent);opacity:.6;}
    .nav-back{font-family:'Orbitron',sans-serif;font-size:9px;font-weight:700;letter-spacing:1.5px;color:#fff;background:linear-gradient(135deg,#c0182f,#7a0d1d);border:1px solid #ff3b55;padding:6px 10px;border-radius:4px;text-decoration:none;white-space:nowrap;}
    .nav-back:active{transform:scale(.96);}
    .nav-title{flex:1;text-align:center;font-family:'Orbitron',sans-serif;font-size:11px;font-weight:900;letter-spacing:2px;color:var(--gold);text-shadow:0 0 8px rgba(245,166,35,.6);text-transform:uppercase;}
    .nav-spacer{width:62px;flex-shrink:0;}

    .container{width:100%;max-width:520px;margin:0 auto;padding:16px 14px 90px;position:relative;z-index:1;}

    /* HERO */
    .hero{background:linear-gradient(135deg,rgba(245,166,35,.10),rgba(204,85,255,.10));border:1px solid rgba(245,166,35,.25);border-radius:12px;padding:16px;margin-bottom:14px;position:relative;overflow:hidden;}
    .hero::before{content:'';position:absolute;top:-1px;left:10%;right:10%;height:2px;background:linear-gradient(90deg,transparent,var(--gold),var(--purple),transparent);}
    .hero-name{font-family:'Orbitron',sans-serif;font-size:14px;font-weight:900;letter-spacing:1.5px;color:#fff;text-transform:uppercase;}
    .hero-id{font-family:'Orbitron',sans-serif;font-size:9px;letter-spacing:3px;color:var(--muted);margin-top:3px;}
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px;}
    .stat{background:rgba(0,0,0,.35);border:1px solid var(--border);border-radius:8px;padding:10px 4px;text-align:center;}
    .stat-val{font-family:'Orbitron',sans-serif;font-size:18px;font-weight:900;color:var(--gold);}
    .stat.p .stat-val{color:var(--purple);}
    .stat-lbl{font-family:'Orbitron',sans-serif;font-size:7.5px;letter-spacing:1.5px;color:var(--muted);margin-top:4px;text-transform:uppercase;}

    /* TABS */
    .tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:rgba(0,0,0,.4);border:1px solid var(--border);border-radius:10px;padding:5px;margin-bottom:14px;position:sticky;top:48px;z-index:20;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);}
    .tab{font-family:'Orbitron',sans-serif;font-size:10px;font-weight:900;letter-spacing:1.5px;padding:11px 6px;border-radius:7px;border:1px solid transparent;background:transparent;color:var(--muted);cursor:pointer;text-transform:uppercase;transition:all .15s;}
    .tab.active[data-tab="digitales"]{background:rgba(245,166,35,.14);border-color:var(--gold);color:var(--gold);}
    .tab.active[data-tab="fisicas"]{background:rgba(204,85,255,.14);border-color:var(--purple);color:var(--purple);}
    .tab .cnt{opacity:.7;margin-left:4px;}

    /* FILTROS */
    .chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px;scrollbar-width:none;}
    .chips::-webkit-scrollbar{display:none;}
    .chip{flex-shrink:0;font-family:'Orbitron',sans-serif;font-size:8.5px;font-weight:700;letter-spacing:1px;padding:6px 11px;border-radius:14px;background:rgba(255,255,255,.03);border:1px solid var(--border);color:var(--muted);cursor:pointer;white-space:nowrap;}
    .chip.active{color:#fff;border-color:var(--c,var(--gold));background:rgba(255,255,255,.06);box-shadow:0 0 10px rgba(245,166,35,.15);}

    .search{width:100%;background:rgba(7,9,15,.85);border:1px solid rgba(255,255,255,.12);border-radius:8px;padding:11px 14px;color:var(--text);font-family:'Rajdhani',sans-serif;font-size:15px;font-weight:500;outline:none;margin-bottom:10px;}
    .search:focus{border-color:var(--purple);box-shadow:0 0 0 3px rgba(204,85,255,.1);}
    select.search{appearance:none;-webkit-appearance:none;font-family:'Orbitron',sans-serif;font-size:10px;letter-spacing:1px;}

    /* GRID */
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
    .ccard{position:relative;aspect-ratio:5/7;border-radius:7px;overflow:hidden;border:1px solid var(--border);background:var(--card);cursor:pointer;transition:transform .12s,border-color .15s;}
    .ccard:active{transform:scale(.95);}
    .ccard img{width:100%;height:100%;object-fit:cover;display:block;}
    .ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;padding:6px;font-family:'Orbitron',sans-serif;font-size:8.5px;letter-spacing:.5px;color:var(--muted);line-height:1.3;}
    .qty{position:absolute;top:5px;right:5px;font-family:'Orbitron',sans-serif;font-size:10px;font-weight:900;padding:2px 7px;border-radius:4px;background:rgba(3,5,10,.85);border:1px solid var(--gold);color:var(--gold);box-shadow:0 0 8px rgba(0,0,0,.6);}
    .fis .qty{border-color:var(--purple);color:var(--purple);}
    .rbar{position:absolute;bottom:0;left:0;right:0;height:3px;}

    .count-line{font-family:'Orbitron',sans-serif;font-size:8.5px;letter-spacing:2px;color:var(--muted);text-align:center;margin:4px 0 10px;text-transform:uppercase;}
    .empty{text-align:center;color:var(--muted);padding:40px 14px;font-size:14px;line-height:1.5;}
    .empty b{display:block;font-size:34px;margin-bottom:8px;}

    .btn{display:block;width:100%;border:none;border-radius:9px;padding:13px;font-family:'Orbitron',sans-serif;font-size:11px;font-weight:900;letter-spacing:2px;cursor:pointer;text-transform:uppercase;text-align:center;text-decoration:none;}
    .btn-gold{background:linear-gradient(135deg,var(--gold),#d4880a);color:#000;box-shadow:0 4px 18px rgba(245,166,35,.25);}
    .btn-purple{background:linear-gradient(135deg,var(--purple),#8a2dbd);color:#fff;box-shadow:0 4px 18px rgba(204,85,255,.25);}
    .btn-ghost{background:transparent;border:1px solid var(--border);color:var(--muted);}
    .btn-danger{background:transparent;border:1px solid rgba(255,77,109,.4);color:var(--danger);}
    .btn:active{transform:scale(.98);}

    .fab{position:fixed;bottom:18px;left:14px;right:14px;margin:0 auto;z-index:30;width:auto;max-width:492px;display:none;touch-action:manipulation;}
    .fab:active{transform:scale(.98);}
    .fab.show{display:block;}

    .spinner{width:26px;height:26px;border:3px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin .7s linear infinite;margin:40px auto 10px;}
    @keyframes spin{to{transform:rotate(360deg);}}

    /* MODAL VISTA AMPLIADA (mismo sistema que galería) */
    .modal{display:none;position:fixed;inset:0;background:rgba(7,9,15,.98);z-index:1000;animation:fadeIn .3s;overflow-y:auto;}
    .modal.active{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:76px 0 30px;}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    .modal-header{position:fixed;top:0;left:0;right:0;padding:16px;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(180deg,rgba(7,9,15,.95) 0%,transparent 100%);z-index:10;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);}
    .expansion-badge{display:inline-block;font-family:'Orbitron',sans-serif;font-size:9px;letter-spacing:2px;color:var(--gold);background:rgba(245,166,35,.08);border:1px solid rgba(245,166,35,.25);padding:6px 14px;border-radius:4px;text-transform:uppercase;}
    .close-btn{background:rgba(245,166,35,.08);border:1px solid rgba(245,166,35,.25);color:var(--gold);font-size:24px;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-family:'Orbitron',sans-serif;font-weight:700;}
    .close-btn:active{transform:scale(.9);box-shadow:0 0 20px rgba(245,166,35,.4);}
    .modal-card-container{width:90%;max-width:360px;display:flex;flex-direction:column;align-items:center;animation:scaleIn .4s cubic-bezier(.34,1.56,.64,1);}
    @keyframes scaleIn{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
    .modal-card-img{width:100%;max-width:360px;max-height:62vh;object-fit:contain;border-radius:12px;border:2px solid var(--mc,var(--gold));box-shadow:0 20px 60px rgba(245,166,35,.3),0 0 40px rgba(245,166,35,.2),0 8px 32px rgba(0,0,0,.6);}
    .modal-card-info{margin-top:20px;text-align:center;padding:0 20px;width:100%;}
    .modal-card-name{font-size:22px;font-weight:900;color:#fff;font-family:'Orbitron',sans-serif;letter-spacing:2px;text-shadow:0 0 20px rgba(245,166,35,.6);margin-bottom:8px;text-transform:uppercase;}
    .modal-card-type{font-size:13px;color:var(--mc,var(--gold));text-transform:uppercase;letter-spacing:3px;font-weight:600;font-family:'Orbitron',sans-serif;}
    .modal-sub{color:var(--muted);font-size:14px;margin-top:10px;}
    .modal-actions{display:flex;flex-direction:column;gap:10px;margin-top:18px;width:100%;}
    .qctrl{display:flex;align-items:center;justify-content:center;gap:18px;margin-top:16px;}
    .qbtn{width:46px;height:46px;border-radius:50%;border:1px solid var(--purple);background:rgba(204,85,255,.1);color:var(--purple);font-family:'Orbitron',sans-serif;font-size:22px;font-weight:900;cursor:pointer;touch-action:manipulation;}
    .qbtn:active{transform:scale(.92);}
    .qnum{font-family:'Orbitron',sans-serif;font-size:26px;font-weight:900;color:#fff;min-width:60px;text-align:center;}

    /* VISTA AMPLIADA CON HOLO (mismo efecto que la apertura de sobres en tienda.html) */
    .mc-wrap{position:relative;width:min(100%,calc(62vh * 5 / 7));aspect-ratio:5/7;}
    .mc-wrap .modal-card-img{width:100%;height:100%;max-width:none;max-height:none;object-fit:cover;display:block;}
    .cr-holo{position:absolute;inset:0;border-radius:12px;pointer-events:none;overflow:hidden;mix-blend-mode:screen;}
    .cr-holo::before{content:'';position:absolute;inset:-20%;background:linear-gradient(115deg,transparent 20%,rgba(255,0,128,.45) 30%,rgba(255,200,0,.5) 38%,rgba(0,255,180,.5) 46%,rgba(0,180,255,.5) 54%,rgba(180,0,255,.45) 62%,transparent 75%);background-size:200% 200%;animation:holoSweep 3.2s ease-in-out infinite;mix-blend-mode:color-dodge;}
    .cr-holo::after{content:'';position:absolute;inset:-10%;background:conic-gradient(from 0deg,rgba(255,0,150,.35),rgba(255,180,0,.35),rgba(0,255,200,.35),rgba(0,150,255,.35),rgba(180,0,255,.35),rgba(255,0,150,.35));animation:holoSpin 4s linear infinite;mix-blend-mode:overlay;filter:blur(8px);}
    @keyframes holoSweep{0%{background-position:-100% -100%}50%{background-position:100% 100%}100%{background-position:-100% -100%}}
    @keyframes holoSpin{to{transform:rotate(360deg)}}
    .cr-holo-sheen{position:absolute;inset:0;border-radius:12px;pointer-events:none;overflow:hidden;}
    .cr-holo-sheen::before{content:'';position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(115deg,transparent,rgba(255,255,255,.6),transparent);transform:skewX(-20deg);animation:holoSheenPass 2.8s ease-in-out infinite;}
    @keyframes holoSheenPass{0%{left:-60%}55%,100%{left:120%}}
    .cr-sparks{position:absolute;inset:-20px;pointer-events:none;overflow:visible;}
    .cr-sparks span{position:absolute;width:4px;height:4px;border-radius:50%;background:var(--gold);animation:sparkFly 1.8s ease-out infinite;opacity:0;}
    .cr-sparks span:nth-child(1){left:20%;top:10%;animation-delay:0s;background:#f5a623;--sx:15px;--sy:-45px}
    .cr-sparks span:nth-child(2){left:75%;top:20%;animation-delay:.3s;background:#fff;--sx:-20px;--sy:-30px}
    .cr-sparks span:nth-child(3){left:10%;top:60%;animation-delay:.6s;background:#cc55ff;--sx:30px;--sy:-20px}
    .cr-sparks span:nth-child(4){left:85%;top:55%;animation-delay:.9s;background:#f5a623;--sx:-25px;--sy:-35px}
    .cr-sparks span:nth-child(5){left:50%;top:5%;animation-delay:1.2s;background:#00ff9d;--sx:10px;--sy:-50px}
    .cr-sparks span:nth-child(6){left:30%;top:85%;animation-delay:1.5s;background:#fff;--sx:-15px;--sy:-40px}
    .cr-sparks span:nth-child(7){left:65%;top:90%;animation-delay:.45s;background:#f5a623;--sx:20px;--sy:-30px}
    .cr-sparks span:nth-child(8){left:5%;top:30%;animation-delay:1.1s;background:#00cfff;--sx:-30px;--sy:-20px}
    @keyframes sparkFly{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--sx,20px),var(--sy,-40px)) scale(0);opacity:0}}
    @media (prefers-reduced-motion:reduce){.cr-holo::before,.cr-holo::after,.cr-holo-sheen::before,.cr-sparks span{animation:none;}}

    /* VARIANTES FÍSICAS (COMÚN / ALFA / OMEGA / CODEX / PORTAL) */
    .var-tag{position:absolute;bottom:0;left:0;right:0;font-family:'Orbitron',sans-serif;font-size:7px;font-weight:900;letter-spacing:1.5px;text-align:center;padding:3px 0 2px;color:#03050a;}
    .vrows{display:flex;flex-direction:column;gap:8px;margin-top:16px;}
    .vrow{display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.35);border:1px solid var(--border);border-left:3px solid var(--vc);border-radius:8px;padding:6px 10px;transition:opacity .15s;}
    .vrow.cero{opacity:.45;}
    .vrow-lbl{flex:1;text-align:left;font-family:'Orbitron',sans-serif;font-size:10px;font-weight:900;letter-spacing:2px;color:var(--vc);}
    .vrow .qbtn{width:36px;height:36px;font-size:18px;border-color:var(--vc);color:var(--vc);background:rgba(255,255,255,.03);}
    .vrow .qnum{font-size:16px;min-width:44px;}
    .modal-total{font-family:'Orbitron',sans-serif;font-size:9px;letter-spacing:2px;color:var(--muted);margin-top:10px;}
    .backup{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:22px;}
    .backup .btn{font-size:9px;padding:11px 6px;letter-spacing:1.5px;}
    .backup-note{grid-column:1/-1;font-size:12px;color:var(--muted);text-align:center;line-height:1.35;}

    /* BUSCADOR */
    #buscador{display:none;position:fixed;inset:0;background:var(--bg);z-index:150;flex-direction:column;}
    #buscador.active{display:flex;}
    .bus-head{padding:10px 14px;border-bottom:1px solid var(--border);background:rgba(3,5,10,.97);}
    .bus-top{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
    .bus-title{flex:1;font-family:'Orbitron',sans-serif;font-size:11px;font-weight:900;letter-spacing:2px;color:var(--purple);text-transform:uppercase;}
    .bus-close{width:36px;height:36px;border-radius:50%;border:1px solid var(--border);background:transparent;color:var(--text);font-size:18px;cursor:pointer;}
    .bus-hint{font-size:12px;color:var(--muted);margin-top:-2px;}
    .bus-body{flex:1;overflow-y:auto;padding:12px 14px 30px;max-width:520px;width:100%;margin:0 auto;}
    .ccard.flash{animation:flash .4s ease;}
    @keyframes flash{0%{box-shadow:0 0 0 0 rgba(204,85,255,.9);border-color:var(--purple)}100%{box-shadow:0 0 0 10px rgba(204,85,255,0);}}

    #toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--purple);color:#fff;padding:10px 20px;border-radius:6px;font-family:'Orbitron',sans-serif;font-size:10px;font-weight:700;letter-spacing:1px;z-index:500;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis;}
    #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  </style>
</head>
<body>

<nav id="chh-nav">
  <a class="nav-back" href="index.html">← Menú</a>
  <div class="nav-title">📚 Mi Colección</div>
  <div class="nav-spacer"></div>
</nav>

<div class="container" id="app">
  <div class="spinner"></div>
</div>

<button class="btn btn-purple fab" id="fabAgregar" onclick="abrirBuscador()">+ Registrar cartas físicas</button>

<!-- BUSCADOR DE CATÁLOGO -->
<div id="buscador">
  <div class="bus-head">
    <div class="bus-top">
      <div class="bus-title">+ Registrar cartas físicas</div>
      <button class="bus-close" onclick="cerrarBuscador()">✕</button>
    </div>
    <input class="search" id="busInput" type="text" placeholder="Buscar por nombre o tipo..." autocomplete="off"/>
    <select class="search" id="busExp"></select>
    <div class="chips" id="busVar"></div>
    <div class="bus-hint">Elige la rareza y toca una carta para sumar +1 a tu colección física.</div>
  </div>
  <div class="bus-body">
    <div class="count-line" id="busCount"></div>
    <div class="grid" id="busGrid"></div>
  </div>
</div>

<!-- MODAL CARTA -->
<div class="modal" id="modal" onclick="if(event.target===this)cerrarModal()">
  <div class="modal-header">
    <span class="expansion-badge" id="modalBadge"></span>
    <button class="close-btn" onclick="cerrarModal()">×</button>
  </div>
  <div class="modal-card-container" id="modalBox"></div>
</div>

<div id="toast"></div>

<script>
// ════════════════════════════════════════
// CONFIG
// ════════════════════════════════════════
const HERO_PESOS_URL  = 'https://script.google.com/macros/s/AKfycbwSrBH7yJiyTlPabzJ_WiXQDWPe7RpATmuTTWAe3uVRy6wuGh15QpuOMzSiZVixJK_S/exec';
const CARTAS_IMG_BASE = 'cartas/';
const CATALOGO_URL    = 'cartas.json';
const LIMITE_BUSQUEDA = 90;
const TIMEOUT_DIG = 20000;   // ms máximo esperando a Apps Script
const TIMEOUT_CAT = 12000;

const RAREZA_ORDEN = ['secreta','foil_poco_comun','foil','rara','poco_comun','comun'];
const RAREZA_COLOR = { comun:'#6a7f9a', poco_comun:'#4fc3f7', rara:'#64c864', foil:'#f5a623', foil_poco_comun:'#ff7043', secreta:'#e040fb' };
const RAREZA_LABEL = { comun:'COMÚN', poco_comun:'POCO COMÚN', rara:'RARA', foil:'FOIL', foil_poco_comun:'FOIL P.C.', secreta:'SECRETA' };
// Mismas rarezas con holo que en la apertura de sobres (tienda.html)
const RAREZAS_HOLO = ['rara','foil','foil_poco_comun','secreta'];
const HOLO_TPL = '<div class="cr-holo"></div><div class="cr-holo-sheen"></div><div class="cr-sparks"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>';

// Variantes de cartas físicas. Común se guarda con la clave "id" (compatible con datos previos);
// el resto como "id::variante".
const VARIANTES = ['comun','alfa','omega','codex','portal'];
const VAR_LABEL = { comun:'COMÚN', alfa:'ALFA', omega:'OMEGA', codex:'CODEX', portal:'PORTAL' };
const VAR_COLOR = { comun:'#6a7f9a', alfa:'#00cfff', omega:'#ff4d6d', codex:'#f5a623', portal:'#cc55ff' };

// ════════════════════════════════════════
// ESTADO
// ════════════════════════════════════════
let jugador = null;
let digitales = [];          // [{nombre, rareza, imagen, qty}]
let digEstado = 'cargando';  // cargando | ok | error
let digDesdeCache = false;
let catalogo = [];           // cartas.json (sin banners)
let catalogoMap = {};        // id -> carta
let catEstado = 'cargando';  // cargando | ok | error
let fisicas = {};            // id -> qty
let tab = 'digitales';
let filtroRareza = 'todas';
let busquedaFis = '';
let modalCtx = null;
let filtroVar = 'todas';     // filtro de variante en pestaña Físicas
let varRegistro = 'comun';   // variante seleccionada en el buscador

// ════════════════════════════════════════
// UTILS
// ════════════════════════════════════════
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtExp = e => String(e || '').split('_').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
const imgDigital = im => !im ? '' : (im.startsWith('http') || im.includes('/') ? im : CARTAS_IMG_BASE + im);
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._tm); t._tm = setTimeout(() => t.classList.remove('show'), 1600);
}

function imgHTML(src, nombre){
  return src
    ? `<img src="${esc(src)}" alt="${esc(nombre)}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"/><div class="ph" style="display:none">${esc(nombre)}</div>`
    : `<div class="ph">${esc(nombre)}</div>`;
}

// ════════════════════════════════════════
// PERSISTENCIA FÍSICAS
// ════════════════════════════════════════
const keyFis = () => `nhColFisica_${jugador.id}`;
const keyDigCache = () => `nhColDigCache_${jugador.id}`;

async function fetchTimeout(url, ms){
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), ms);
  try { return await fetch(url, { signal: ctrl.signal }); }
  finally { clearTimeout(t); }
}

// Re-render sin interrumpir si el usuario está escribiendo en el filtro
function refrescar(){
  const a = document.activeElement;
  if (a && a.id === 'fisSearch') { actualizarStats(); return; }
  render();
}
function cargarFisicas(){
  try { fisicas = JSON.parse(localStorage.getItem(keyFis()) || '{}') || {}; } catch(e){ fisicas = {}; }
}
function guardarFisicas(){
  try { localStorage.setItem(keyFis(), JSON.stringify(fisicas)); } catch(e){}
}
function setFisica(id, qty){
  if (qty <= 0) delete fisicas[id]; else fisicas[id] = qty;
  guardarFisicas();
}
const keyVar = (id, v) => v === 'comun' ? String(id) : `${id}::${v}`;
function parseKey(k){
  const i = k.indexOf('::');
  return i < 0 ? { id: k, v: 'comun' } : { id: k.slice(0, i), v: k.slice(i + 2) };
}
const totalCarta = id => VARIANTES.reduce((s, v) => s + (fisicas[keyVar(id, v)] || 0), 0);

// ════════════════════════════════════════
// INIT
// ════════════════════════════════════════
function init(){
  try {
    const s = JSON.parse(localStorage.getItem('chh_secciones_visitadas') || '[]');
    if (!s.includes('coleccion')) { s.push('coleccion'); localStorage.setItem('chh_secciones_visitadas', JSON.stringify(s)); }
  } catch(e) {}

  try { jugador = JSON.parse(localStorage.getItem('nhSesion') || 'null'); } catch(e) { jugador = null; }
  const app = document.getElementById('app');

  if (!jugador || !jugador.id) {
    app.innerHTML = `<div class="empty"><b>🔒</b>Inicia sesión con tu ID de jugador para ver tu colección.</div>
      <a class="btn btn-gold" href="perfil.html">IR A MI PERFIL</a>`;
    return;
  }
  if (jugador.tipo === 'tienda') {
    app.innerHTML = `<div class="empty"><b>🏪</b>Las cuentas de tienda no tienen colección.<br>Inicia sesión con un ID de jugador (CHH-XXXXX).</div>
      <a class="btn btn-gold" href="perfil.html">IR A MI PERFIL</a>`;
    return;
  }

  document.getElementById('busInput').addEventListener('input', renderBuscador);
  document.getElementById('busExp').addEventListener('change', renderBuscador);

  cargarFisicas();
  // Mostrar al instante la última colección digital guardada
  try {
    const c = JSON.parse(localStorage.getItem(keyDigCache()) || 'null');
    if (Array.isArray(c)) { digitales = c; digDesdeCache = true; }
  } catch(e) {}
  render();

  // Cargas en paralelo, cada una refresca cuando termina
  cargarCatalogo().then(refrescar);
  cargarDigitales().then(refrescar);
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();

async function cargarDigitales(){
  digEstado = 'cargando';
  try {
    const r = await fetchTimeout(`${HERO_PESOS_URL}?action=historial&playerid=${encodeURIComponent(jugador.id)}&_t=${Date.now()}`, TIMEOUT_DIG);
    const d = await r.json();
    if (!d || !Array.isArray(d.historial)) throw new Error('respuesta inválida');
    const mapa = {};
    for (const sobre of d.historial) {
      for (const c of (Array.isArray(sobre.cartas) ? sobre.cartas : [])) {
        if (!c || !c.nombre) continue;
        const rz = c.rareza || 'comun';
        const k = c.nombre + '|' + rz;
        if (!mapa[k]) mapa[k] = { nombre: c.nombre, rareza: rz, imagen: c.imagen || '', qty: 0 };
        mapa[k].qty++;
      }
    }
    digitales = Object.values(mapa).sort((a,b) =>
      (RAREZA_ORDEN.indexOf(a.rareza) - RAREZA_ORDEN.indexOf(b.rareza)) || a.nombre.localeCompare(b.nombre));
    digEstado = 'ok'; digDesdeCache = false;
    try { localStorage.setItem(keyDigCache(), JSON.stringify(digitales)); } catch(e) {}
  } catch(e) {
    digEstado = 'error';
  }
}

function reintentarDigitales(){
  digEstado = 'cargando'; render();
  cargarDigitales().then(refrescar);
}

async function cargarCatalogo(){
  try {
    const r = await fetchTimeout(CATALOGO_URL, TIMEOUT_CAT);
    if (!r.ok) throw new Error(r.status);
    const data = await r.json();
    catalogo = data.filter(c => c && c.id != null && c.tipo !== 'BANNER');
    catalogoMap = {};
    catalogo.forEach(c => { catalogoMap[String(c.id)] = c; });
    // Llenar selector de expansiones
    const exps = [...new Set(catalogo.map(c => c.expansion))];
    document.getElementById('busExp').innerHTML =
      `<option value="todas">TODAS LAS EXPANSIONES</option>` +
      exps.map(e => `<option value="${esc(e)}">${esc(fmtExp(e).toUpperCase())}</option>`).join('');
  } catch(e) {
    catEstado = 'error';
    return;
  }
  catEstado = 'ok';
}

// ════════════════════════════════════════
// RENDER PRINCIPAL
// ════════════════════════════════════════
function totalesFisicas(){
  const ids = Object.keys(fisicas).filter(id => fisicas[id] > 0);
  return { unicas: ids.length, copias: ids.reduce((s,id) => s + fisicas[id], 0) };
}

function render(){
  const app = document.getElementById('app');
  const digCopias = digitales.reduce((s,c) => s + c.qty, 0);
  const fis = totalesFisicas();

  app.innerHTML = `
    <div class="hero">
      <div class="hero-name">${esc(jugador.nick || jugador.nombre || 'Jugador')}</div>
      <div class="hero-id">${esc(jugador.id)}</div>
      <div class="stats">
        <div class="stat"><div class="stat-val" id="stDig">${digitales.length}</div><div class="stat-lbl">Digitales</div></div>
        <div class="stat p"><div class="stat-val" id="stFis">${fis.unicas}</div><div class="stat-lbl">Físicas</div></div>
        <div class="stat"><div class="stat-val" id="stTot">${digCopias + fis.copias}</div><div class="stat-lbl">Copias totales</div></div>
      </div>
    </div>
    <div class="tabs">
      <button class="tab ${tab==='digitales'?'active':''}" data-tab="digitales" onclick="cambiarTab('digitales')">🎴 Digitales<span class="cnt">${digitales.length}</span></button>
      <button class="tab ${tab==='fisicas'?'active':''}" data-tab="fisicas" onclick="cambiarTab('fisicas')">🃏 Físicas<span class="cnt">${fis.unicas}</span></button>
    </div>
    <div id="tabBody"></div>`;

  document.getElementById('fabAgregar').classList.toggle('show', tab === 'fisicas' && catEstado === 'ok');
  tab === 'digitales' ? renderDigitales() : renderFisicas();
}

function actualizarStats(){
  const f = totalesFisicas(), dc = digitales.reduce((s,c) => s + c.qty, 0);
  const set = (id,v) => { const e = document.getElementById(id); if (e) e.textContent = v; };
  set('stDig', digitales.length); set('stFis', f.unicas); set('stTot', dc + f.copias);
}

function cambiarTab(t){
  tab = t;
  render();
  window.scrollTo({ top: 0 });
}

// ── DIGITALES ──
function renderDigitales(){
  const body = document.getElementById('tabBody');
  if (!digitales.length && digEstado === 'cargando') {
    body.innerHTML = `<div class="spinner"></div><div class="count-line">Cargando tus cartas digitales…</div>`; return;
  }
  if (!digitales.length && digEstado === 'error') {
    body.innerHTML = `<div class="empty"><b>⚠️</b>El servidor tardó demasiado en responder.</div>
      <button class="btn btn-gold" onclick="reintentarDigitales()">REINTENTAR</button>`; return;
  }
  if (!digitales.length) {
    body.innerHTML = `<div class="empty"><b>📦</b>Aún no tienes cartas digitales.<br>Abre sobres en la Tienda para comenzar.</div>
      <a class="btn btn-gold" href="tienda.html">IR A LA TIENDA</a>`;
    return;
  }
  const presentes = RAREZA_ORDEN.filter(r => digitales.some(c => c.rareza === r));
  const lista = filtroRareza === 'todas' ? digitales : digitales.filter(c => c.rareza === filtroRareza);

  const aviso = digEstado === 'cargando' ? `<div class="count-line">⟳ Actualizando…</div>`
    : (digEstado === 'error' && digDesdeCache) ? `<div class="count-line" onclick="reintentarDigitales()" style="cursor:pointer">⚠️ Sin conexión al servidor · mostrando última copia · TOCA PARA REINTENTAR</div>` : '';
  body.innerHTML = aviso + `
    <div class="chips">
      <button class="chip ${filtroRareza==='todas'?'active':''}" onclick="filtrarRareza('todas')">TODAS (${digitales.length})</button>
      ${presentes.map(r => `<button class="chip ${filtroRareza===r?'active':''}" style="--c:${RAREZA_COLOR[r]};${filtroRareza===r?`color:${RAREZA_COLOR[r]}`:''}" onclick="filtrarRareza('${r}')">${RAREZA_LABEL[r]} (${digitales.filter(c=>c.rareza===r).length})</button>`).join('')}
    </div>
    <div class="grid">
      ${lista.map(c => `
        <div class="ccard" style="border-color:${RAREZA_COLOR[c.rareza]}66" onclick="abrirDigital(${digitales.indexOf(c)})">
          ${imgHTML(imgDigital(c.imagen), c.nombre)}
          ${c.qty > 1 ? `<span class="qty">X${c.qty}</span>` : ''}
          <div class="rbar" style="background:${RAREZA_COLOR[c.rareza]}"></div>
        </div>`).join('')}
    </div>`;
}

function filtrarRareza(r){ filtroRareza = r; renderDigitales(); }

function abrirModal(badge, color, html){
  const m = document.getElementById('modal');
  document.getElementById('modalBadge').textContent = badge;
  m.style.setProperty('--mc', color);
  document.getElementById('modalBox').innerHTML = html;
  m.classList.add('active');
  document.body.style.overflow = 'hidden';
}

function abrirDigital(i){
  const c = digitales[i]; if (!c) return;
  const col = RAREZA_COLOR[c.rareza] || '#6a7f9a';
  const src = imgDigital(c.imagen);
  modalCtx = null;
  const holo = RAREZAS_HOLO.includes(c.rareza) ? HOLO_TPL : '';
  abrirModal('COLECCIÓN DIGITAL', col, `
    ${src ? `<div class="mc-wrap"><img class="modal-card-img" src="${esc(src)}" alt="${esc(c.nombre)}" onerror="this.parentElement.style.display='none'"/>${holo}</div>` : ''}
    <div class="modal-card-info">
      <div class="modal-card-name">${esc(c.nombre)}</div>
      <div class="modal-card-type">${RAREZA_LABEL[c.rareza] || esc(c.rareza)}</div>
      <div class="modal-sub">${c.qty > 1 ? 'X' + c.qty + ' copias' : '1 copia'}</div>
    </div>`);
}

// ── FÍSICAS ──
// Devuelve entradas { key, v, c } — una por carta+variante
function listaFisicas(){
  return Object.keys(fisicas)
    .filter(k => fisicas[k] > 0)
    .map(k => { const p = parseKey(k); return { key: k, v: p.v, c: catalogoMap[p.id] }; })
    .filter(e => e.c && VARIANTES.includes(e.v))
    .sort((a,b) => String(a.c.expansion).localeCompare(String(b.c.expansion))
      || String(a.c.nombre).localeCompare(String(b.c.nombre))
      || VARIANTES.indexOf(a.v) - VARIANTES.indexOf(b.v));
}

function backupHTML(conExportar){
  return `<div class="backup">
    ${conExportar ? `<button class="btn btn-ghost" onclick="exportarFisicas()">⬇ Respaldar</button>` : ''}
    <button class="btn btn-ghost" style="${conExportar ? '' : 'grid-column:1/-1'}" onclick="importarFisicas()">⬆ Restaurar respaldo</button>
    <div class="backup-note">Tus cartas físicas se guardan solo en este dispositivo. Respáldalas para no perderlas al cambiar de celular.</div>
  </div>`;
}

function renderFisicas(){
  const body = document.getElementById('tabBody');
  if (catEstado === 'cargando') { body.innerHTML = `<div class="spinner"></div><div class="count-line">Cargando catálogo…</div>`; return; }
  if (catEstado === 'error') { body.innerHTML = `<div class="empty"><b>⚠️</b>No se pudo cargar el catálogo de cartas.</div>
      <button class="btn btn-gold" onclick="catEstado='cargando';render();cargarCatalogo().then(refrescar)">REINTENTAR</button>`; return; }
  const todas = listaFisicas();
  if (!todas.length) {
    body.innerHTML = `<div class="empty"><b>🃏</b>Aún no registras cartas físicas.<br>Toca <b style="display:inline;font-size:inherit;color:var(--purple)">+ Registrar</b> y búscalas en el catálogo.</div>` + backupHTML(false);
    return;
  }
  const presentes = VARIANTES.filter(v => todas.some(e => e.v === v));
  if (filtroVar !== 'todas' && !presentes.includes(filtroVar)) filtroVar = 'todas';
  const chips = presentes.length > 1 ? `
    <div class="chips">
      <button class="chip ${filtroVar==='todas'?'active':''}" style="--c:var(--purple)" onclick="filtrarVar('todas')">TODAS (${todas.length})</button>
      ${presentes.map(v => `<button class="chip ${filtroVar===v?'active':''}" style="--c:${VAR_COLOR[v]};${filtroVar===v?`color:${VAR_COLOR[v]}`:''}" onclick="filtrarVar('${v}')">${VAR_LABEL[v]} (${todas.filter(e=>e.v===v).length})</button>`).join('')}
    </div>` : '';
  body.innerHTML = `
    <input class="search" id="fisSearch" type="text" placeholder="Filtrar mis cartas físicas..." value="${esc(busquedaFis)}" autocomplete="off"/>
    ${chips}
    <div class="count-line" id="fisCount"></div>
    <div class="grid" id="fisGrid"></div>
    ${backupHTML(true)}`;
  document.getElementById('fisSearch').addEventListener('input', e => { busquedaFis = e.target.value; pintarFisicas(); });
  pintarFisicas();
}

function filtrarVar(v){ filtroVar = v; renderFisicas(); }

function pintarFisicas(){
  const q = norm(busquedaFis.trim());
  const lista = listaFisicas().filter(({ v, c }) =>
    (filtroVar === 'todas' || v === filtroVar) &&
    (!q || norm(c.nombre).includes(q) || norm(c.tipo).includes(q) || norm(fmtExp(c.expansion)).includes(q) || norm(VAR_LABEL[v]).includes(q)));
  const copias = lista.reduce((s,e) => s + fisicas[e.key], 0);
  document.getElementById('fisCount').textContent = `${lista.length} únicas · ${copias} copias`;
  document.getElementById('fisGrid').innerHTML = lista.length
    ? lista.map(({ key, v, c }) => {
        const n = fisicas[key];
        const esp = v !== 'comun';
        return `<div class="ccard fis" ${esp ? `style="border-color:${VAR_COLOR[v]}"` : ''} onclick="abrirFisica('${esc(String(c.id))}')">
          ${imgHTML(c.miniatura, c.nombre)}
          ${n > 1 ? `<span class="qty">X${n}</span>` : ''}
          ${esp ? `<div class="var-tag" style="background:${VAR_COLOR[v]}">${VAR_LABEL[v]}</div>` : ''}
        </div>`;
      }).join('')
    : `<div class="empty" style="grid-column:1/-1">Sin resultados.</div>`;
}

function abrirFisica(id){
  const c = catalogoMap[id]; if (!c) return;
  modalCtx = id;
  const src = c.ampliada || c.miniatura;
  abrirModal(fmtExp(c.expansion).toUpperCase(), 'var(--purple)', `
    ${src ? `<img class="modal-card-img" src="${esc(src)}" alt="${esc(c.nombre)}" onerror="this.style.display='none'"/>` : ''}
    <div class="modal-card-info">
      <div class="modal-card-name">${esc(c.nombre)}</div>
      <div class="modal-card-type">${esc(c.tipo || '')}</div>
      <div class="vrows">
        ${VARIANTES.map(v => `<div class="vrow" id="vr-${v}" style="--vc:${VAR_COLOR[v]}">
          <div class="vrow-lbl">${VAR_LABEL[v]}</div>
          <button class="qbtn" onclick="ajustarModal('${v}',-1)">−</button>
          <div class="qnum" id="vq-${v}"></div>
          <button class="qbtn" onclick="ajustarModal('${v}',1)">+</button>
        </div>`).join('')}
      </div>
      <div class="modal-total" id="modalTotal"></div>
      <div class="modal-actions">
        <button class="btn btn-danger" onclick="quitarModal()">QUITAR DE MI COLECCIÓN</button>
      </div>
    </div>`);
  pintarModalFisica();
}

function pintarModalFisica(){
  if (!modalCtx) return;
  VARIANTES.forEach(v => {
    const n = fisicas[keyVar(modalCtx, v)] || 0;
    const q = document.getElementById('vq-' + v), r = document.getElementById('vr-' + v);
    if (q) q.textContent = 'X' + n;
    if (r) r.classList.toggle('cero', n === 0);
  });
  const t = document.getElementById('modalTotal');
  if (t) t.textContent = `TOTAL: ${totalCarta(modalCtx)} COPIAS`;
}

function ajustarModal(v, d){
  const id = modalCtx; if (!id || !VARIANTES.includes(v)) return;
  const k = keyVar(id, v);
  setFisica(k, Math.max(0, (fisicas[k] || 0) + d));
  pintarModalFisica();
}

function quitarModal(){
  const id = modalCtx; if (!id) return;
  const nombre = catalogoMap[id]?.nombre || '';
  VARIANTES.forEach(v => setFisica(keyVar(id, v), 0));
  cerrarModal();
  toast(`Quitada: ${nombre}`);
}

function cerrarModal(){
  document.getElementById('modal').classList.remove('active');
  if (!document.getElementById('buscador').classList.contains('active')) document.body.style.overflow = '';
  if (modalCtx !== null) { modalCtx = null; render(); }
}

// ════════════════════════════════════════
// BUSCADOR (registro de físicas)
// ════════════════════════════════════════
function abrirBuscador(){
  document.getElementById('buscador').classList.add('active');
  document.body.style.overflow = 'hidden';
  renderBusVar();
  renderBuscador();
  setTimeout(() => document.getElementById('busInput').focus(), 50);
}

function cerrarBuscador(){
  document.getElementById('buscador').classList.remove('active');
  document.body.style.overflow = '';
  render();
}

function renderBusVar(){
  document.getElementById('busVar').innerHTML = VARIANTES.map(v =>
    `<button class="chip ${varRegistro===v?'active':''}" style="--c:${VAR_COLOR[v]};${varRegistro===v?`color:${VAR_COLOR[v]}`:''}" onclick="setVarRegistro('${v}')">${VAR_LABEL[v]}</button>`).join('');
}
function setVarRegistro(v){ varRegistro = v; renderBusVar(); }

function renderBuscador(){
  const q   = norm(document.getElementById('busInput').value.trim());
  const exp = document.getElementById('busExp').value;
  const res = catalogo.filter(c =>
    (exp === 'todas' || c.expansion === exp) &&
    (!q || norm(c.nombre).includes(q) || norm(c.tipo).includes(q)));
  const vis = res.slice(0, LIMITE_BUSQUEDA);

  document.getElementById('busCount').textContent = res.length > LIMITE_BUSQUEDA
    ? `${res.length} cartas · mostrando ${LIMITE_BUSQUEDA}, refina la búsqueda`
    : `${res.length} carta${res.length!==1?'s':''}`;

  document.getElementById('busGrid').innerHTML = vis.length
    ? vis.map(c => {
        const id = String(c.id), n = totalCarta(id);
        return `<div class="ccard fis" data-id="${esc(id)}" onclick="sumarDesdeBuscador(this)">
          ${imgHTML(c.miniatura, c.nombre)}
          <span class="qty" style="${n?'':'display:none'}">X${n}</span>
        </div>`;
      }).join('')
    : `<div class="empty" style="grid-column:1/-1">Sin resultados.</div>`;
}

function sumarDesdeBuscador(el){
  const id = el.dataset.id, c = catalogoMap[id]; if (!c) return;
  const k = keyVar(id, varRegistro);
  const n = (fisicas[k] || 0) + 1;
  setFisica(k, n);
  const badge = el.querySelector('.qty');
  badge.textContent = 'X' + totalCarta(id); badge.style.display = '';
  el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
  toast(`+1 ${c.nombre} · ${VAR_LABEL[varRegistro]} (X${n})`);
}

// ════════════════════════════════════════
// RESPALDO FÍSICAS (exportar / importar JSON)
// ════════════════════════════════════════
function exportarFisicas(){
  const hoy = new Date().toISOString();
  const data = { app: 'nexo-de-heroes', tipo: 'coleccion_fisica', version: 2, jugador: jugador.id, fecha: hoy, fisicas };
  const url = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }));
  const a = document.createElement('a');
  a.href = url; a.download = `coleccion_fisica_${jugador.id}_${hoy.slice(0,10)}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
  toast('Respaldo descargado');
}

function importarFisicas(){
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'application/json,.json';
  inp.onchange = async () => {
    const f = inp.files && inp.files[0]; if (!f) return;
    try {
      const d = JSON.parse(await f.text());
      const src = (d && typeof d.fisicas === 'object' && d.fisicas) ? d.fisicas : d;
      const limpio = {};
      for (const [k, v] of Object.entries(src || {})) {
        const n = parseInt(v, 10);
        if (n > 0 && VARIANTES.includes(parseKey(String(k)).v)) limpio[String(k)] = n;
      }
      const nNuevo = Object.keys(limpio).length;
      if (!nNuevo) { toast('El archivo no contiene cartas válidas'); return; }
      const nActual = Object.keys(fisicas).length;
      if (nActual && !confirm(`¿Reemplazar tu colección física actual (${nActual} entradas) con el respaldo (${nNuevo} entradas)?`)) return;
      fisicas = limpio; guardarFisicas();
      render();
      toast(`Respaldo restaurado: ${nNuevo} entradas`);
    } catch(e) {
      toast('Archivo de respaldo inválido');
    }
  };
  inp.click();
}

// Escape cierra modal / buscador (escritorio)
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (document.getElementById('modal').classList.contains('active')) cerrarModal();
  else if (document.getElementById('buscador').classList.contains('active')) cerrarBuscador();
});
</script>
<script src="settings.js"></script>
