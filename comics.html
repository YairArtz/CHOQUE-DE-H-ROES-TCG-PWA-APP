<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0e1a">
<title>Comicteca — Nexo de Héroes</title>
<link rel="icon" href="img/favicon.png">
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#0a0e1a; --bg-1:#111827; --bg-2:#1a2237;
    --acc-gold:#e8c86a; --acc-red:#c53030; --acc-cyan:#4fd1c5;
    --txt-1:#f5f5f5; --txt-2:#a0aec0; --border:rgba(232,200,106,.25);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{background:var(--bg-0);color:var(--txt-1);font-family:'Rajdhani',sans-serif;min-height:100vh;overflow-x:hidden}
  body{background:
    radial-gradient(ellipse at top,rgba(232,200,106,.08),transparent 60%),
    radial-gradient(ellipse at bottom,rgba(197,48,48,.06),transparent 60%),
    var(--bg-0);
  }
  header{
    position:sticky;top:0;z-index:20;
    background:linear-gradient(180deg,rgba(10,14,26,.98),rgba(10,14,26,.85));
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border);
    padding:14px 16px;display:flex;align-items:center;gap:12px;
  }
  .back,.home{
    background:none;border:1px solid var(--border);color:var(--acc-gold);
    width:38px;height:38px;border-radius:50%;font-size:18px;cursor:pointer;
    display:grid;place-items:center;transition:.2s;flex-shrink:0;
    text-decoration:none;
  }
  .back:hover,.home:hover{background:var(--border);transform:translateY(-1px)}
  .home{font-size:16px}
  h1{font-family:'Orbitron',sans-serif;font-size:1rem;font-weight:900;color:var(--acc-gold);
    letter-spacing:3px;text-shadow:0 0 20px rgba(232,200,106,.3);flex:1;text-transform:uppercase;text-align:center}
  h1 small{display:block;font-family:'Orbitron',sans-serif;font-size:.62rem;color:var(--txt-2);letter-spacing:3px;font-weight:500;margin-top:2px}
  .container{padding:20px 16px 100px;max-width:1200px;margin:0 auto}
  .intro{text-align:center;margin-bottom:20px;padding:0 8px}
  .intro p{color:var(--txt-2);font-size:.95rem;line-height:1.5;max-width:600px;margin:0 auto}

  /* Contadores */
  .stats{
    display:flex;justify-content:center;gap:20px;
    margin:16px 0 24px;padding:14px;
    background:rgba(20,25,40,.5);border:1px solid var(--border);border-radius:8px;
    max-width:520px;margin-left:auto;margin-right:auto;
  }
  .stat{text-align:center;flex:1}
  .stat .num{font-family:'Orbitron',sans-serif;font-size:1.4rem;font-weight:900;color:var(--acc-gold);letter-spacing:1px;line-height:1}
  .stat .lbl{font-family:'Orbitron',sans-serif;font-size:.6rem;color:var(--txt-2);letter-spacing:2px;margin-top:4px;text-transform:uppercase}
  .stat .num.red{color:var(--acc-red)}
  .stat .num.cyan{color:var(--acc-cyan)}

  /* Filtros por arco */
  .filtros{
    display:flex;gap:8px;overflow-x:auto;padding:8px 0 12px;
    margin-bottom:20px;scrollbar-width:none;
    -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 16px,#000 calc(100% - 16px),transparent 100%);
    mask-image:linear-gradient(90deg,transparent 0,#000 16px,#000 calc(100% - 16px),transparent 100%);
  }
  .filtros::-webkit-scrollbar{display:none}
  .filtro{
    flex-shrink:0;background:rgba(20,25,40,.6);border:1px solid var(--border);
    color:var(--txt-2);padding:8px 16px;border-radius:20px;
    font-family:'Orbitron',sans-serif;font-size:.68rem;letter-spacing:1.5px;
    cursor:pointer;transition:.2s;text-transform:uppercase;font-weight:600;
    display:flex;align-items:center;gap:6px;
  }
  .filtro:hover{background:rgba(232,200,106,.1);color:var(--acc-gold)}
  .filtro.active{background:var(--acc-gold);color:#0a0e1a;border-color:var(--acc-gold);font-weight:700}
  .filtro .cnt{opacity:.7;font-size:.6rem}
  .filtro.active .cnt{opacity:.85}
  .filtro .dot{width:8px;height:8px;border-radius:50%;background:currentColor;opacity:.6}

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
    gap:24px 16px;
  }
  @media(min-width:768px){.grid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:32px 20px}}
  .comic{
    cursor:pointer;position:relative;
    transition:transform .3s cubic-bezier(.34,1.56,.64,1);
    animation:fadeUp .4s ease backwards;
  }
  @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
  .comic:active{transform:scale(.96)}
  .comic:hover{transform:translateY(-4px)}
  .cover{
    position:relative;aspect-ratio:2/3;border-radius:6px;overflow:hidden;
    background:linear-gradient(135deg,var(--bg-2),var(--bg-1));
    border:1px solid var(--border);
    box-shadow:
      0 4px 20px rgba(0,0,0,.5),
      0 0 0 1px rgba(232,200,106,.1) inset;
  }
  .cover img{width:100%;height:100%;object-fit:cover;display:block}
  .cover.placeholder{display:grid;place-items:center;color:var(--acc-gold);font-family:'Orbitron',sans-serif;font-size:2.5rem;opacity:.4}
  .lock{
    position:absolute;inset:0;background:rgba(10,14,26,.75);
    backdrop-filter:blur(2px);
    display:grid;place-items:center;color:var(--acc-gold);
    font-family:'Orbitron',sans-serif;font-size:.7rem;letter-spacing:2px;
    text-align:center;padding:12px;
  }
  .lock .icon{font-size:2rem;margin-bottom:8px;filter:drop-shadow(0 0 8px var(--acc-gold))}
  .read-badge{
    position:absolute;top:8px;right:8px;
    background:rgba(79,209,197,.9);color:#0a0e1a;
    font-family:'Orbitron',sans-serif;font-size:.6rem;
    width:26px;height:26px;border-radius:50%;
    display:grid;place-items:center;font-weight:900;
    box-shadow:0 2px 8px rgba(0,0,0,.4);
  }
  .arc-tag{
    position:absolute;top:8px;left:8px;
    background:rgba(197,48,48,.9);color:#fff;
    font-family:'Orbitron',sans-serif;font-size:.55rem;
    padding:3px 8px;letter-spacing:1.5px;font-weight:700;
    border-radius:2px;max-width:calc(100% - 16px);
    text-overflow:ellipsis;white-space:nowrap;overflow:hidden;
  }
  .info{padding:12px 4px 0}
  .titulo{font-family:'Orbitron',sans-serif;font-size:.8rem;font-weight:700;color:var(--acc-gold);line-height:1.25;margin-bottom:4px;letter-spacing:1px;text-transform:uppercase}
  .subtitulo{font-size:.78rem;color:var(--txt-2);font-style:italic;margin-bottom:6px}
  .creditos-chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
  .chip{
    font-family:'Orbitron',sans-serif;font-size:.55rem;letter-spacing:1px;
    background:rgba(232,200,106,.1);color:var(--acc-gold);
    padding:2px 6px;border-radius:3px;border:1px solid rgba(232,200,106,.2);
    text-transform:uppercase;font-weight:600;
  }
  .meta{display:flex;gap:8px;margin-top:8px;font-family:'Orbitron',sans-serif;font-size:.6rem;color:var(--txt-2);letter-spacing:1px}
  .meta span::before{content:'▸ '}
  .loading{text-align:center;padding:60px 20px;color:var(--txt-2);font-family:'Orbitron',sans-serif;letter-spacing:2px;font-size:.85rem}
  .empty{text-align:center;padding:60px 20px}
  .empty h2{font-family:'Orbitron',sans-serif;color:var(--acc-gold);margin-bottom:8px;letter-spacing:2px;text-transform:uppercase}
  .empty p{color:var(--txt-2)}
</style>
</head>
<body>
<header>
  <button class="back" onclick="history.length>1?history.back():location.href='index.html'" aria-label="Volver">←</button>
  <h1>Comicteca<small>ARCHIVO DIGITAL</small></h1>
  <a class="home" href="index.html" aria-label="Menú principal" title="Menú principal">⌂</a>
</header>

<div class="container">
  <div class="intro">
    <p>Las historias detrás de los héroes. Lee los cómics originales de los personajes de <em>Choque de Héroes TCG</em>.</p>
  </div>

  <div class="stats" id="stats" style="display:none">
    <div class="stat"><div class="num" id="stat-total">—</div><div class="lbl">Total</div></div>
    <div class="stat"><div class="num cyan" id="stat-leidos">—</div><div class="lbl">Leídos</div></div>
    <div class="stat"><div class="num red" id="stat-bloqueados">—</div><div class="lbl">Bloqueados</div></div>
  </div>

  <div class="filtros" id="filtros"></div>

  <div id="grid" class="grid">
    <div class="loading">Cargando el archivo…</div>
  </div>
</div>

<script src="bgm.js" defer></script>
<script>
(async function(){
  const grid=document.getElementById('grid');
  const filtrosEl=document.getElementById('filtros');
  const statsEl=document.getElementById('stats');

  // Estado del jugador para desbloqueos
  const jugador={
    hp: parseInt(localStorage.getItem('hero_pesos')||'0',10),
    puntos: parseInt(localStorage.getItem('puntos_ranking')||'0',10),
    desbloqueados: JSON.parse(localStorage.getItem('comics_desbloqueados')||'[]'),
    leidos: JSON.parse(localStorage.getItem('comics_leidos')||'[]')
  };

  let config;
  try{
    const r=await fetch('comics_config.json?v='+Date.now());
    if(!r.ok) throw new Error(r.status);
    config=await r.json();
  }catch(e){
    grid.innerHTML='<div class="empty"><h2>Archivo vacío</h2><p>No se pudo cargar el catálogo. Intenta más tarde.</p></div>';
    console.error('Error cargando comics_config.json',e);
    return;
  }

  const comics=(config.comics||[]).slice().sort((a,b)=>(a.orden||0)-(b.orden||0));
  if(!comics.length){
    grid.innerHTML='<div class="empty"><h2>Próximamente</h2><p>Los cómics estarán aquí muy pronto.</p></div>';
    return;
  }

  // Mapa de arcos (id → nombre y color)
  const arcosMap=new Map();
  (config.arcos||[]).forEach(a=>arcosMap.set(a.id,a));

  // Contadores
  const total=comics.length;
  const leidos=comics.filter(c=>jugador.leidos.includes(c.id)).length;
  const bloqueados=comics.filter(c=>c.desbloqueo?.requiere && !jugador.desbloqueados.includes(c.id)).length;
  document.getElementById('stat-total').textContent=total;
  document.getElementById('stat-leidos').textContent=leidos;
  document.getElementById('stat-bloqueados').textContent=bloqueados;
  statsEl.style.display='flex';

  // Construir filtros por arco
  const conteoArcos=new Map();
  comics.forEach(c=>conteoArcos.set(c.arco,(conteoArcos.get(c.arco)||0)+1));

  let filtroActivo='__all__';
  function renderFiltros(){
    filtrosEl.innerHTML='';
    const btnAll=document.createElement('button');
    btnAll.className='filtro'+(filtroActivo==='__all__'?' active':'');
    btnAll.innerHTML='TODOS <span class="cnt">('+total+')</span>';
    btnAll.onclick=()=>{filtroActivo='__all__';renderFiltros();renderGrid()};
    filtrosEl.appendChild(btnAll);

    // Arcos en orden del config, si existe; si no, orden alfabético
    const arcosOrdenados=(config.arcos||[]).filter(a=>conteoArcos.has(a.id));
    // Añadir arcos huérfanos (que estén en comics pero no en config.arcos)
    conteoArcos.forEach((_,arcoId)=>{
      if(!arcosMap.has(arcoId))arcosOrdenados.push({id:arcoId,nombre:arcoId,color:'#e8c86a'});
    });

    arcosOrdenados.forEach(a=>{
      const b=document.createElement('button');
      b.className='filtro'+(filtroActivo===a.id?' active':'');
      const dot=filtroActivo===a.id?'':`<span class="dot" style="background:${a.color}"></span>`;
      b.innerHTML=dot+escapeHtml(a.nombre)+' <span class="cnt">('+conteoArcos.get(a.id)+')</span>';
      b.onclick=()=>{filtroActivo=a.id;renderFiltros();renderGrid()};
      filtrosEl.appendChild(b);
    });
  }

  function obtenerCreditos(c){
    if(Array.isArray(c.creditos) && c.creditos.length)return c.creditos;
    if(c.autor)return [{rol:'Guión y Arte',nombre:c.autor.nombre}];
    return [];
  }

  function renderGrid(){
    const lista=filtroActivo==='__all__'?comics:comics.filter(c=>c.arco===filtroActivo);
    if(!lista.length){
      grid.innerHTML='<div class="empty"><h2>Sin cómics</h2><p>No hay cómics en este arco todavía.</p></div>';
      return;
    }
    grid.innerHTML='';
    lista.forEach((c,idx)=>{
      const bloqueado=c.desbloqueo?.requiere && !jugador.desbloqueados.includes(c.id);
      const leido=jugador.leidos.includes(c.id);
      const arcoInfo=arcosMap.get(c.arco);
      const arcoNombre=arcoInfo?arcoInfo.nombre:c.arco;
      const arcoColor=arcoInfo?arcoInfo.color:'#c53030';

      // Chips únicos de rol
      const creditos=obtenerCreditos(c);
      const rolesUnicos=[...new Set(creditos.map(cr=>cr.rol).filter(Boolean))];

      const el=document.createElement('div');
      el.className='comic';
      el.style.animationDelay=(idx*.03)+'s';
      el.innerHTML=`
        <div class="cover ${!c.portada?'placeholder':''}">
          ${c.portada?`<img src="${c.portada}" alt="${escapeHtml(c.titulo)}" loading="lazy" onerror="this.parentElement.classList.add('placeholder');this.remove();this.parentElement.textContent='${(c.titulo||'?').charAt(0)}'">`:c.titulo.charAt(0)}
          ${arcoNombre?`<span class="arc-tag" style="background:${arcoColor}dd">${escapeHtml(arcoNombre)}</span>`:''}
          ${leido && !bloqueado?`<span class="read-badge" title="Leído">✓</span>`:''}
          ${bloqueado?`<div class="lock"><div><div class="icon">🔒</div>${c.desbloqueo.costo_hp?c.desbloqueo.costo_hp+' HP':''}${c.desbloqueo.puntos_min?' · '+c.desbloqueo.puntos_min+' pts':''}</div></div>`:''}
        </div>
        <div class="info">
          <div class="titulo">${escapeHtml(c.titulo)}</div>
          ${c.subtitulo?`<div class="subtitulo">${escapeHtml(c.subtitulo)}</div>`:''}
          ${rolesUnicos.length?`<div class="creditos-chips">${rolesUnicos.map(r=>`<span class="chip">${escapeHtml(r)}</span>`).join('')}</div>`:''}
          <div class="meta">${c.paginas?`<span>${c.paginas} pág</span>`:''}${c.publicado?`<span>${c.publicado.slice(0,4)}</span>`:''}</div>
        </div>`;
      el.addEventListener('click',()=>{
        if(bloqueado){
          alert('Este cómic está bloqueado.\nCosto: '+(c.desbloqueo.costo_hp||0)+' HP\nRanking mínimo: '+(c.desbloqueo.puntos_min||0)+' pts\n\nPodrás desbloquearlo desde la Tienda próximamente.');
          return;
        }
        location.href='lector.html?id='+encodeURIComponent(c.id);
      });
      grid.appendChild(el);
    });
  }

  renderFiltros();
  renderGrid();

  function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
})();
</script>
</body>
</html>
