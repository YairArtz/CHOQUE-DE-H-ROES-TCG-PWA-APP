<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0e1a">
<title>Comicteca — Nexo de Héroes</title>
<link rel="icon" href="img/favicon.png">
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#0a0e1a; --bg-1:#111827; --bg-2:#1a2237;
    --acc-gold:#e8c86a; --acc-red:#c53030; --acc-cyan:#4fd1c5;
    --txt-1:#f5f5f5; --txt-2:#a0aec0; --border:rgba(232,200,106,.25);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{background:var(--bg-0);color:var(--txt-1);font-family:'Rajdhani',sans-serif;min-height:100vh;overflow-x:hidden}
  body{background:
    radial-gradient(ellipse at top,rgba(232,200,106,.08),transparent 60%),
    radial-gradient(ellipse at bottom,rgba(197,48,48,.06),transparent 60%),
    var(--bg-0);
  }
  header{
    position:sticky;top:0;z-index:20;
    background:linear-gradient(180deg,rgba(10,14,26,.98),rgba(10,14,26,.85));
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border);
    padding:14px 16px;display:flex;align-items:center;gap:12px;
  }
  .back{
    background:none;border:1px solid var(--border);color:var(--acc-gold);
    width:38px;height:38px;border-radius:50%;font-size:20px;cursor:pointer;
    display:grid;place-items:center;transition:.2s;
  }
  .back:hover{background:var(--border);transform:translateX(-2px)}
  h1{font-family:'Orbitron',sans-serif;font-size:1rem;font-weight:900;color:var(--acc-gold);
    letter-spacing:3px;text-shadow:0 0 20px rgba(232,200,106,.3);flex:1;text-transform:uppercase}
  h1 small{display:block;font-family:'Orbitron',sans-serif;font-size:.65rem;color:var(--txt-2);letter-spacing:3px;font-weight:500}
  .container{padding:24px 16px 100px;max-width:1200px;margin:0 auto}
  .intro{text-align:center;margin-bottom:28px;padding:0 8px}
  .intro p{color:var(--txt-2);font-size:.95rem;line-height:1.5;max-width:600px;margin:0 auto}
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
    gap:20px 16px;
  }
  @media(min-width:768px){.grid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:28px 20px}}
  .comic{
    cursor:pointer;position:relative;
    transition:transform .3s cubic-bezier(.34,1.56,.64,1);
  }
  .comic:active{transform:scale(.96)}
  .comic:hover{transform:translateY(-4px)}
  .cover{
    position:relative;aspect-ratio:2/3;border-radius:6px;overflow:hidden;
    background:linear-gradient(135deg,var(--bg-2),var(--bg-1));
    border:1px solid var(--border);
    box-shadow:
      0 4px 20px rgba(0,0,0,.5),
      0 0 0 1px rgba(232,200,106,.1) inset;
  }
  .cover img{width:100%;height:100%;object-fit:cover;display:block}
  .cover.placeholder{display:grid;place-items:center;color:var(--acc-gold);font-family:'Orbitron',sans-serif;font-size:2.5rem;opacity:.4}
  .lock{
    position:absolute;inset:0;background:rgba(10,14,26,.75);
    backdrop-filter:blur(2px);
    display:grid;place-items:center;color:var(--acc-gold);
    font-family:'Orbitron',sans-serif;font-size:.7rem;letter-spacing:2px;
    text-align:center;padding:12px;
  }
  .lock .icon{font-size:2rem;margin-bottom:8px;filter:drop-shadow(0 0 8px var(--acc-gold))}
  .arc-tag{
    position:absolute;top:8px;left:8px;
    background:rgba(197,48,48,.9);color:#fff;
    font-family:'Orbitron',sans-serif;font-size:.55rem;
    padding:3px 8px;letter-spacing:1.5px;font-weight:700;
    border-radius:2px;
  }
  .info{padding:12px 4px 0}
  .titulo{font-family:'Orbitron',sans-serif;font-size:.8rem;font-weight:700;color:var(--acc-gold);line-height:1.25;margin-bottom:4px;letter-spacing:1px;text-transform:uppercase}
  .subtitulo{font-size:.78rem;color:var(--txt-2);font-style:italic}
  .meta{display:flex;gap:8px;margin-top:6px;font-family:'Orbitron',sans-serif;font-size:.6rem;color:var(--txt-2);letter-spacing:1px}
  .meta span::before{content:'▸ '}
  .loading{text-align:center;padding:60px 20px;color:var(--txt-2);font-family:'Orbitron',sans-serif;letter-spacing:2px;font-size:.85rem}
  .empty{text-align:center;padding:60px 20px}
  .empty h2{font-family:'Orbitron',sans-serif;color:var(--acc-gold);margin-bottom:8px;letter-spacing:2px;text-transform:uppercase}
  .empty p{color:var(--txt-2)}
</style>
</head>
<body>
<header>
  <button class="back" onclick="history.length>1?history.back():location.href='index.html'" aria-label="Volver">←</button>
  <h1>Comicteca<small>ARCHIVO DIGITAL</small></h1>
</header>

<div class="container">
  <div class="intro">
    <p>Las historias detrás de los héroes. Lee los cómics originales de los personajes de <em>Choque de Héroes TCG</em>.</p>
  </div>
  <div id="grid" class="grid">
    <div class="loading">Cargando el archivo…</div>
  </div>
</div>

<script src="bgm.js" defer></script>
<script>
(async function(){
  const grid=document.getElementById('grid');

  // Estado del jugador para desbloqueos (Etapa 2)
  const jugador={
    hp: parseInt(localStorage.getItem('hero_pesos')||'0',10),
    puntos: parseInt(localStorage.getItem('puntos_ranking')||'0',10),
    desbloqueados: JSON.parse(localStorage.getItem('comics_desbloqueados')||'[]')
  };

  let config;
  try{
    const r=await fetch('comics_config.json?v='+Date.now());
    if(!r.ok) throw new Error(r.status);
    config=await r.json();
  }catch(e){
    grid.innerHTML='<div class="empty"><h2>Archivo vacío</h2><p>No se pudo cargar el catálogo. Intenta más tarde.</p></div>';
    console.error('Error cargando comics_config.json',e);
    return;
  }

  const comics=(config.comics||[]).slice().sort((a,b)=>(a.orden||0)-(b.orden||0));
  if(!comics.length){
    grid.innerHTML='<div class="empty"><h2>Próximamente</h2><p>Los cómics estarán aquí muy pronto.</p></div>';
    return;
  }

  grid.innerHTML='';
  comics.forEach(c=>{
    const bloqueado=c.desbloqueo?.requiere && !jugador.desbloqueados.includes(c.id);
    const el=document.createElement('div');
    el.className='comic';
    el.innerHTML=`
      <div class="cover ${!c.portada?'placeholder':''}">
        ${c.portada?`<img src="${c.portada}" alt="${escapeHtml(c.titulo)}" loading="lazy" onerror="this.parentElement.classList.add('placeholder');this.remove();this.parentElement.textContent='${(c.titulo||'?').charAt(0)}'">`:c.titulo.charAt(0)}
        ${c.arco?`<span class="arc-tag">${escapeHtml(c.arco)}</span>`:''}
        ${bloqueado?`<div class="lock"><div><div class="icon">🔒</div>${c.desbloqueo.costo_hp?c.desbloqueo.costo_hp+' HP':''}${c.desbloqueo.puntos_min?' · '+c.desbloqueo.puntos_min+' pts':''}</div></div>`:''}
      </div>
      <div class="info">
        <div class="titulo">${escapeHtml(c.titulo)}</div>
        ${c.subtitulo?`<div class="subtitulo">${escapeHtml(c.subtitulo)}</div>`:''}
        <div class="meta">${c.paginas?`<span>${c.paginas} pág</span>`:''}${c.publicado?`<span>${c.publicado.slice(0,4)}</span>`:''}</div>
      </div>`;
    el.addEventListener('click',()=>{
      if(bloqueado){
        alert('Este cómic está bloqueado.\nCosto: '+(c.desbloqueo.costo_hp||0)+' HP\nRanking mínimo: '+(c.desbloqueo.puntos_min||0)+' pts\n\nPodrás desbloquearlo desde la Tienda próximamente.');
        return;
      }
      location.href='lector.html?id='+encodeURIComponent(c.id);
    });
    grid.appendChild(el);
  });

  function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
})();
</script>
</body>
</html>
