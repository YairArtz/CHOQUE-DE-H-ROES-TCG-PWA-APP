<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#04061a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="manifest.json">
<script src="nexo-ui.js"></script>
<title>Choque de Héroes TCG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<script>
  // ── INTRO: redirigir si no ha sido vista ──
  if (!localStorage.getItem('nexo_intro_vista')) {
    window.location.replace('intro.html');
  }
</script>
<!--
  MENÚ PRINCIPAL (estilo consola)
  · Izquierda: menú grande (JUGAR, BARAJAS, COMUNIDAD, TIENDA, EXTRAS). Cada uno abre su lista de módulos.
  · Derecha: un héroe con su energía. Toca al héroe para cambiarlo.
  · Abajo: Novedades (banners) y un acceso destacado.
  Héroes del menú (opcional): assets/inicio/heroes.txt  →  una línea por héroe:  imagen | nombre
  Si no existe, se usan los del intro (assets/intro/regente.png, guardian.png).
  Para agregar/quitar módulos: edita SECCIONES más abajo (un solo lugar).
-->
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:rgb(var(--nx-k1)); --ink2:rgb(var(--nx-k4)); --steel:#2b3f86; --violet:#8b5cff; --violet2:#c69bff;
  --cyan:#36d6ff; --gold:#f5c842; --red:#ff3d6b; --txt:#eef2ff; --mut:#8d9bc7; --line:rgba(var(--nx-ln),.18);
  --accent:var(--gold);
  --safeT:max(12px,env(safe-area-inset-top)); --safeL:max(14px,env(safe-area-inset-left)); --safeR:max(14px,env(safe-area-inset-right)); --safeB:max(12px,env(safe-area-inset-bottom));
}
html,body{height:100%;background:var(--ink);color:var(--txt);font-family:'Rajdhani',system-ui,sans-serif;overflow:hidden;
  -webkit-tap-highlight-color:transparent;user-select:none}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
#bgm-btn{display:none!important}           /* la música se controla desde la barra superior */
.nx-gate{display:none!important}

/* El fondo (haces, partículas y gama elegida en la Tienda) lo pone nexo-ui.js */
/* ═══ ESTRUCTURA ═══ */
#app{position:relative;z-index:1;height:100dvh;display:grid;grid-template-rows:auto 1fr;padding:var(--safeT) var(--safeR) var(--safeB) var(--safeL)}
#hub{position:relative;display:grid;grid-template-columns:minmax(340px,40%) minmax(0,1fr);min-height:0}
#left,#feat,.topics,.pass{min-width:0}

/* ═══ BARRA SUPERIOR ═══ */
#top{display:flex;align-items:center;gap:10px;position:relative;z-index:5;min-width:0}
.plate{display:flex;align-items:center;gap:12px;min-width:0;max-width:min(420px,60vw);padding:6px 22px 6px 6px;position:relative;
  background:linear-gradient(90deg,rgba(var(--nx-k4),.92),rgba(var(--nx-k4),.55));border:1px solid var(--line);
  clip-path:polygon(0 0,100% 0,calc(100% - 14px) 100%,0 100%)}
.plate .av{width:46px;height:46px;flex-shrink:0;clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%);background:#1b2350 center/cover;
  box-shadow:inset 0 0 0 2px var(--gold)}
.plate .who{min-width:0;line-height:1.1}
.plate .nm{font-family:'Orbitron',sans-serif;font-weight:700;font-size:13px;letter-spacing:.08em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plate .id{font-size:13px;color:var(--mut);margin-top:3px}
.plate .bar{height:3px;margin-top:5px;background:rgba(255,255,255,.12);width:120px;position:relative;overflow:hidden}
.plate .bar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--gold),#fff3c4)}
.spacer{flex:1}
.hp{display:none;align-items:center;gap:8px;padding:7px 14px 7px 10px;background:rgba(var(--nx-k4),.8);border:1px solid var(--line);border-radius:4px;font-family:'Orbitron',sans-serif;font-weight:700;font-size:14px}
.hp.on{display:flex}
.hp img{width:20px;height:20px}
.tb{display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 8px;min-width:58px;color:#dfe6ff;opacity:.9;border-radius:6px}
.tb svg{width:24px;height:24px;fill:currentColor}
.tb small{font-size:11px;font-weight:600;letter-spacing:.03em;color:var(--mut)}
.tb:hover,.tb:focus-visible{opacity:1;color:#fff;background:rgba(var(--nx-ln),.08);outline:none}

/* ═══ MENÚ PRINCIPAL ═══ */
#left{position:relative;z-index:3;display:flex;flex-direction:column;min-height:0;padding:clamp(10px,4vh,40px) 0 0 clamp(6px,3vw,46px)}
#menu{display:flex;flex-direction:column;gap:clamp(4px,1.2vh,12px)}
.mi{position:relative;display:flex;align-items:center;gap:14px;padding:2px 0 2px 16px;text-align:left;width:max-content;
  font-family:'Orbitron',sans-serif;font-weight:700;font-size:clamp(20px,3.2vh,30px);letter-spacing:.06em;color:#e9edff;transition:transform .18s,color .18s}
.mi::before{content:'';position:absolute;left:0;top:18%;bottom:18%;width:3px;background:var(--c,var(--gold));box-shadow:0 0 10px var(--c,var(--gold));transition:width .18s}
.mi.big{font-size:clamp(40px,8vh,74px);font-weight:900;letter-spacing:.04em}
.mi .dot{position:absolute;left:-24px;top:50%;transform:translateY(-50%);width:16px;height:16px;border-radius:50%;background:var(--red);
  color:#fff;font:700 11px/16px 'Rajdhani',sans-serif;text-align:center;box-shadow:0 0 8px var(--red)}
.mi:hover,.mi:focus-visible,.mi.sel{transform:translateX(8px);color:#fff;outline:none}
.mi:hover::before,.mi:focus-visible::before,.mi.sel::before{width:6px}
.mi .hint{font-family:'Rajdhani',sans-serif;font-weight:600;font-size:15px;letter-spacing:0;color:var(--mut);opacity:0;transform:translateX(-6px);transition:opacity .18s,transform .18s;white-space:nowrap}
.mi:hover .hint,.mi:focus-visible .hint{opacity:1;transform:none}

/* ═══ SUBMENÚ (lista de módulos de cada sección) ═══ */
#sub{position:absolute;inset:clamp(10px,4vh,40px) 0 0 clamp(6px,3vw,46px);display:flex;flex-direction:column;gap:10px;z-index:4;
  opacity:0;pointer-events:none;transform:translateX(-24px);transition:opacity .22s,transform .22s}
#hub.subOn #sub{opacity:1;pointer-events:auto;transform:none}
#hub.subOn #menu,#hub.subOn #feat{opacity:0;pointer-events:none;transform:translateX(-24px)}
#menu,#feat{transition:opacity .22s,transform .22s}
.sh2{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.back{width:40px;height:40px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);background:rgba(var(--nx-k4),.8);font-size:22px;
  clip-path:polygon(30% 0,100% 0,100% 100%,30% 100%,0 50%)}
.back:hover,.back:focus-visible{border-color:var(--gold);color:var(--gold);outline:none}
.sh2 h2{font-family:'Orbitron',sans-serif;font-weight:900;font-size:clamp(26px,5vh,44px);letter-spacing:.05em;color:#fff;
  border-left:4px solid var(--c,var(--gold));padding-left:12px;line-height:1}
#subList{display:flex;flex-direction:column;gap:8px;overflow-y:auto;padding:4px 18px 16px 0;scrollbar-width:none;max-width:520px}
#subList::-webkit-scrollbar{display:none}
.row{position:relative;display:flex;align-items:center;gap:14px;padding:11px 26px 11px 12px;min-height:62px;
  background:linear-gradient(90deg,rgba(var(--nx-k5),.94),rgba(var(--nx-k5),.7));border:1px solid var(--line);
  clip-path:polygon(0 0,100% 0,calc(100% - 16px) 100%,0 100%);transition:background .15s,transform .15s}
.row::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c,var(--gold))}
.row .ic{width:42px;height:42px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:22px;background:rgba(255,255,255,.05);
  clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%)}
.row b{display:block;font-family:'Orbitron',sans-serif;font-weight:700;font-size:15px;letter-spacing:.04em;color:#fff}
.row span{display:block;font-size:15px;color:var(--mut);line-height:1.25;margin-top:2px}
.row:hover,.row:focus-visible{background:linear-gradient(90deg,rgba(139,92,255,.35),rgba(var(--nx-k5),.85));transform:translateX(4px);outline:none}
.row:hover b,.row:focus-visible b{color:var(--gold)}
.row.new::after{content:'NUEVO';position:absolute;right:26px;top:8px;font:700 10px 'Orbitron',sans-serif;letter-spacing:.1em;color:var(--ink);background:var(--gold);padding:2px 6px}

/* ═══ NOVEDADES + DESTACADO ═══ */
#feat{margin-top:auto;display:flex;flex-direction:column;gap:12px;padding-bottom:4px;max-width:420px}
.topics{position:relative;border:1px solid rgba(255,255,255,.22);background:rgb(var(--nx-k4));overflow:hidden;aspect-ratio:16/7.2;
  clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,0 100%)}
.topics .tag{position:absolute;top:0;left:0;z-index:2;font-size:13px;font-weight:700;padding:3px 10px;background:rgba(var(--nx-k1),.75)}
.topics .trk{display:flex;height:100%;transition:transform .55s cubic-bezier(.7,0,.2,1)}
.topics img{min-width:100%;height:100%;object-fit:cover;display:block}
.topics .dots{position:absolute;bottom:6px;left:0;right:0;display:flex;justify-content:center;gap:6px;z-index:2}
.topics .dots button{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.35)}
.topics .dots button.on{background:#fff}
.pass{position:relative;display:flex;align-items:center;gap:14px;padding:12px 14px;min-height:76px;overflow:hidden;
  background:linear-gradient(100deg,#f5c842,#e0a515 60%,#b97b00);color:#1a1200;clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,0 100%)}
.pass .ph{position:absolute;right:0;top:0;bottom:0;width:46%;background:center/cover;opacity:.85;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 45%);mask-image:linear-gradient(90deg,transparent,#000 45%)}
.pass .tx{position:relative;z-index:1;max-width:62%}
.pass b{display:block;font-family:'Orbitron',sans-serif;font-weight:900;font-size:16px;letter-spacing:.04em}
.pass span{display:block;font-size:15px;font-weight:600;margin-top:2px;line-height:1.2}
.pass:hover,.pass:focus-visible{filter:brightness(1.08);outline:2px solid #fff;outline-offset:-2px}

/* ═══ HÉROE ═══ */
#art{position:relative;z-index:2;min-height:0;cursor:pointer}
#art .hero{position:absolute;left:50%;bottom:0;height:100%;max-width:100%;object-fit:contain;object-position:bottom;transform:translateX(-50%);
  filter:drop-shadow(0 0 26px rgba(139,92,255,.45)) drop-shadow(0 20px 40px rgba(0,0,0,.6));transition:opacity .45s}
#art .hero.fade{opacity:0}
#art svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
#art .str{fill:none;stroke-width:1.3;stroke-linecap:round}
#art .run{fill:none;stroke-width:2.2;stroke-linecap:round;stroke-dasharray:70 520;animation:flow linear infinite}
@keyframes flow{from{stroke-dashoffset:590}to{stroke-dashoffset:0}}
#art .glow{position:absolute;left:50%;top:44%;width:70%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(circle,rgba(var(--nx-g1,139,92,255),.38),rgba(var(--nx-g1,139,92,255),.12) 45%,transparent 70%)}
#art .name{position:absolute;right:0;bottom:12px;text-align:right;font-family:'Orbitron',sans-serif;font-weight:700;font-size:13px;letter-spacing:.1em;color:#d8ccff;
  padding:6px 14px;background:linear-gradient(270deg,rgba(var(--nx-k4),.85),transparent)}
#art .name small{display:block;font-family:'Rajdhani',sans-serif;font-weight:600;font-size:12px;letter-spacing:.02em;color:var(--mut)}

footer{position:fixed;left:var(--safeL);bottom:2px;font-size:11px;color:#5d6893;z-index:1;pointer-events:none}

/* ═══ CELULAR VERTICAL ═══ */
@media (max-aspect-ratio:1/1){
  #hub{grid-template-columns:minmax(0,1fr)}
  #art{position:absolute;inset:4px -16% 21% 14%;z-index:1;opacity:.92}
  #art .hero{left:auto;right:0;transform:none;height:100%}
  #art .name{display:none}
  #left{padding:min(26vh,210px) 0 0 4px;background:linear-gradient(90deg,rgba(var(--nx-k1),.55),transparent 75%)}
  .mi{font-size:clamp(20px,5.6vw,26px)}
  .mi.big{font-size:clamp(42px,13vw,64px)}
  .mi .hint{display:none}
  #feat{max-width:none;flex-direction:row;gap:10px}
  .topics{flex:1.4;aspect-ratio:auto;height:104px}
  .pass{flex:1;flex-direction:column;align-items:flex-start;justify-content:flex-end;height:104px;min-height:0}
  .pass .ph{width:100%;opacity:.35;-webkit-mask-image:none;mask-image:none}
  .pass .tx{max-width:none}
  .pass b{font-size:13px}.pass span{font-size:13px}
  .plate{padding-right:18px;flex:1 1 auto;max-width:none}.plate .bar{display:none}.plate .id{white-space:nowrap;font-size:12px}.spacer{display:none}
  .hp{padding:6px 10px 6px 8px;font-size:13px}
  #top{gap:6px}.tb.opt{display:none}
  #art .hero{-webkit-mask-image:linear-gradient(180deg,#000 75%,transparent);mask-image:linear-gradient(180deg,#000 75%,transparent)}
  .tb{min-width:0;padding:4px}.tb small{display:none}
  #sub{inset:min(16vh,120px) 0 0 4px}
  #subList{max-width:none;padding-right:4px}
  footer{display:none}
}
@media (max-aspect-ratio:1/1) and (max-width:380px){#feat{flex-direction:column}.pass{min-height:70px}}
@media (max-height:520px) and (min-aspect-ratio:1/1){
  .mi.big{font-size:clamp(30px,9vh,48px)} .mi{font-size:clamp(16px,4.2vh,22px)} #feat{flex-direction:row;max-width:none;width:min(560px,100%)}
  .topics{flex:1.3;aspect-ratio:auto;min-height:80px}.pass{flex:1;min-height:80px}
}
@media (prefers-reduced-motion:reduce){.mote,#art .run{animation:none;display:none}.mi,.row,#sub,#menu,#feat{transition:none}}

/* ═══ Avisos in-app (los mismos de siempre) ═══ */
#chh-notif-container{position:fixed;top:0;left:0;right:0;z-index:9998;pointer-events:none;display:flex;flex-direction:column;align-items:center;padding:10px 12px;gap:8px}
.chh-notif{width:100%;max-width:440px;background:linear-gradient(135deg,rgba(6,9,32,.97),rgba(14,10,40,.97));border:1px solid rgba(var(--nx-ln),.35);
  box-shadow:0 0 24px rgba(139,92,255,.18);padding:12px 14px;display:flex;align-items:flex-start;gap:12px;pointer-events:all;cursor:pointer;
  transform:translateY(-120%);transition:transform .35s cubic-bezier(.175,.885,.32,1.275);position:relative;overflow:hidden;clip-path:polygon(0 0,100% 0,100% 100%,14px 100%,0 calc(100% - 14px))}
.chh-notif.visible{transform:translateY(0)}
.chh-notif::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--violet),var(--cyan),transparent)}
.chh-notif-icon{width:38px;height:38px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:1.2rem;background:rgba(139,92,255,.12);border:1px solid rgba(139,92,255,.3)}
.chh-notif-icon.gold{background:rgba(245,200,66,.1);border-color:rgba(245,200,66,.35)}
.chh-notif-body{flex:1;min-width:0}
.chh-notif-tag{font-family:'Orbitron',sans-serif;font-size:.62rem;font-weight:700;letter-spacing:2px;color:var(--violet2);margin-bottom:3px}
.chh-notif-tag.gold{color:var(--gold)}
.chh-notif-title{font-family:'Orbitron',sans-serif;font-size:.8rem;font-weight:700;color:#fff;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chh-notif-text{font-size:.9rem;color:rgba(210,220,255,.72);line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.chh-notif-close{color:rgba(210,220,255,.45);font-size:.9rem;padding:0 0 0 8px;align-self:flex-start}
#installBtn{display:none;position:fixed;bottom:calc(var(--safeB) + 10px);right:var(--safeR);z-index:9000;padding:10px 18px;font:700 11px 'Orbitron',sans-serif;letter-spacing:.15em;
  color:var(--ink);background:var(--gold);clip-path:polygon(0 0,100% 0,calc(100% - 10px) 100%,0 100%)}
</style>
</head>
<body>
<div id="chh-notif-container"></div>

<div id="app">
  <header id="top">
    <a class="plate" href="perfil.html" id="plate" aria-label="Mi perfil">
      <div class="av" id="pAv"></div>
      <div class="who"><div class="nm" id="pNom">Invitado</div><div class="id" id="pId">Inicia sesión en Mi perfil</div><div class="bar"><i id="pBar" style="width:0%"></i></div></div>
    </a>
    <div class="spacer"></div>
    <a class="hp" id="hp" href="tienda.html" aria-label="Hero Pesos"><img src="hero_pesos/hp_coin.png" alt="" onerror="this.replaceWith(document.createTextNode('💰'))"><span id="hpVal">—</span></a>
    <a class="tb opt" href="noticias.html" aria-label="Noticias"><svg viewBox="0 0 24 24"><path d="M4 5h13v14H5a1 1 0 0 1-1-1zm13 3h3v10a1 1 0 0 1-1 1h-2zM7 8v3h7V8zm0 5v1.5h7V13zm0 3v1.5h5V16z"/></svg><small>Noticias</small></a>
    <button class="tb" id="tbMus" type="button" aria-label="Música"><svg viewBox="0 0 24 24"><path id="musIco" d="M9 18.5A2.5 2.5 0 1 1 7 16V5l12-2v11.5A2.5 2.5 0 1 1 17 12V7.2L9 8.5z"/></svg><small id="musTxt">Música</small></button>
    <button class="tb" type="button" onclick="abrirManual()" aria-label="Manual"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 1 0 20 10 10 0 0 1 0-20m0 14.2a1.3 1.3 0 1 0 0 2.6 1.3 1.3 0 0 0 0-2.6M12 5.5c-2.2 0-3.8 1.4-3.9 3.4h2.3c.1-.9.7-1.4 1.6-1.4s1.5.5 1.5 1.3c0 .7-.4 1-1.3 1.6-1 .6-1.6 1.3-1.5 2.6v.6h2.2v-.5c0-.7.3-1 1.2-1.6 1-.6 1.8-1.4 1.8-2.8 0-2-1.7-3.5-3.9-3.5"/></svg><small>Ayuda</small></button>
    <a class="tb" href="ajustes.html" aria-label="Ajustes"><svg viewBox="0 0 24 24"><path d="M19.1 12.9a7 7 0 0 0 0-1.9l2-1.6a.5.5 0 0 0 .1-.6l-1.9-3.3a.5.5 0 0 0-.6-.2l-2.4 1a7 7 0 0 0-1.6-.9l-.4-2.6a.5.5 0 0 0-.5-.4h-3.8a.5.5 0 0 0-.5.4l-.4 2.6a7 7 0 0 0-1.6.9l-2.4-1a.5.5 0 0 0-.6.2L2.7 8.8a.5.5 0 0 0 .1.6l2 1.6a7 7 0 0 0 0 1.9l-2 1.6a.5.5 0 0 0-.1.6l1.9 3.3c.1.2.4.3.6.2l2.4-1c.5.4 1 .7 1.6.9l.4 2.6c0 .2.2.4.5.4h3.8c.3 0 .5-.2.5-.4l.4-2.6c.6-.2 1.1-.5 1.6-.9l2.4 1c.2.1.5 0 .6-.2l1.9-3.3a.5.5 0 0 0-.1-.6zM12 15.6a3.6 3.6 0 1 1 0-7.2 3.6 3.6 0 0 1 0 7.2"/></svg><small>Ajustes</small></a>
  </header>

  <main id="hub">
    <section id="left">
      <nav id="menu" aria-label="Menú principal"></nav>
      <div id="sub" aria-live="polite">
        <div class="sh2"><button class="back" id="back" type="button" aria-label="Regresar">‹</button><h2 id="subT"></h2></div>
        <div id="subList" role="menu"></div>
      </div>
      <div id="feat">
        <div class="topics" id="topics" aria-label="Novedades">
          <div class="tag">Novedades</div>
          <div class="trk" id="trk">
            <img src="Banner_1.jpg" alt="Torneo Ecom Geek">
            <img src="Banner_2.jpg" alt="Mini-expansión Variantes">
            <img src="Banner_5.jpg" alt="Torneo Victory Road">
            <img src="Banner_3.jpg" alt="Registro de jugador">
            <img src="Banner_4.jpg" alt="Victory Road en tiendas">
          </div>
          <div class="dots" id="dots"></div>
        </div>
        <a class="pass" id="pass" href="arcade.html">
          <div class="ph" id="passImg" style="background-image:url('assets/arcade/portada.jpg')"></div>
          <div class="tx"><b id="passT">MODO ARCADE</b><span id="passS">15 rivales y un jefe final. Tu progreso se guarda.</span></div>
        </a>
      </div>
    </section>
    <section id="art" aria-label="Héroe del menú (toca para cambiar)">
      <div class="glow"></div>
      <svg viewBox="0 0 600 700" preserveAspectRatio="xMidYMid slice" aria-hidden="true" id="strands"></svg>
      <img class="hero" id="hero" alt="">
      <div class="name" id="heroName"></div>
    </section>
  </main>
  <footer>© 2016–2026 Codex Studio · Codex Cómics</footer>
</div>

<script>
// ════════════════════════════════════════════════════════════
//  SECCIONES — único lugar para agregar o quitar módulos
// ════════════════════════════════════════════════════════════
const SECCIONES = [
  { id:'jugar', txt:'JUGAR', big:true, c:'#ff3d6b', hint:'Simulador, Arcade, Aventura y más', items:[
    { href:'simulacion.html', ic:'🤖', t:'Simulación de batalla', d:'Juega una partida contra la CPU' },
    { href:'arcade.html', ic:'🕹', t:'Modo Arcade', d:'15 rivales y un jefe final. Tu progreso se guarda' },
    { href:'nexotlan.html', ic:'🗺️', t:'Aventura: Nexotlan', d:'Explora la ciudad, reta rivales y vence a sus guardianes', gate:true },
    { href:'online.html', ic:'🌐', t:'Choque online', d:'Reta a un amigo con un código de sala' },
    { href:'tutorial.html', ic:'🎮', t:'Aprende a jugar', d:'Tutorial interactivo paso a paso' },
    { href:'calculadora.html', ic:'⚔️', t:'Calculadora', d:'Contadores y zonas para partidas con cartas físicas' } ] },
  { id:'barajas', txt:'BARAJAS', c:'#36d6ff', hint:'Arma, colecciona y aprende', items:[
    { href:'constructor.html', ic:'🏗️', t:'Constructor de barajas', d:'Arma y guarda tus barajas' },
    { href:'coleccion.html', ic:'📚', t:'Mi colección', d:'Tus cartas digitales y físicas' },
    { href:'galeria.html', ic:'🃏', t:'Galería de cartas', d:'Explora el catálogo completo' },
    { href:'academia.html', ic:'🎓', t:'Academia Heroica', d:'Barajas y estrategias de la comunidad' },
    { href:'reglamento.html', ic:'📖', t:'Reglamento', d:'Reglas oficiales del juego' } ] },
  { id:'comunidad', txt:'COMUNIDAD', c:'#8b5cff', hint:'Perfil, torneos, ranking y tiendas', items:[
    { href:'perfil.html', ic:'👤', t:'Mi perfil', d:'Tu ranking, barajas y logros' },
    { href:'registro-jugadores.html', ic:'🪪', t:'Registro de jugadores', d:'Obtén tu ID oficial CHH' },
    { href:'ranking.html', ic:'🏆', t:'Ranking global', d:'Los mejores jugadores de la temporada' },
    { href:'calendario.html', ic:'📅', t:'Calendario de torneos', d:'Próximos eventos oficiales' },
    { href:'publicar-torneo.html', ic:'📋', t:'Publicar torneo', d:'Registra tu evento oficial' },
    { href:'mapa-tiendas.html', ic:'📍', t:'Mapa de tiendas', d:'Encuentra tu tienda más cercana' },
    { href:'registro-tiendas.html', ic:'🏪', t:'Tiendas oficiales', d:'Registra una tienda nueva' } ] },
  { id:'tienda', txt:'TIENDA', c:'#f5c842', hint:'Tienda digital, Tienda Online y precios', items:[
    { href:'tienda.html', ic:'💎', t:'Tienda digital', d:'Sobres, avatares, micas, playmats y temas con Hero Pesos' },
    { href:'tienda-fisica.html', ic:'📦', t:'Tienda Online', d:'Preventas y productos con envío o entrega personal' },
    { href:'mercado/mercado.html', ic:'💰', t:'Mercado Heroico', d:'Precios sugeridos de cartas en MXN' } ] },
  { id:'extras', txt:'EXTRAS', c:'#00e0a4', hint:'Cómics, música, videos y noticias', items:[
    { href:'comics.html', ic:'📖', t:'Comicteca', d:'Lee los cómics de los héroes del TCG' },
    { href:'musica.html', ic:'🎵', t:'Soundtrack', d:'Música de batalla para tus partidas' },
    { href:'videos.html', ic:'🎬', t:'Videos', d:'Tutoriales, torneos y más' },
    { href:'noticias.html', ic:'📰', t:'Noticias', d:'Las últimas novedades del juego' } ] }
];
const $ = id => document.getElementById(id);
let NX_OK = false;

// ── Menú grande ──
const menu = $('menu');
SECCIONES.forEach(s => {
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'mi' + (s.big ? ' big' : ''); b.style.setProperty('--c', s.c); b.dataset.sec = s.id;
  b.innerHTML = '<span>' + s.txt + '</span><span class="hint">' + s.hint + '</span>';
  b.onclick = () => abrirSeccion(s.id, true);
  menu.appendChild(b);
});
function abrirSeccion(id, foco) {
  const s = SECCIONES.find(x => x.id === id); if (!s) return;
  $('subT').textContent = s.txt; $('sub').style.setProperty('--c', s.c);
  const L = $('subList'); L.innerHTML = '';
  s.items.filter(it => !it.gate || NX_OK).forEach(it => {
    const a = document.createElement('a'); a.className = 'row'; a.href = it.href; a.style.setProperty('--c', s.c); a.setAttribute('role', 'menuitem');
    a.innerHTML = '<div class="ic">' + it.ic + '</div><div><b>' + it.t + '</b><span>' + it.d + '</span></div>';
    L.appendChild(a);
  });
  $('hub').classList.add('subOn'); SEC = id;
  try { history.replaceState(null, '', '#' + id); } catch (e) {}
  setTimeout(() => { const f = L.querySelector('.row'); if (foco && f) { if (window.GP && GP.activo()) GP.enfocar(f); else if (matchMedia('(hover:none)').matches === false) f.focus({ preventScroll: true }); } }, 60);
}
let SEC = null;
function cerrarSeccion() {
  if (!SEC) return false;
  const prev = SEC; SEC = null; $('hub').classList.remove('subOn');
  try { history.replaceState(null, '', location.pathname); } catch (e) {}
  const b = menu.querySelector('[data-sec="' + prev + '"]');
  setTimeout(() => { if (window.GP && GP.activo()) GP.enfocar(b); }, 60);
  return true;
}
$('back').onclick = cerrarSeccion;
document.addEventListener('keydown', e => { if (e.key === 'Escape' || e.key === 'Backspace') { if (cerrarSeccion()) e.preventDefault(); } });
if (location.hash && SECCIONES.some(s => '#' + s.id === location.hash)) abrirSeccion(location.hash.slice(1));

// ── Perfil ──
(function () {
  let s = null; try { s = JSON.parse(localStorage.getItem('nhSesion') || 'null'); } catch (e) {}
  const av = () => {
    if (!s || s.tipo === 'tienda') return 'footer-logo.png';
    let id = null; try { id = localStorage.getItem('nhAv_' + String(s.id).trim()) || localStorage.getItem('nhAv_' + String(s.id).trim().toUpperCase()); } catch (e) {}
    if (!id) return 'avatares/avatar_1.jpg';
    if (/^av_p\d+$/.test(id)) return 'avatares/' + id + '.jpg';
    const m = id.match(/^av(\d+)$/); return m ? 'avatares/avatar_' + m[1] + '.jpg' : 'avatares/avatar_1.jpg';
  };
  $('pAv').style.backgroundImage = 'url("' + av() + '")';
  if (s && s.id) {
    $('pNom').textContent = s.nick || s.nombre || s.nombreTienda || s.id;
    $('pId').textContent = (s.tipo === 'tienda' ? 'Tienda ' : 'ID ') + s.id;
    // Barra: secciones del ecosistema visitadas (para badges)
    try { const v = JSON.parse(localStorage.getItem('chh_secciones_visitadas') || '[]'); $('pBar').style.width = Math.min(100, v.length * 100 / 20) + '%'; } catch (e) {}
    // Hero Pesos (último saldo guardado al instante; se actualiza en segundo plano)
    if (s.tipo !== 'tienda') {
      const hp = $('hp'), cache = localStorage.getItem('chh_hp_cache');
      if (cache) { $('hpVal').textContent = cache; hp.classList.add('on'); }
      const URL_HP = 'https://script.google.com/macros/s/AKfycbwSrBH7yJiyTlPabzJ_WiXQDWPe7RpATmuTTWAe3uVRy6wuGh15QpuOMzSiZVixJK_S/exec';
      setTimeout(() => {
        const ctrl = new AbortController(); setTimeout(() => ctrl.abort(), 15000);
        fetch(URL_HP + '?action=saldo&playerid=' + encodeURIComponent(s.id), { signal: ctrl.signal }).then(r => r.json()).then(d => {
          if (d && d.status === 'ok') { $('hpVal').textContent = d.saldo; hp.classList.add('on'); try { localStorage.setItem('chh_hp_cache', String(d.saldo)); } catch (e) {} }
        }).catch(() => {});
      }, 2500);
    }
  }
})();

// ── Música (controla el reproductor persistente de bgm.js) ──
function pintarMus() { let m = false; try { m = localStorage.getItem('bgm_muted') === '1'; } catch (e) {} $('musTxt').textContent = m ? 'Silencio' : 'Música'; $('tbMus').style.opacity = m ? .5 : ''; }
$('tbMus').onclick = () => { const b = document.getElementById('bgm-btn'); if (b) b.click(); setTimeout(pintarMus, 30); };
pintarMus();

// ── Héroe del menú ──
let HEROES = [{ img: 'assets/intro/regente.png', nom: 'Vellond', sub: 'Gran Regente de Nexotlan' }, { img: 'assets/intro/guardian.png', nom: 'Guardián del Nexo', sub: 'Custodio del Omniverso' }];
let hi = 0;
function ponerHeroe(i, anim) {
  const h = HEROES[i]; if (!h) return; hi = i;
  const img = $('hero');
  const set = () => { img.src = h.img; $('heroName').innerHTML = h.nom ? (h.nom + (h.sub ? '<small>' + h.sub + '</small>' : '')) : ''; img.classList.remove('fade'); };
  if (anim) { img.classList.add('fade'); setTimeout(set, 380); } else set();
  try { localStorage.setItem('chh_menu_heroe', String(i)); } catch (e) {}
}
fetch('assets/inicio/heroes.txt', { cache: 'no-cache' }).then(r => r.ok ? r.text() : '').then(t => {
  const L = t.split(/\r?\n/).map(l => l.trim()).filter(l => l && !l.startsWith('#')).map(l => { const [img, nom, sub] = l.split('|').map(x => (x || '').trim()); return { img: /[\/]/.test(img) ? img : 'assets/inicio/' + img, nom, sub }; }).filter(h => h.img);
  if (L.length) HEROES = L;
}).catch(() => {}).finally(() => { let i = 0; try { i = (parseInt(localStorage.getItem('chh_menu_heroe'), 10) + 1) % HEROES.length || 0; } catch (e) {} ponerHeroe(i); });
$('art').addEventListener('click', () => ponerHeroe((hi + 1) % HEROES.length, true));

// ── Hebras de energía detrás del héroe (se generan una vez) ──
(function () {
  const svg = $('strands'), cols = ['#c69bff', '#8b5cff', '#e2c6ff', '#36d6ff'];
  let html = '';
  for (let k = 0; k < 26; k++) {
    const lado = k % 2 ? 1 : -1, y0 = 250 + Math.random() * 90, x0 = 300 + lado * (20 + Math.random() * 30);
    const x3 = 300 + lado * (230 + Math.random() * 90), y3 = 40 + Math.random() * 600;
    const c1x = 300 + lado * (60 + Math.random() * 160), c1y = y0 - 160 + Math.random() * 120, c2x = x3 - lado * Math.random() * 120, c2y = y3 + (Math.random() - .5) * 260;
    const d = `M${x0.toFixed(0)} ${y0.toFixed(0)} C${c1x.toFixed(0)} ${c1y.toFixed(0)} ${c2x.toFixed(0)} ${c2y.toFixed(0)} ${x3.toFixed(0)} ${y3.toFixed(0)}`, c = cols[k % cols.length];
    html += `<path class="str" d="${d}" stroke="${c}" opacity="${(.18 + Math.random() * .3).toFixed(2)}"/>`;
    if (k % 2 === 0) html += `<path class="run" d="${d}" stroke="#f1e4ff" style="animation-duration:${(3.5 + Math.random() * 4).toFixed(1)}s;animation-delay:${(-Math.random() * 6).toFixed(1)}s;opacity:.85"/>`;
  }
  svg.innerHTML = '<defs><filter id="gl"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><g filter="url(#gl)">' + html + '</g>';
})();

// ── Partículas del fondo ──

// ── Novedades (carrusel) ──
let slideIndex = 0, autoSlide = null;
const slides = [...document.querySelectorAll('#trk img')], slideCount = slides.length;
$('dots').innerHTML = slides.map((_, i) => '<button type="button" aria-label="Novedad ' + (i + 1) + '"' + (i ? '' : ' class="on"') + '></button>').join('');
function goSlide(n) { slideIndex = n; $('trk').style.transform = 'translateX(-' + n * 100 + '%)'; $('dots').querySelectorAll('button').forEach((d, i) => d.classList.toggle('on', i === n)); resetAuto(); }
function nextSlide() { goSlide((slideIndex + 1) % slideCount); }
function resetAuto() { clearInterval(autoSlide); autoSlide = setInterval(nextSlide, 5000); }
$('dots').querySelectorAll('button').forEach((d, i) => d.onclick = e => { e.stopPropagation(); goSlide(i); });
$('topics').addEventListener('click', () => { location.href = 'noticias.html'; });
(function () { let x0 = null; const t = $('topics'); t.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; }, { passive: true });
  t.addEventListener('touchend', e => { if (x0 == null) return; const dx = e.changedTouches[0].clientX - x0; x0 = null; if (Math.abs(dx) > 40) { e.preventDefault(); goSlide((slideIndex + (dx < 0 ? 1 : slideCount - 1)) % slideCount); } }); })();
resetAuto();

// ── Nexotlan en pruebas: aparece solo para las IDs de assets/nexotlan/testers.txt ("*" = todos) ──
fetch('assets/nexotlan/testers.txt', { cache: 'no-cache' }).then(r => r.ok ? r.text() : '').then(t => {
  const l = t.split(/\r?\n/).map(x => x.replace(/#.*/, '').trim().toUpperCase()).filter(Boolean);
  let id = ''; try { const s = JSON.parse(localStorage.getItem('nhSesion') || 'null'); if (s && s.tipo !== 'tienda' && s.id) id = String(s.id).toUpperCase(); } catch (e) {}
  if (l.includes('*') || (id && l.includes(id))) {
    NX_OK = true;
    $('pass').href = 'nexotlan.html'; $('passT').textContent = 'AVENTURA: NEXOTLAN';
    $('passS').textContent = 'Recorre la ciudad entre dimensiones y vence a sus guardianes.';
    $('passImg').style.backgroundImage = "url('assets/nexotlan/titulo/titulo.jpg')";
    if (SEC === 'jugar') abrirSeccion('jugar');
  }
}).catch(() => {});

// ── Control (gamepad.js) ──
window.GP_CFG = Object.assign(window.GP_CFG || {}, {
  zonas: ['#menu', '#sub', '#feat', '#top'],
  inicial: () => SEC ? document.querySelector('#subList .row') : menu.querySelector('.mi'),
  atras: () => cerrarSeccion(),
  ambito: f => (SEC && f && f.closest && f.closest('#sub')) ? $('sub') : null
});

// ── Flag de tracking para badges (v3) ──
try { const s = JSON.parse(localStorage.getItem('chh_secciones_visitadas') || '[]'); if (!s.includes('index')) { s.push('index'); localStorage.setItem('chh_secciones_visitadas', JSON.stringify(s)); } } catch (e) {}
</script>

<script>
// ── Service Worker (sin recarga forzada) ──
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./sw.js', { scope: './' })
      .then(function (reg) { if (reg.waiting) reg.waiting.postMessage({ type: 'SKIP_WAITING' }); setTimeout(function () { reg.update().catch(function () {}); }, 5000); })
      .catch(function (err) { console.log('[PWA] SW error:', err); });
  });
}
// ── Botón de instalación ──
let deferredPrompt = null;
const installBtn = document.createElement('button'); installBtn.id = 'installBtn'; installBtn.type = 'button'; installBtn.textContent = '⬇ INSTALAR APP';
document.body.appendChild(installBtn);
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; installBtn.style.display = 'block'; });
installBtn.addEventListener('click', async () => { if (!deferredPrompt) return; deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt = null; installBtn.style.display = 'none'; });
window.addEventListener('appinstalled', () => { deferredPrompt = null; installBtn.style.display = 'none'; });
</script>

<script>
// ── AVISOS IN-APP (noticias, torneos, Academia) ──
const _notifQueue = []; let _notifShowing = false;
function chhNotif(tipo, titulo, texto, url) { _notifQueue.push({ tipo, titulo, texto, url }); if (!_notifShowing) _nextNotif(); }
function _nextNotif() {
  if (!_notifQueue.length) { _notifShowing = false; return; }
  _notifShowing = true;
  const { tipo, titulo, texto, url } = _notifQueue.shift();
  const isGold = tipo === 'torneo';
  const emoji = tipo === 'noticia' ? '📰' : tipo === 'torneo' ? '⚔️' : tipo === 'resultado' ? '🏆' : tipo === 'academia' ? '📚' : '🔔';
  const tag = tipo === 'noticia' ? 'NUEVA NOTICIA' : tipo === 'torneo' ? 'NUEVO TORNEO' : tipo === 'resultado' ? 'RESULTADOS' : tipo === 'academia' ? 'ACADEMIA HEROICA' : 'AVISO';
  const el = document.createElement('div'); el.className = 'chh-notif';
  el.innerHTML = `<div class="chh-notif-icon ${isGold ? 'gold' : ''}">${emoji}</div><div class="chh-notif-body"><div class="chh-notif-tag ${isGold ? 'gold' : ''}">${tag}</div><div class="chh-notif-title">${titulo}</div><div class="chh-notif-text">${texto}</div></div><button class="chh-notif-close" onclick="event.stopPropagation();_dismissNotif(this.closest('.chh-notif'))">✕</button>`;
  if (url) el.addEventListener('click', () => { window.location.href = url; });
  document.getElementById('chh-notif-container').appendChild(el);
  requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('visible')));
  el._timer = setTimeout(() => _dismissNotif(el), 6000);
}
function _dismissNotif(el) { if (!el) return; clearTimeout(el._timer); el.classList.remove('visible'); setTimeout(() => { el.remove(); setTimeout(_nextNotif, 200); }, 350); }
function fetchT(url, ms) { const ctrl = new AbortController(); const t = setTimeout(() => ctrl.abort(), ms || 8000); return fetch(url, { signal: ctrl.signal }).finally(() => clearTimeout(t)); }
async function chhCheckNovedades() { try { await _checkNoticiasBanner(); } catch (e) {} try { await _checkTorneosBanner(); } catch (e) {} try { await _checkAcademiaBanner(); } catch (e) {} }
const ACADEMIA_URL_NOTIF = 'https://script.google.com/macros/s/AKfycbxC8MztvNoOUGya3uVNIlOCFrGEWZeAfyu0Qho7KpBchuJKzpFkPyUPMqY3vimwA3Wi/exec';
async function _checkAcademiaBanner() {
  const res = await fetchT(ACADEMIA_URL_NOTIF + '?action=novedad&_t=' + Date.now()); if (!res.ok) return;
  const data = await res.json(); if (data.status !== 'ok' || !data.baraja) return;
  const b = data.baraja; if (b.id === localStorage.getItem('chh_last_academia')) return;
  localStorage.setItem('chh_last_academia', b.id);
  chhNotif('academia', b.titulo, `Baraja compartida por ${b.autor_nombre}`, './academia.html?baraja=' + encodeURIComponent(b.id));
}
async function _checkNoticiasBanner() {
  const res = await fetchT('./noticias.json?_t=' + Date.now()); if (!res.ok) return;
  const noticias = await res.json(); if (!noticias.length) return;
  const primera = noticias[0]; if (primera.titulo === localStorage.getItem('chh_last_noticia')) return;
  localStorage.setItem('chh_last_noticia', primera.titulo);
  chhNotif('noticia', primera.titulo, primera.resumen, './noticias.html');
}
async function _checkTorneosBanner() {
  const API = 'https://script.google.com/macros/s/AKfycbxQwDgsNe-toSWetc2f-xkveQcywfGwOVQvsOEySgRc2z8YZG09mB20jUjrI9qO1yo9Uw/exec';
  const res = await fetchT(API + '?_t=' + Date.now()); if (!res.ok) return;
  const data = await res.json(); const torneos = data.torneos || []; if (!torneos.length) return;
  const vistos = JSON.parse(localStorage.getItem('chh_last_torneos') || '[]');
  const nuevos = torneos.filter(t => !vistos.includes(t.storeid + '_' + t.tourname)); if (!nuevos.length) return;
  localStorage.setItem('chh_last_torneos', JSON.stringify(torneos.map(t => t.storeid + '_' + t.tourname)));
  for (const t of nuevos.slice(0, 2)) { const lugar = [t.ciudad, t.estado].filter(Boolean).join(', '); chhNotif('torneo', t.tourname, (t.date || '') + (t.time ? ' · ' + t.time : '') + (lugar ? ' · ' + lugar : ''), './calendario.html'); }
}
window.addEventListener('load', () => setTimeout(chhCheckNovedades, 4000));
</script>
