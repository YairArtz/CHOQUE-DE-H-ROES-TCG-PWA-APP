<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Nexo de Héroes — Intro</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #000;
    font-family: 'Segoe UI', system-ui, sans-serif;
    touch-action: manipulation;
  }

  /* ── FONDO ── */
  #fondo {
    position: fixed;
    inset: 0;
    background-size: cover;
    background-position: center top;
    background-repeat: no-repeat;
    transition: opacity 0.6s ease;
  }
  #fondo::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom,
      rgba(0,0,0,0.05) 0%,
      rgba(0,0,0,0.15) 60%,
      rgba(0,0,0,0.75) 100%);
    transition: opacity 0.4s ease;
    pointer-events: none;
  }
  /* Desactiva el overlay cuando hay imagen pantalla-completa */
  body.modo-pantalla-completa #fondo::after {
    opacity: 0;
  }

  /* ── ESCENARIO DE PERSONAJES ── */
  #escenario {
    position: fixed;
    bottom: 190px;
    left: 0; right: 0;
    height: calc(100vh - 190px);
    pointer-events: none;
  }

  .personaje-slot {
    position: absolute;
    bottom: 0;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    transition: opacity 0.4s ease, filter 0.4s ease;
  }

  .personaje-slot.izquierda   { left: -2%; transform-origin: bottom left; }
  .personaje-slot.centro      { left: 50%; transform: translateX(-50%); transform-origin: bottom center; }
  .personaje-slot.derecha     { right: -2%; transform-origin: bottom right; }

  .personaje-slot img {
    max-height: calc(100vh - 200px);
    max-width: 88vw;
    object-fit: contain;
    display: block;
    filter: drop-shadow(0 8px 32px rgba(0,0,0,0.7));
  }

  /* Personaje inactivo */
  .personaje-slot.inactivo {
    filter: brightness(0.5) saturate(0.5);
    opacity: 0.8;
  }

  /* ── PANTALLA COMPLETA ── */
  .personaje-slot.pantalla-completa {
    left: 0;
    right: 0;
    bottom: 0;
    width: 100%;
    transform: none !important;
    filter: none !important;
    opacity: 1 !important;
  }
  .personaje-slot.pantalla-completa img {
    width: 100%;
    height: calc(100vh - 190px);
    max-width: 100%;
    max-height: none;
    object-fit: cover;
    object-position: center center;
    filter: none !important;
  }
  /* Inactivo nunca oscurece pantalla-completa */
  .personaje-slot.pantalla-completa.inactivo {
    filter: none !important;
    opacity: 1 !important;
  }

  /* ── ANIMACIONES DE ENTRADA ── */
  @keyframes entradaAbajo {
    from { opacity: 0; transform: translateY(60px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes entradaDerecha {
    from { opacity: 0; transform: translateX(80px); }
    to   { opacity: 1; transform: translateX(0); }
  }
  @keyframes entradaIzquierda {
    from { opacity: 0; transform: translateX(-80px); }
    to   { opacity: 1; transform: translateX(0); }
  }
  @keyframes entradaFade {
    from { opacity: 0; }
    to   { opacity: 1; }
  }
  .entrada-deslizar-abajo     { animation: entradaAbajo     0.5s cubic-bezier(.22,1,.36,1) forwards; }
  .entrada-deslizar-derecha   { animation: entradaDerecha   0.5s cubic-bezier(.22,1,.36,1) forwards; }
  .entrada-deslizar-izquierda { animation: entradaIzquierda 0.5s cubic-bezier(.22,1,.36,1) forwards; }
  .entrada-fade               { animation: entradaFade      0.5s ease forwards; }

  /* ── CAJA DE DIÁLOGO ── */
  #dialogo-box {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: 190px;
    background: rgba(5, 5, 20, 0.92);
    border-top: 2px solid rgba(80, 160, 255, 0.5);
    backdrop-filter: blur(12px);
    padding: 0 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    overflow: hidden;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  #nombre-hablante {
    display: inline-block;
    background: linear-gradient(90deg, #1a6fc4, #0d3d6e);
    color: #fff;
    font-size: 0.9rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 6px 18px;
    border-radius: 0 0 10px 10px;
    margin-bottom: 2px;
    align-self: flex-start;
    box-shadow: 0 2px 12px rgba(30,100,220,0.4);
    min-width: 100px;
    text-align: center;
  }

  #texto-dialogo {
    color: #e8eaf6;
    font-size: 1.0rem;
    line-height: 1.55;
    flex: 1;
    overflow: hidden;
    padding: 0 4px;
    position: relative;
  }

  #texto-dialogo.completo::after {
    content: '';
    display: inline-block;
    width: 8px; height: 16px;
    background: #4a9eff;
    margin-left: 4px;
    vertical-align: middle;
    animation: parpadeo 0.8s step-end infinite;
    border-radius: 2px;
  }
  @keyframes parpadeo {
    0%, 100% { opacity: 1; } 50% { opacity: 0; }
  }

  #flecha-avanzar {
    align-self: flex-end;
    color: #4a9eff;
    font-size: 1.4rem;
    opacity: 0;
    transition: opacity 0.3s;
    animation: rebote 0.8s ease-in-out infinite alternate;
    padding-right: 4px;
  }
  #flecha-avanzar.visible { opacity: 1; }
  @keyframes rebote {
    from { transform: translateX(0); }
    to   { transform: translateX(6px); }
  }

  /* ── BOTÓN OMITIR ── */
  #btn-omitir {
    position: fixed;
    top: 18px; right: 18px;
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.25);
    color: rgba(255,255,255,0.75);
    font-size: 0.8rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 8px 16px;
    border-radius: 20px;
    cursor: pointer;
    backdrop-filter: blur(8px);
    z-index: 100;
    transition: background 0.2s;
    display: none;
  }
  #btn-omitir:active { background: rgba(255,255,255,0.25); }

  /* ── FADE OUT ── */
  #fade-out {
    position: fixed;
    inset: 0;
    background: #000;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.7s ease;
    z-index: 200;
  }
  #fade-out.activo { opacity: 1; }

  /* ── LOADER ── */
  #loader {
    position: fixed;
    inset: 0;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 300;
    flex-direction: column;
    gap: 16px;
    transition: opacity 0.5s;
  }
  #loader.oculto { opacity: 0; pointer-events: none; }
  .loader-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #4a9eff;
    display: inline-block;
    animation: pulso 1.2s ease-in-out infinite;
  }
  .loader-dot:nth-child(2) { animation-delay: 0.2s; background: #7c4dff; }
  .loader-dot:nth-child(3) { animation-delay: 0.4s; background: #00bcd4; }
  @keyframes pulso {
    0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
    40% { transform: scale(1); opacity: 1; }
  }
  #loader-dots { display: flex; gap: 8px; }
</style>
</head>
<body>

<div id="loader">
  <div id="loader-dots">
    <span class="loader-dot"></span>
    <span class="loader-dot"></span>
    <span class="loader-dot"></span>
  </div>
</div>

<div id="fondo"></div>
<div id="escenario"></div>

<div id="dialogo-box">
  <div id="nombre-hablante"></div>
  <div id="texto-dialogo"></div>
  <div id="flecha-avanzar">▶</div>
</div>

<button id="btn-omitir">Omitir ✕</button>
<div id="fade-out"></div>
<audio id="musica-bg" loop></audio>

<script>
const DESTINO = 'index.html';
let config = null;
let paso = 0;
let escribiendo = false;
let textoCompleto = '';
let intervaloEscritura = null;
const VELOCIDAD_ESCRITURA = 30;

const elFondo      = document.getElementById('fondo');
const elEscenario  = document.getElementById('escenario');
const elNombre     = document.getElementById('nombre-hablante');
const elTexto      = document.getElementById('texto-dialogo');
const elFlecha     = document.getElementById('flecha-avanzar');
const elOmitir     = document.getElementById('btn-omitir');
const elFadeOut    = document.getElementById('fade-out');
const elLoader     = document.getElementById('loader');
const elMusica     = document.getElementById('musica-bg');

// ── Init ────────────────────────────────────────────────
async function init() {
  try {
    const res = await fetch('intro_config.json?v=' + Date.now());
    config = await res.json();
  } catch (e) {
    irAlMenu(); return;
  }
  const { escena } = config;
  elFondo.style.backgroundImage = `url('${escena.fondo}')`;
  if (escena.musica) {
    elMusica.src = escena.musica;
    elMusica.volume = escena.volumen ?? 0.6;
    elMusica.play().catch(() => {});
  }
  if (escena.omitible !== false) {
    elOmitir.style.display = 'block';
    elOmitir.addEventListener('click', terminarIntro);
  }
  elLoader.classList.add('oculto');
  setTimeout(() => { elLoader.style.display = 'none'; mostrarPaso(0); }, 500);
}

// ── Mostrar paso ────────────────────────────────────────
function mostrarPaso(idx) {
  if (idx >= config.secuencia.length) { terminarIntro(); return; }
  paso = idx;
  const step = config.secuencia[idx];
  actualizarPersonajes(step.personajes, step.dialogo?.hablante);
  if (step.dialogo) {
    elNombre.textContent = step.dialogo.hablante || '';
    escribirTexto(step.dialogo.texto || '');
  }
}

// ── Personajes ──────────────────────────────────────────
let personajesActuales = {};

function actualizarPersonajes(nuevos, hablante) {
  const idsNuevos = new Set(nuevos.map(p => p.id));

  // Eliminar los que ya no están
  for (const [id, el] of Object.entries(personajesActuales)) {
    if (!idsNuevos.has(id)) {
      el.style.opacity = '0';
      setTimeout(() => el.remove(), 400);
      delete personajesActuales[id];
    }
  }

  // Crear o actualizar
  nuevos.forEach(p => {
    let slot = personajesActuales[p.id];
    const esNuevo = !slot;
    if (esNuevo) {
      slot = document.createElement('div');
      slot.dataset.id = p.id;
      slot.dataset.nombre = p.nombre;
      const img = document.createElement('img');
      img.alt = p.nombre;
      slot.appendChild(img);
      elEscenario.appendChild(slot);
      personajesActuales[p.id] = slot;
    }
    // Clase y src siempre actualizados
    slot.className = `personaje-slot ${p.posicion}`;
    slot.querySelector('img').src = p.imagen;

    // Escala
    if (p.escala && p.escala !== 1.0) {
      slot.querySelector('img').style.transform = `scale(${p.escala})`;
      slot.querySelector('img').style.transformOrigin = 'bottom center';
    }

    // Animación solo al crear
    if (esNuevo) {
      const clase = entradaClase(p.entrada);
      if (clase) {
        slot.classList.add(clase);
        setTimeout(() => slot.classList.remove(clase), 600);
      }
    }
  });

  // Ordenar DOM y aplicar activo/inactivo
  // Primero los inactivos (quedan debajo), luego el hablante (queda encima)
  nuevos.forEach(p => {
    const slot = personajesActuales[p.id];
    if (!slot) return;
    const esHablante = hablante && p.nombre === hablante;
    if (!esHablante && p.posicion !== 'pantalla-completa') {
      slot.classList.add('inactivo');
      elEscenario.insertBefore(slot, elEscenario.firstChild);
    }
  });
  nuevos.forEach(p => {
    const slot = personajesActuales[p.id];
    if (!slot) return;
    const esHablante = hablante && p.nombre === hablante;
    if (esHablante || p.posicion === 'pantalla-completa') {
      slot.classList.remove('inactivo');
      elEscenario.appendChild(slot); // al final = encima
    }
  });

  // Toggle overlay oscuro del fondo
  const hayPantallaCompleta = nuevos.some(p => p.posicion === 'pantalla-completa');
  document.body.classList.toggle('modo-pantalla-completa', hayPantallaCompleta);
}

function entradaClase(tipo) {
  return {
    'deslizar-abajo':     'entrada-deslizar-abajo',
    'deslizar-derecha':   'entrada-deslizar-derecha',
    'deslizar-izquierda': 'entrada-deslizar-izquierda',
    'fade':               'entrada-fade',
  }[tipo] || null;
}

// ── Escritura ───────────────────────────────────────────
function escribirTexto(texto) {
  clearInterval(intervaloEscritura);
  elTexto.classList.remove('completo');
  elFlecha.classList.remove('visible');
  escribiendo = true;
  textoCompleto = texto;
  let i = 0;
  elTexto.textContent = '';
  intervaloEscritura = setInterval(() => {
    elTexto.textContent += texto[i++];
    if (i >= texto.length) {
      clearInterval(intervaloEscritura);
      escribiendo = false;
      elTexto.classList.add('completo');
      elFlecha.classList.add('visible');
    }
  }, VELOCIDAD_ESCRITURA);
}

// ── Avanzar ─────────────────────────────────────────────
function avanzar() {
  if (escribiendo) {
    clearInterval(intervaloEscritura);
    escribiendo = false;
    elTexto.textContent = textoCompleto;
    elTexto.classList.add('completo');
    elFlecha.classList.add('visible');
    return;
  }
  mostrarPaso(paso + 1);
}

// Tap en toda la pantalla excepto botón omitir
document.addEventListener('click', (e) => {
  if (elOmitir.contains(e.target)) return;
  avanzar();
});
document.addEventListener('touchend', (e) => {
  if (elOmitir.contains(e.target)) return;
  e.preventDefault();
  avanzar();
}, { passive: false });

// ── Terminar ────────────────────────────────────────────
function terminarIntro() {
  elFadeOut.classList.add('activo');
  const fadeMusica = setInterval(() => {
    if (elMusica.volume > 0.05) {
      elMusica.volume = Math.max(0, elMusica.volume - 0.05);
    } else {
      elMusica.pause();
      clearInterval(fadeMusica);
    }
  }, 80);
  setTimeout(() => {
    localStorage.setItem('nexo_intro_vista', '1');
    window.location.href = DESTINO;
  }, 800);
}

function irAlMenu() {
  localStorage.setItem('nexo_intro_vista', '1');
  window.location.href = DESTINO;
}

init();
</script>
</body>
</html>
