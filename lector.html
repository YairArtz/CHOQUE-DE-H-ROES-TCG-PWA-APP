<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Lector — Nexo de Héroes</title>
<link rel="icon" href="img/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
<style>
  :root{
    --bg-0:#000; --bg-1:#0a0e1a; --bg-2:#111827;
    --acc-gold:#e8c86a; --acc-red:#c53030; --acc-cyan:#4fd1c5;
    --txt-1:#f5f5f5; --txt-2:#a0aec0; --border:rgba(232,200,106,.25);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
  html,body{background:#000;color:var(--txt-1);font-family:'Rajdhani',sans-serif;height:100vh;height:100dvh;overflow:hidden;overscroll-behavior:none}

  /* HUD superior */
  .hud-top{
    position:fixed;top:0;left:0;right:0;z-index:30;
    background:linear-gradient(180deg,rgba(0,0,0,.9),rgba(0,0,0,0));
    padding:14px 16px calc(14px + env(safe-area-inset-top)) 16px;
    padding-top:calc(14px + env(safe-area-inset-top));
    display:flex;align-items:center;gap:12px;
    transition:transform .3s ease,opacity .3s ease;
  }
  .hud-top.hidden{transform:translateY(-100%);opacity:0;pointer-events:none}
  .btn-icon{
    background:rgba(20,25,40,.7);border:1px solid var(--border);color:var(--acc-gold);
    width:40px;height:40px;border-radius:50%;font-size:20px;cursor:pointer;
    display:grid;place-items:center;backdrop-filter:blur(8px);transition:.2s;
  }
  .btn-icon:hover{background:rgba(232,200,106,.15)}
  .btn-icon:active{transform:scale(.9)}
  .hud-title{flex:1;text-align:center;overflow:hidden}
  .hud-title h1{font-family:'Orbitron',sans-serif;font-size:.8rem;font-weight:700;color:var(--acc-gold);letter-spacing:2px;text-transform:uppercase;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}
  .hud-title .prog{font-family:'Orbitron',sans-serif;font-size:.65rem;color:var(--txt-2);letter-spacing:2px;margin-top:2px}

  /* Zona del libro */
  #stage{
    position:absolute;inset:0;
    display:grid;place-items:center;
    background:radial-gradient(ellipse at center,rgba(20,25,40,.5),#000 70%);
    touch-action:pan-y pinch-zoom;
  }
  #book-wrap{
    position:relative;
    max-width:100vw;max-height:100vh;
    filter:drop-shadow(0 20px 40px rgba(0,0,0,.8));
    transform-origin:center center;
    will-change:transform;
  }
  #book-wrap.animar{transition:transform .3s cubic-bezier(.22,1,.36,1)}
  body.zoomed .tap-zone{pointer-events:none}
  body.zoomed #stage{cursor:grab}
  body.zoomed #stage:active{cursor:grabbing}

  /* Badge de zoom (HUD superior) */
  .zoom-badge{
    position:fixed;top:calc(64px + env(safe-area-inset-top));right:16px;z-index:31;
    background:rgba(20,25,40,.85);border:1px solid var(--acc-gold);color:var(--acc-gold);
    padding:6px 12px;border-radius:20px;
    font-family:'Orbitron',sans-serif;font-size:.7rem;letter-spacing:2px;font-weight:700;
    display:none;align-items:center;gap:8px;
    backdrop-filter:blur(8px);
    animation:fadeIn .2s ease;
    cursor:pointer;
  }
  .zoom-badge.show{display:inline-flex}
  .zoom-badge span{font-size:.9rem}
  #book{margin:0 auto}
  .page{
    background:#111;
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
    box-shadow:inset 0 0 20px rgba(0,0,0,.5);
  }
  .page canvas,.page img{max-width:100%;max-height:100%;display:block}
  .page-empty{color:var(--txt-2);font-family:'Orbitron',sans-serif;font-style:italic;opacity:.4;font-size:.9rem;text-align:center;padding:20px}
  .stf__parent{margin:0 auto}

  /* Splash de carga */
  #splash{
    position:fixed;inset:0;z-index:50;background:#000;
    display:grid;place-items:center;
    transition:opacity .5s ease;
  }
  #splash.gone{opacity:0;pointer-events:none}
  .splash-inner{text-align:center;padding:20px}
  .splash-logo{font-family:'Orbitron',sans-serif;font-size:1.8rem;font-weight:900;color:var(--acc-gold);letter-spacing:8px;text-shadow:0 0 30px rgba(232,200,106,.5);margin-bottom:24px;animation:pulse 2s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
  .splash-bar{width:min(280px,70vw);height:3px;background:rgba(232,200,106,.15);border-radius:2px;overflow:hidden;margin:0 auto}
  .splash-fill{height:100%;background:linear-gradient(90deg,var(--acc-gold),var(--acc-red));width:0%;transition:width .3s ease;box-shadow:0 0 10px var(--acc-gold)}
  .splash-msg{font-family:'Orbitron',sans-serif;font-size:.7rem;letter-spacing:3px;color:var(--txt-2);margin-top:16px}
  .splash-err{color:var(--acc-red);font-family:'Rajdhani',sans-serif;margin-top:20px;font-size:.95rem;max-width:80vw}

  /* HUD inferior */
  .hud-bottom{
    position:fixed;bottom:0;left:0;right:0;z-index:30;
    background:linear-gradient(0deg,rgba(0,0,0,.9),rgba(0,0,0,0));
    padding:20px 16px calc(16px + env(safe-area-inset-bottom)) 16px;
    display:flex;align-items:center;gap:12px;
    transition:transform .3s ease,opacity .3s ease;
  }
  .hud-bottom.hidden{transform:translateY(100%);opacity:0;pointer-events:none}
  .nav-btn{
    background:rgba(20,25,40,.7);border:1px solid var(--border);color:var(--acc-gold);
    width:44px;height:44px;border-radius:50%;font-size:22px;cursor:pointer;
    display:grid;place-items:center;backdrop-filter:blur(8px);flex-shrink:0;
  }
  .nav-btn:disabled{opacity:.3;cursor:not-allowed}
  .nav-btn:active:not(:disabled){transform:scale(.9)}
  .thumbs{
    flex:1;display:flex;gap:6px;overflow-x:auto;padding:4px 2px;
    scrollbar-width:none;
  }
  .thumbs::-webkit-scrollbar{display:none}
  .thumb{
    flex-shrink:0;width:34px;height:48px;
    background:#1a1f30;border:1px solid rgba(232,200,106,.15);
    border-radius:3px;cursor:pointer;
    display:grid;place-items:center;
    font-family:'Orbitron',sans-serif;font-size:.6rem;color:var(--txt-2);
    transition:.2s;overflow:hidden;position:relative;
  }
  .thumb.active{border-color:var(--acc-gold);box-shadow:0 0 8px rgba(232,200,106,.4)}
  .thumb img{width:100%;height:100%;object-fit:cover}
  .thumb .num{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.7);font-size:.55rem;padding:1px}

  /* Créditos finales */
  #creditos{
    position:fixed;inset:0;z-index:40;background:linear-gradient(180deg,#000,#0a0e1a 40%,#000);
    overflow-y:auto;padding:calc(60px + env(safe-area-inset-top)) 20px calc(40px + env(safe-area-inset-bottom));
    display:none;
  }
  #creditos.show{display:block;animation:fadeIn .6s ease}
  @keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
  .cred-close{
    position:fixed;top:calc(14px + env(safe-area-inset-top));right:16px;z-index:41;
  }
  .cred-inner{max-width:520px;margin:0 auto;text-align:center}
  .cred-fin{font-family:'Orbitron',sans-serif;font-size:2.2rem;font-weight:900;color:var(--acc-gold);letter-spacing:12px;margin-bottom:8px;text-shadow:0 0 20px rgba(232,200,106,.4)}
  .cred-sub{font-family:'Orbitron',sans-serif;font-size:.75rem;color:var(--txt-2);letter-spacing:4px;margin-bottom:40px;padding:0 8px}

  /* Bloque de crédito individual */
  .cred-persona{
    margin-bottom:32px;padding-bottom:32px;
    border-bottom:1px solid rgba(232,200,106,.12);
    animation:fadeIn .6s ease;
  }
  .cred-persona:last-of-type{border-bottom:none}
  .cred-avatar{
    width:110px;height:110px;border-radius:50%;
    margin:0 auto 16px;overflow:hidden;
    border:2px solid var(--acc-gold);
    box-shadow:0 0 30px rgba(232,200,106,.4);
    background:var(--bg-2);display:grid;place-items:center;color:var(--acc-gold);font-family:'Orbitron',sans-serif;font-size:2.5rem;
  }
  .cred-avatar img{width:100%;height:100%;object-fit:cover}
  .cred-rol{font-family:'Orbitron',sans-serif;font-size:.7rem;color:var(--acc-red);letter-spacing:4px;margin-bottom:8px;text-transform:uppercase;font-weight:700}
  .cred-nombre{font-family:'Orbitron',sans-serif;font-size:1.1rem;font-weight:900;color:var(--acc-gold);letter-spacing:2px;text-transform:uppercase;margin-bottom:12px}
  .cred-bio{color:var(--txt-1);line-height:1.5;font-size:.9rem;margin-bottom:16px;padding:0 8px;opacity:.9}
  .cred-redes{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
  .cred-red{
    background:rgba(20,25,40,.7);border:1px solid var(--border);color:var(--acc-gold);
    padding:8px 14px;border-radius:24px;
    font-family:'Orbitron',sans-serif;font-size:.65rem;letter-spacing:2px;
    text-decoration:none;transition:.2s;display:inline-flex;align-items:center;gap:6px;
  }
  .cred-red:hover{background:rgba(232,200,106,.15);transform:translateY(-2px)}
  .cred-acciones{display:flex;flex-direction:column;gap:12px;margin-top:24px}
  .cred-btn{
    background:linear-gradient(135deg,var(--acc-red),#8b1e1e);color:#fff;
    border:none;padding:14px 24px;font-family:'Orbitron',sans-serif;
    font-size:.8rem;letter-spacing:2px;font-weight:700;border-radius:4px;
    cursor:pointer;transition:.2s;text-decoration:none;text-align:center;display:block;
  }
  .cred-btn.gold{background:linear-gradient(135deg,var(--acc-gold),#c9a94d);color:#0a0e1a}
  .cred-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.4)}

  /* Zonas de tap */
  .tap-zone{position:absolute;top:0;bottom:0;width:20%;z-index:5;cursor:pointer}
  .tap-zone.left{left:0}
  .tap-zone.right{right:0}
</style>
</head>
<body>

<div id="splash">
  <div class="splash-inner">
    <div class="splash-logo">NEXO</div>
    <div class="splash-bar"><div id="splash-fill" class="splash-fill"></div></div>
    <div id="splash-msg" class="splash-msg">Abriendo el códice…</div>
    <div id="splash-err" class="splash-err" style="display:none"></div>
  </div>
</div>

<div id="hud-top" class="hud-top hidden">
  <button class="btn-icon" onclick="salir()" aria-label="Cerrar">✕</button>
  <div class="hud-title">
    <h1 id="titulo">—</h1>
    <div class="prog" id="prog">— / —</div>
  </div>
  <button class="btn-icon" onclick="toggleFullscreen()" aria-label="Pantalla completa">⛶</button>
</div>

<div id="stage">
  <div class="tap-zone left" id="tap-left"></div>
  <div class="tap-zone right" id="tap-right"></div>
  <div id="book-wrap"><div id="book"></div></div>
</div>

<button id="zoom-badge" class="zoom-badge" onclick="resetZoom()" title="Restablecer zoom">
  <span>🔍</span><span id="zoom-nivel">1.0×</span> ✕
</button>

<div id="hud-bottom" class="hud-bottom hidden">
  <button class="nav-btn" id="btn-prev" aria-label="Anterior">‹</button>
  <div class="thumbs" id="thumbs"></div>
  <button class="nav-btn" id="btn-next" aria-label="Siguiente">›</button>
</div>

<div id="creditos">
  <button class="btn-icon cred-close" onclick="cerrarCreditos()" aria-label="Cerrar">✕</button>
  <div class="cred-inner">
    <div class="cred-fin">FIN</div>
    <div class="cred-sub" id="cred-titulo">— · — —</div>
    <div id="cred-personas"></div>
    <div class="cred-acciones">
      <button class="cred-btn gold" onclick="reiniciar()">↺ LEER DE NUEVO</button>
      <a class="cred-btn" href="comics.html">← Volver a la Comicteca</a>
    </div>
  </div>
</div>

<script>
// ========== Config PDF.js ==========
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

// ========== Estado ==========
const params=new URLSearchParams(location.search);
const comicId=params.get('id');
let comic=null;
let pdf=null;
let flipBook=null;
let paginaActual=0;
let totalPaginas=0;
const cache=new Map();       // num -> url de baja resolución (para navegación rápida)
const cacheHD=new Map();     // num -> url de alta resolución (para zoom)
const hdEnCurso=new Set();   // páginas que se están renderizando en HD
const HD_MAX_CACHE=6;        // número máximo de páginas en HD (LRU)
const ZOOM_UMBRAL_HD=1.3;    // a partir de este zoom, cargamos HD
let hudTimer=null;
let hudVisible=true;

// ========== Utilidades ==========
const $=id=>document.getElementById(id);
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function setSplashProgress(pct,msg){$('splash-fill').style.width=pct+'%';if(msg)$('splash-msg').textContent=msg}
function splashError(msg){
  $('splash-err').style.display='block';
  $('splash-err').innerHTML=escapeHtml(msg)+'<br><br><a href="comics.html" style="color:var(--acc-gold)">← Volver a la Comicteca</a>';
  $('splash-msg').style.display='none';
}
function salir(){location.href='comics.html'}
function toggleFullscreen(){
  if(!document.fullscreenElement){
    document.documentElement.requestFullscreen?.().catch(()=>{});
  }else{document.exitFullscreen?.()}
}

// ========== HUD auto-hide ==========
function mostrarHUD(){
  hudVisible=true;
  $('hud-top').classList.remove('hidden');
  $('hud-bottom').classList.remove('hidden');
  clearTimeout(hudTimer);
  hudTimer=setTimeout(ocultarHUD,3500);
}
function ocultarHUD(){
  hudVisible=false;
  $('hud-top').classList.add('hidden');
  $('hud-bottom').classList.add('hidden');
}
function toggleHUD(){hudVisible?ocultarHUD():mostrarHUD()}

// ========== Dimensiones del libro ==========
function calcularTam(){
  const vw=window.innerWidth, vh=window.innerHeight;
  const landscape=vw>vh && vw>=768;
  const ratio=2/3;
  let w,h;
  if(landscape){
    h=Math.min(vh-40,900);
    w=Math.round(h*ratio*2);
    if(w>vw-40){w=vw-40;h=Math.round(w/2/ratio)}
    return{w,h,landscape:true,single:false}
  }else{
    h=Math.min(vh-40,vh*.92);
    w=Math.round(h*ratio);
    if(w>vw-20){w=vw-20;h=Math.round(w/ratio)}
    return{w,h,landscape:false,single:true}
  }
}

// ========== Render de página PDF ==========
async function renderPagina(num){
  if(cache.has(num))return cache.get(num);
  const page=await pdf.getPage(num);
  const {w,h,single}=calcularTam();
  const pageW=single?w:w/2;
  const viewport=page.getViewport({scale:1});
  // En PDFs largos limitamos el DPR para no consumir tanta RAM en móvil.
  const dprBase=window.devicePixelRatio||1;
  const dpr=totalPaginas>30?Math.min(1.5,dprBase):dprBase;
  const scale=Math.min(pageW/viewport.width,h/viewport.height)*dpr;
  const scaled=page.getViewport({scale});
  const canvas=document.createElement('canvas');
  canvas.width=scaled.width;canvas.height=scaled.height;
  canvas.style.width='100%';canvas.style.height='auto';
  const ctx=canvas.getContext('2d');
  await page.render({canvasContext:ctx,viewport:scaled}).promise;
  // Blob URL en vez de Data URL: ~33% menos memoria, mejor GC.
  const blob=await new Promise(res=>canvas.toBlob(res,'image/jpeg',0.85));
  const url=blob?URL.createObjectURL(blob):canvas.toDataURL('image/jpeg',0.85);
  // Liberar el canvas y la página del PDF cuanto antes.
  canvas.width=0;canvas.height=0;
  try{page.cleanup()}catch(_){}
  cache.set(num,url);
  return url;
}

// Render HD: escala mucho mayor, para que al hacer zoom no se vea borroso.
// Se hace sólo bajo demanda para las páginas que el usuario está viendo con zoom.
async function renderPaginaHD(num){
  if(cacheHD.has(num))return cacheHD.get(num);
  const page=await pdf.getPage(num);
  const {w,h,single}=calcularTam();
  const pageW=single?w:w/2;
  const viewport=page.getViewport({scale:1});
  // Renderizamos a la escala que necesitaría el zoom máximo * dpr.
  // Con esto, al hacer pinch a 4× la página sigue siendo nítida.
  const dpr=window.devicePixelRatio||1;
  const baseScale=Math.min(pageW/viewport.width,h/viewport.height);
  const scale=baseScale*dpr*ZOOM_MAX;
  const scaled=page.getViewport({scale});
  // Salvaguarda de tamaño: algunos móviles fallan con canvas > 16k px.
  const maxDim=Math.max(scaled.width,scaled.height);
  let finalScale=scale;
  if(maxDim>8192){
    finalScale=scale*(8192/maxDim);
  }
  const finalVP=finalScale===scale?scaled:page.getViewport({scale:finalScale});
  const canvas=document.createElement('canvas');
  canvas.width=finalVP.width;canvas.height=finalVP.height;
  const ctx=canvas.getContext('2d');
  await page.render({canvasContext:ctx,viewport:finalVP}).promise;
  const blob=await new Promise(res=>canvas.toBlob(res,'image/jpeg',0.92));
  const url=blob?URL.createObjectURL(blob):canvas.toDataURL('image/jpeg',0.92);
  canvas.width=0;canvas.height=0;
  try{page.cleanup()}catch(_){}

  // LRU: si superamos el máximo, expulsamos la más vieja y liberamos su URL.
  if(cacheHD.size>=HD_MAX_CACHE){
    const primera=cacheHD.keys().next().value;
    const urlVieja=cacheHD.get(primera);
    cacheHD.delete(primera);
    if(urlVieja&&urlVieja.startsWith('blob:'))URL.revokeObjectURL(urlVieja);
  }
  cacheHD.set(num,url);
  return url;
}

// Índices (1-based) de las páginas actualmente visibles en el libro.
function paginasVisibles(){
  const {single}=calcularTam();
  const actual=paginaActual+1;
  if(single) return [actual].filter(n=>n>=1&&n<=totalPaginas);
  // En doble página, el spread es (paginaActual, paginaActual+1).
  return [actual,actual+1].filter(n=>n>=1&&n<=totalPaginas);
}

// Aplica el src HD al <img> correspondiente dentro del libro renderizado.
function aplicarHD(num,url){
  document.querySelectorAll('#book .page[data-pagina="'+num+'"] img').forEach(img=>{
    if(img.src!==url){
      // Precarga silenciosa para que el swap no muestre parpadeo.
      const tmp=new Image();
      tmp.onload=()=>{img.src=url};
      tmp.src=url;
    }
  });
}

// Solicita HD de una lista de páginas, con dedupe.
function pedirHD(nums){
  nums.forEach(num=>{
    if(cacheHD.has(num)){
      aplicarHD(num,cacheHD.get(num));
      return;
    }
    if(hdEnCurso.has(num))return;
    hdEnCurso.add(num);
    renderPaginaHD(num).then(url=>{
      aplicarHD(num,url);
    }).catch(e=>{
      console.warn('Render HD falló para página',num,e);
    }).finally(()=>{
      hdEnCurso.delete(num);
    });
  });
}

// ========== Inicialización ==========
async function init(){
  if(!comicId){splashError('No se indicó qué cómic leer.');return}

  setSplashProgress(5,'Consultando catálogo…');
  let config;
  try{
    const r=await fetch('comics_config.json?v='+Date.now());
    if(!r.ok)throw new Error('HTTP '+r.status);
    config=await r.json();
  }catch(e){splashError('No pude cargar el catálogo.\n'+e.message);return}

  comic=(config.comics||[]).find(c=>c.id===comicId);
  if(!comic){splashError('Cómic no encontrado: '+comicId);return}

  $('titulo').textContent=comic.titulo;
  document.title=comic.titulo+' — Nexo de Héroes';

  setSplashProgress(10,'Descargando PDF…');

  // Intento 1: modo normal (streaming). Rápido para PDFs bien formados.
  // Intento 2: modo robusto (descarga completa antes de parsear). Rescata PDFs
  // con estructuras raras: xref dañado, streams no estándar, exportaciones
  // atípicas de InDesign/Photoshop, etc.
  async function intentarAbrirPDF(opcionesExtra){
    const loadingTask=pdfjsLib.getDocument({
      url:comic.pdf,
      cMapUrl:'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/cmaps/',
      cMapPacked:true,
      isEvalSupported:false,
      ...opcionesExtra
    });
    loadingTask.onProgress=data=>{
      if(data.total){
        const pct=10+Math.round((data.loaded/data.total)*15);
        setSplashProgress(Math.min(pct,25),'Descargando PDF…');
      }
    };
    return await loadingTask.promise;
  }

  try{
    pdf=await intentarAbrirPDF({});
  }catch(e1){
    console.warn('Intento 1 falló, reintentando en modo robusto',e1);
    setSplashProgress(15,'Reintentando en modo robusto…');
    try{
      pdf=await intentarAbrirPDF({
        disableAutoFetch:true,
        disableStream:true,
        disableRange:true
      });
    }catch(e2){
      const detalle=(e2&&e2.message)||String(e2);
      $('splash-err').style.display='block';
      $('splash-err').innerHTML=
        '<strong>No pude abrir este PDF.</strong><br>'+
        '<span style="font-size:.85em;opacity:.75">'+escapeHtml(detalle)+'</span><br><br>'+
        'Suele deberse a un PDF exportado con estructura no estándar. '+
        'Prueba re-exportarlo desde el original (por ejemplo, "Guardar como PDF/A" o '+
        '"Reducir tamaño de archivo" en Acrobat) o linealízalo con Ghostscript / <em>qpdf --linearize</em>.<br><br>'+
        '<a href="'+encodeURI(comic.pdf)+'" target="_blank" rel="noopener" style="color:var(--acc-gold);text-decoration:underline">Descargar el PDF directamente</a><br><br>'+
        '<a href="comics.html" style="color:var(--acc-gold)">← Volver a la Comicteca</a>';
      $('splash-msg').style.display='none';
      return;
    }
  }

  totalPaginas=pdf.numPages;
  $('prog').textContent='1 / '+totalPaginas;

  // ===== FIX del bug de página 4 =====
  // StPageFlip toma un snapshot del HTML al llamar loadFromHTML().
  // Si sólo pre-cargábamos 4 páginas, las páginas 5+ quedaban como divs vacíos
  // dentro del libro rendereado, y las imágenes cargadas después no se
  // reflejaban visualmente. La solución: renderizar TODAS las páginas antes
  // de construir el libro.
  setSplashProgress(25,'Preparando páginas…');
  for(let i=1;i<=totalPaginas;i++){
    try{
      await renderPagina(i);
    }catch(e){
      console.warn('Error renderizando página',i,e);
    }
    const pct=25+Math.round((i/totalPaginas)*65);
    setSplashProgress(pct,'Preparando página '+i+' / '+totalPaginas);
  }

  setSplashProgress(95,'Encuadernando…');
  construirLibro();
  construirMiniaturas();

  setSplashProgress(100,'Listo');
  setTimeout(()=>{
    $('splash').classList.add('gone');
    setTimeout(()=>$('splash').style.display='none',500);
    mostrarHUD();
  },300);
}

// ========== StPageFlip ==========
function construirLibro(){
  const {w,h,single}=calcularTam();
  const bookEl=$('book');
  bookEl.innerHTML='';

  // Todas las páginas ya están renderizadas en cache; las inyectamos con img.
  for(let i=1;i<=totalPaginas;i++){
    const div=document.createElement('div');
    div.className='page';
    div.dataset.pagina=i;
    const src=cache.get(i);
    if(src){
      const img=document.createElement('img');
      img.src=src;img.alt='Página '+i;
      div.appendChild(img);
    }else{
      div.innerHTML='<div class="page-empty">Página '+i+'</div>';
    }
    bookEl.appendChild(div);
  }

  flipBook=new St.PageFlip(bookEl,{
    width:single?w:w/2,
    height:h,
    size:'fixed',
    minWidth:200,maxWidth:1200,
    minHeight:300,maxHeight:1800,
    maxShadowOpacity:.5,
    showCover:true,
    mobileScrollSupport:false,
    usePortrait:single,
    drawShadow:true,
    flippingTime:600,
    swipeDistance:30
  });

  flipBook.loadFromHTML(bookEl.querySelectorAll('.page'));

  flipBook.on('flip',e=>{
    paginaActual=e.data;
    $('prog').textContent=(paginaActual+1)+' / '+totalPaginas;
    actualizarMiniaturas();
    actualizarBotones();
    // Resetear zoom al cambiar de página
    if(zoomScale>1.01) resetZoom();
    // Precarga HD de la página actual si acabamos de resetear con zoom > umbral
    // (no aplica aquí porque acabamos de resetear, pero por si en el futuro se
    // cambia el comportamiento, dejamos el hook.)
    if(paginaActual>=totalPaginas-1){
      setTimeout(mostrarCreditos,1200);
    }
  });

  $('btn-prev').onclick=()=>flipBook.flipPrev();
  $('btn-next').onclick=()=>flipBook.flipNext();
  actualizarBotones();
}

function actualizarBotones(){
  $('btn-prev').disabled=paginaActual<=0;
  $('btn-next').disabled=paginaActual>=totalPaginas-1;
}

// ========== Miniaturas ==========
function construirMiniaturas(){
  const cont=$('thumbs');
  cont.innerHTML='';
  for(let i=1;i<=totalPaginas;i++){
    const t=document.createElement('div');
    t.className='thumb';
    t.dataset.pagina=i;
    const src=cache.get(i);
    if(src){
      const img=document.createElement('img');img.src=src;t.appendChild(img);
    }
    const num=document.createElement('div');num.className='num';num.textContent=i;
    t.appendChild(num);
    t.onclick=()=>{
      flipBook?.turnToPage(i-1);
      mostrarHUD();
    };
    cont.appendChild(t);
  }
  actualizarMiniaturas();
}
function actualizarMiniaturas(){
  $('thumbs').querySelectorAll('.thumb').forEach((t,i)=>{
    t.classList.toggle('active',i===paginaActual);
    if(i===paginaActual)t.scrollIntoView({inline:'center',behavior:'smooth',block:'nearest'});
  });
}

// ========== Créditos (múltiples personas) ==========
function obtenerCreditos(){
  // Prioridad: creditos[] (nuevo formato) > autor (retrocompat)
  if(Array.isArray(comic.creditos) && comic.creditos.length){
    return comic.creditos;
  }
  if(comic.autor){
    return [{
      rol: 'Guión y Arte',
      nombre: comic.autor.nombre,
      foto: comic.autor.foto,
      bio: comic.autor.bio,
      redes: comic.autor.redes || {}
    }];
  }
  return [];
}

function mostrarCreditos(){
  const creditos=obtenerCreditos();
  if(!creditos.length){$('creditos').classList.add('show');return}

  $('cred-titulo').textContent=(comic.titulo||'').toUpperCase()+(comic.subtitulo?' · '+comic.subtitulo.toUpperCase():'');

  const cont=$('cred-personas');
  cont.innerHTML='';
  const iconos={facebook:'ⓕ',instagram:'ⓘ',twitter:'𝕏',x:'𝕏',web:'⚭',tienda:'🛒',youtube:'▶',tiktok:'♪'};

  creditos.forEach((p,idx)=>{
    const bloque=document.createElement('div');
    bloque.className='cred-persona';
    bloque.style.animationDelay=(idx*.15)+'s';

    // Avatar
    const av=document.createElement('div');
    av.className='cred-avatar';
    if(p.foto){
      const img=document.createElement('img');
      img.src=p.foto;
      img.onerror=()=>{av.innerHTML=(p.nombre||'?').charAt(0)};
      av.appendChild(img);
    }else{
      av.textContent=(p.nombre||'?').charAt(0);
    }
    bloque.appendChild(av);

    // Rol
    const rol=document.createElement('div');
    rol.className='cred-rol';
    rol.textContent=p.rol||'CRÉDITO';
    bloque.appendChild(rol);

    // Nombre
    const nom=document.createElement('div');
    nom.className='cred-nombre';
    nom.textContent=p.nombre||'—';
    bloque.appendChild(nom);

    // Bio
    if(p.bio){
      const bio=document.createElement('div');
      bio.className='cred-bio';
      bio.textContent=p.bio;
      bloque.appendChild(bio);
    }

    // Redes
    if(p.redes){
      const redes=document.createElement('div');
      redes.className='cred-redes';
      let count=0;
      Object.entries(p.redes).forEach(([k,v])=>{
        if(!v)return;
        count++;
        const link=document.createElement('a');
        link.className='cred-red';link.href=v;link.target='_blank';link.rel='noopener';
        link.innerHTML='<span>'+(iconos[k]||'●')+'</span>'+k.toUpperCase();
        redes.appendChild(link);
      });
      if(count>0)bloque.appendChild(redes);
    }

    cont.appendChild(bloque);
  });

  $('creditos').classList.add('show');
  // Registrar lectura completada
  try{
    const leidos=JSON.parse(localStorage.getItem('comics_leidos')||'[]');
    if(!leidos.includes(comic.id)){
      leidos.push(comic.id);
      localStorage.setItem('comics_leidos',JSON.stringify(leidos));
    }
  }catch(e){}
}
function cerrarCreditos(){$('creditos').classList.remove('show')}
function reiniciar(){
  cerrarCreditos();
  flipBook?.turnToPage(0);
}

// ========== Zoom táctil (pinch + pan + doble-tap) ==========
let zoomScale=1, zoomX=0, zoomY=0;
let pinchInicio=null;   // {dist, scaleInicial, xInicial, yInicial}
let panInicio=null;     // {x, y, tx, ty, moved}
let ultimoTap=0;        // timestamp del último tap simple (para detectar doble-tap)
let ultimoTapX=0, ultimoTapY=0;
const ZOOM_MIN=1, ZOOM_MAX=4, ZOOM_DOBLE_TAP=2.4;

const bookWrap=$('book-wrap');
const zoomBadge=$('zoom-badge');

function aplicarZoom(animar){
  if(animar) bookWrap.classList.add('animar');
  else bookWrap.classList.remove('animar');
  bookWrap.style.transform=`translate3d(${zoomX}px, ${zoomY}px, 0) scale(${zoomScale})`;
  const zoomed=zoomScale>1.05;
  document.body.classList.toggle('zoomed',zoomed);
  zoomBadge.classList.toggle('show',zoomed);
  $('zoom-nivel').textContent=zoomScale.toFixed(1)+'×';
  if(animar) setTimeout(()=>bookWrap.classList.remove('animar'),320);
  // Si el zoom supera el umbral, cargar la versión HD de las páginas visibles.
  if(zoomScale>=ZOOM_UMBRAL_HD){
    pedirHD(paginasVisibles());
  }
}

function resetZoom(){
  zoomScale=1; zoomX=0; zoomY=0;
  aplicarZoom(true);
}

// Clamp del pan para que la página no se salga demasiado
function ajustarPan(){
  if(zoomScale<=1){zoomX=0;zoomY=0;return}
  const rect=bookWrap.getBoundingClientRect();
  const maxX=Math.max(0,(rect.width-window.innerWidth)/2 + 60);
  const maxY=Math.max(0,(rect.height-window.innerHeight)/2 + 60);
  zoomX=Math.max(-maxX,Math.min(maxX,zoomX));
  zoomY=Math.max(-maxY,Math.min(maxY,zoomY));
}

function dist(t1,t2){return Math.hypot(t2.clientX-t1.clientX,t2.clientY-t1.clientY)}

// --- Handlers en FASE DE CAPTURA para interceptar antes que StPageFlip ---
// StPageFlip registra sus listeners en el elemento del libro; al capturar aquí
// arriba, podemos bloquear el evento con stopImmediatePropagation() y evitar
// que interprete el swipe como cambio de página cuando estamos manipulando zoom.
function esGestoZoom(e){
  return e.touches.length>=2 || (zoomScale>1.05);
}

$('stage').addEventListener('touchstart',e=>{
  if(e.touches.length===2){
    // Iniciar pinch: bloqueamos StPageFlip
    e.preventDefault();
    e.stopImmediatePropagation();
    pinchInicio={
      dist:dist(e.touches[0],e.touches[1]),
      scaleInicial:zoomScale,
      xInicial:zoomX,
      yInicial:zoomY
    };
    panInicio=null;
    // Si StPageFlip ya empezó a interpretar un swipe con el primer dedo,
    // le enviamos un touchcancel para que aborte.
    try{
      const cancel=new TouchEvent('touchcancel',{bubbles:true,cancelable:true,touches:e.touches});
      $('book').dispatchEvent(cancel);
    }catch(_){/* algunos navegadores no permiten construir TouchEvent */}
  }else if(e.touches.length===1 && zoomScale>1.05){
    // Pan: también bloqueamos StPageFlip
    e.preventDefault();
    e.stopImmediatePropagation();
    const t=e.touches[0];
    panInicio={x:t.clientX,y:t.clientY,tx:zoomX,ty:zoomY,moved:false};
  }
},{passive:false,capture:true});

$('stage').addEventListener('touchmove',e=>{
  if(pinchInicio && e.touches.length===2){
    e.preventDefault();
    e.stopImmediatePropagation();
    const d=dist(e.touches[0],e.touches[1]);
    const factor=d/pinchInicio.dist;
    zoomScale=Math.max(ZOOM_MIN,Math.min(ZOOM_MAX,pinchInicio.scaleInicial*factor));
    const rel=zoomScale/pinchInicio.scaleInicial;
    zoomX=pinchInicio.xInicial*rel;
    zoomY=pinchInicio.yInicial*rel;
    ajustarPan();
    aplicarZoom(false);
  }else if(panInicio && e.touches.length===1 && zoomScale>1.05){
    e.preventDefault();
    e.stopImmediatePropagation();
    const t=e.touches[0];
    zoomX=panInicio.tx+(t.clientX-panInicio.x);
    zoomY=panInicio.ty+(t.clientY-panInicio.y);
    if(Math.abs(t.clientX-panInicio.x)>4||Math.abs(t.clientY-panInicio.y)>4){
      panInicio.moved=true;
    }
    ajustarPan();
    aplicarZoom(false);
  }else if(zoomScale>1.05 && e.touches.length===1){
    // Estamos zoomeados: bloquear siempre para que StPageFlip no lea el swipe
    e.preventDefault();
    e.stopImmediatePropagation();
  }else if(e.touches.length===1){
    // Sin zoom: prevenir scroll de rebote (pero dejar pasar a StPageFlip)
    if(!e.target.closest('#creditos')&&!e.target.closest('.thumbs')){
      e.preventDefault();
    }
  }
},{passive:false,capture:true});

$('stage').addEventListener('touchend',e=>{
  const wasPinch=!!pinchInicio;
  const wasPan=!!panInicio;
  if(e.touches.length<2) pinchInicio=null;
  if(e.touches.length===0) panInicio=null;

  // Si veníamos de un gesto de zoom, bloqueamos también el touchend
  // para que StPageFlip no lo interprete como fin de swipe.
  if(wasPinch||wasPan||zoomScale>1.05){
    e.stopImmediatePropagation();
  }

  if(e.touches.length===0){
    // Snap back si quedó ligeramente por encima de 1
    if(zoomScale<1.05 && zoomScale!==1){
      resetZoom();
    }
  }
},{capture:true});

// --- Doble tap para zoom rápido (in/out) ---
// Se registra sin capture porque no queremos interferir con taps normales.
$('stage').addEventListener('touchend',e=>{
  if(e.changedTouches.length!==1||e.touches.length!==0)return;
  // Si venimos de un pan real (con movimiento), no contar como tap
  if(panInicio && panInicio.moved){return}
  const t=e.changedTouches[0];
  const ahora=Date.now();
  const dx=Math.abs(t.clientX-ultimoTapX), dy=Math.abs(t.clientY-ultimoTapY);
  if(ahora-ultimoTap<320 && dx<40 && dy<40){
    e.preventDefault();
    if(zoomScale>1.05){
      resetZoom();
    }else{
      const rect=bookWrap.getBoundingClientRect();
      const cx=rect.left+rect.width/2;
      const cy=rect.top+rect.height/2;
      zoomScale=ZOOM_DOBLE_TAP;
      zoomX=(cx-t.clientX)*(zoomScale-1)/zoomScale;
      zoomY=(cy-t.clientY)*(zoomScale-1)/zoomScale;
      ajustarPan();
      aplicarZoom(true);
    }
    ultimoTap=0;
  }else{
    ultimoTap=ahora;
    ultimoTapX=t.clientX;
    ultimoTapY=t.clientY;
  }
});

// --- Wheel + Ctrl para desktop ---
$('stage').addEventListener('wheel',e=>{
  if(!e.ctrlKey && !e.metaKey)return;
  e.preventDefault();
  const factor=e.deltaY<0?1.15:1/1.15;
  const nuevoScale=Math.max(ZOOM_MIN,Math.min(ZOOM_MAX,zoomScale*factor));
  if(nuevoScale===zoomScale)return;
  const rect=bookWrap.getBoundingClientRect();
  const cx=rect.left+rect.width/2, cy=rect.top+rect.height/2;
  const rel=nuevoScale/zoomScale;
  zoomX=(zoomX+(cx-e.clientX))*rel-(cx-e.clientX);
  zoomY=(zoomY+(cy-e.clientY))*rel-(cy-e.clientY);
  zoomScale=nuevoScale;
  if(zoomScale<=1){zoomX=0;zoomY=0}
  ajustarPan();
  aplicarZoom(false);
},{passive:false});

// ========== Interacción de navegación ==========
$('stage').addEventListener('click',e=>{
  if(zoomScale>1.05)return;
  if(e.target.classList.contains('tap-zone'))return;
  toggleHUD();
});
$('tap-left').addEventListener('click',e=>{
  if(zoomScale>1.05)return;
  e.stopPropagation();flipBook?.flipPrev();mostrarHUD();
});
$('tap-right').addEventListener('click',e=>{
  if(zoomScale>1.05)return;
  e.stopPropagation();flipBook?.flipNext();mostrarHUD();
});

// Teclado
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft'){if(zoomScale<=1.05)flipBook?.flipPrev()}
  else if(e.key==='ArrowRight'||e.key===' '){if(zoomScale<=1.05)flipBook?.flipNext()}
  else if(e.key==='Escape'){zoomScale>1.05?resetZoom():salir()}
  else if(e.key==='f'||e.key==='F')toggleFullscreen();
  else if(e.key==='+'||e.key==='='){
    zoomScale=Math.min(ZOOM_MAX,zoomScale*1.25);aplicarZoom(true);
  }else if(e.key==='-'||e.key==='_'){
    zoomScale=Math.max(ZOOM_MIN,zoomScale/1.25);
    if(zoomScale<=1){zoomX=0;zoomY=0}
    aplicarZoom(true);
  }else if(e.key==='0'){resetZoom()}
  mostrarHUD();
});

// Reajuste en rotación / resize
let resizeT;
window.addEventListener('resize',()=>{
  clearTimeout(resizeT);
  resizeT=setTimeout(()=>{
    if(!flipBook||!totalPaginas)return;
    resetZoom();
    const {w,h,single}=calcularTam();
    try{
      flipBook.update({
        width:single?w:w/2,
        height:h,
        usePortrait:single
      });
    }catch(e){/* algunas versiones no exponen update */}
  },200);
});

// Go
init();
</script>
