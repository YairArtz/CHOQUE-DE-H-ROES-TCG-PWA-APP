<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
<script src="config.js"></script><script src="nucleo.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mapa de Tiendas Oficiales — Choque de Héroes TCG</title>
  <link rel="icon" type="image/png" href="assets/logo/nav-logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <!-- Leaflet.js para el mapa -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    :root {
      --gold:   #f5a623;
      --gold-d: rgba(245,166,35,0.20);
      --gold-g: rgba(245,166,35,0.08);
      --bg:     rgb(var(--nx-k3));
      --card:   rgba(var(--nx-k2),0.97);
      --border: #2a200a;
      --text:   #f0e6d0;
      --muted:  #8a7a5a;
      --green:  #00ff9d;
    }
    html, body { min-height:100%; background:var(--bg); color:var(--text); font-family:'Rajdhani',sans-serif; }
    body { display:flex; flex-direction:column; align-items:center; padding:32px 16px; position:relative; overflow-x:hidden; }
    body::before {
      content:''; position:fixed; inset:0;
      background-image: linear-gradient(45deg,rgba(245,166,35,0.025) 1px,transparent 1px),
                        linear-gradient(-45deg,rgba(245,166,35,0.025) 1px,transparent 1px);
      background-size:40px 40px; pointer-events:none; z-index:0;
    }
    body::after {
      content:''; position:fixed; top:-10%; left:50%; transform:translateX(-50%);
      width:800px; height:500px;
      background:radial-gradient(ellipse,rgba(245,166,35,0.06) 0%,transparent 70%);
      pointer-events:none; z-index:0;
    }
    .container { width:100%; max-width:900px; position:relative; z-index:1; }

    /* HEADER */
    .header { text-align:center; margin-bottom:28px; }
    .header img { width:80px; display:block; margin:0 auto 10px;
      filter:drop-shadow(0 0 14px rgba(245,166,35,0.5)); }
    .logo-text { font-family:'Orbitron',sans-serif; font-size:clamp(20px,5vw,38px);
      font-weight:900; line-height:1.1; letter-spacing:3px; color:#fff;
      text-shadow:0 0 30px rgba(245,166,35,0.4); }
    .logo-text span { color:var(--gold); }
    /* Logo animado (cdh-logo.js) */
    .map-logo { width:min(80vw,300px); margin:-8px auto 0; }
    .tagline { font-family:'Orbitron',sans-serif; font-size:10px;
      letter-spacing:4px; color:var(--muted); margin-top:8px; }

    /* STATS BAR */
    .stats-bar {
      display:flex; justify-content:center; gap:24px;
      margin-bottom:24px; flex-wrap:wrap;
    }
    .stat-box {
      background:var(--card); border:1px solid var(--border); border-radius:6px;
      padding:12px 24px; text-align:center;
      box-shadow:0 0 20px rgba(245,166,35,0.04);
    }
    .stat-num { font-family:'Orbitron',sans-serif; font-size:26px; font-weight:900; color:var(--gold); display:block; }
    .stat-label { font-family:'Orbitron',sans-serif; font-size:8px; letter-spacing:2px; color:var(--muted); }

    /* MAP CARD */
    .map-card {
      background:var(--card); border:1px solid var(--border); border-radius:10px;
      overflow:hidden; margin-bottom:24px;
      box-shadow:0 0 60px rgba(245,166,35,0.05);
    }
    .map-card::before {
      content:''; display:block; height:3px;
      background:linear-gradient(90deg,rgb(var(--nx-k3)),var(--gold),rgb(var(--nx-k3)));
    }
    .map-header { padding:16px 24px; display:flex; align-items:center; gap:12px; }
    .map-header h2 { font-family:'Orbitron',sans-serif; font-size:13px;
      font-weight:700; color:#fff; letter-spacing:2px; }
    .badge { display:inline-block; font-family:'Orbitron',sans-serif; font-size:8px;
      letter-spacing:2px; color:var(--gold); background:var(--gold-g);
      border:1px solid var(--gold-d); padding:3px 10px; border-radius:2px; }

    #map { height:480px; width:100%; }

    /* Leaflet custom styles */
    .leaflet-container { background:rgb(var(--nx-k3)) !important; }
    .tiles-oscuros { filter: invert(1) hue-rotate(180deg) brightness(.82) contrast(1.15) saturate(.55); }
    .leaflet-popup-content-wrapper {
      background:rgb(var(--nx-k2)) !important; border:1px solid var(--border) !important;
      border-radius:8px !important; box-shadow:0 0 20px rgba(245,166,35,0.15) !important;
      color:var(--text) !important;
    }
    .leaflet-popup-tip { background:rgb(var(--nx-k2)) !important; }
    .leaflet-popup-content { margin:12px 16px !important; }
    .popup-store { font-family:'Orbitron',sans-serif; font-size:12px; font-weight:700;
      color:var(--gold); margin-bottom:6px; letter-spacing:1px; }
    .popup-city { font-family:'Rajdhani',sans-serif; font-size:14px; color:var(--muted); margin-bottom:4px; }
    .popup-social a { font-family:'Rajdhani',sans-serif; font-size:13px; color:var(--green);
      text-decoration:none; }
    .popup-social a:hover { text-decoration:underline; }
    .popup-id { font-family:'Courier New',monospace; font-size:10px; color:#2a200a;
      margin-top:6px; }

    /* TIENDAS LIST */
    .list-header { padding:16px 24px 8px; }
    .list-header h2 { font-family:'Orbitron',sans-serif; font-size:13px;
      font-weight:700; color:#fff; letter-spacing:2px; }

    .search-box {
      padding:0 24px 16px;
    }
    .search-box input {
      width:100%; background:rgba(255,255,255,0.03);
      border:1px solid var(--border); border-radius:5px;
      padding:10px 14px; color:var(--text);
      font-family:'Rajdhani',sans-serif; font-size:15px; outline:none;
      transition:border-color 0.2s;
    }
    .search-box input:focus { border-color:var(--gold); }

    .state-group { margin-bottom:4px; }
    .state-title {
      font-family:'Orbitron',sans-serif; font-size:9px; letter-spacing:3px;
      color:var(--gold); padding:10px 24px 6px;
      border-bottom:1px solid var(--border); background:rgba(245,166,35,0.03);
    }
    .store-row {
      display:flex; justify-content:space-between; align-items:center;
      padding:11px 24px; border-bottom:1px solid rgb(var(--nx-k3));
      transition:background 0.15s; cursor:pointer;
    }
    .store-row:hover { background:rgba(245,166,35,0.04); }
    .store-name { font-family:'Rajdhani',sans-serif; font-size:16px; font-weight:700; color:var(--text); }
    .store-city { font-family:'Rajdhani',sans-serif; font-size:13px; color:var(--muted); }
    .store-social { font-family:'Rajdhani',sans-serif; font-size:13px; }
    .store-social a { color:var(--green); text-decoration:none; }
    .store-social a:hover { text-decoration:underline; }

    /* LIST CARD */
    .list-card {
      background:var(--card); border:1px solid var(--border); border-radius:10px;
      overflow:hidden; box-shadow:0 0 60px rgba(245,166,35,0.05);
    }
    .list-card::before {
      content:''; display:block; height:2px;
      background:linear-gradient(90deg,rgb(var(--nx-k3)),var(--gold-d),rgb(var(--nx-k3)));
    }

    /* LOADING / EMPTY */
    .loading {
      text-align:center; padding:60px 24px;
      font-family:'Orbitron',sans-serif; font-size:11px;
      letter-spacing:2px; color:var(--muted);
    }
    .spinner-gold {
      display:inline-block; width:24px; height:24px;
      border:3px solid var(--border); border-top-color:var(--gold);
      border-radius:50%; animation:spin 0.8s linear infinite;
      margin-bottom:12px;
    }
    @keyframes spin { to{transform:rotate(360deg)} }

    /* FOOTER */
    footer { text-align:center; margin-top:24px; padding-bottom:16px;
      position:relative; z-index:1; }
    footer p { font-family:'Rajdhani',sans-serif; font-size:12px; color:rgb(var(--nx-k5)); letter-spacing:1px; }

    @media(max-width:600px) {
      #map { height:320px; }
      .stats-bar { gap:12px; }
      .stat-box { padding:10px 16px; }
    }
  
    /* ── CHH NAV BAR ── */
    #chh-nav {
      position: sticky; top: 0; z-index: 999;
      background: rgba(var(--nx-k1),.96);
      border-bottom: 1px solid rgb(var(--nx-k5));
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex; align-items: center;
      padding: 8px 14px; gap: 10px;
    }
    #chh-nav::after {
      content: ''; position: absolute;
      bottom: 0; left: 5%; right: 5%; height: 1px;
      background: linear-gradient(90deg, transparent, #00cfff, transparent);
      opacity: .5;
    }
    #chh-nav .nav-back {
      font-family: 'Orbitron', monospace; font-size: 9px; font-weight: 700;
      letter-spacing: 1.5px; color: #00cfff; background: transparent;
      border: 1px solid #005f80; padding: 6px 10px; border-radius: 3px;
      cursor: pointer; text-decoration: none; white-space: nowrap;
      transition: background .15s;
      text-shadow: 0 0 8px #00cfff;
      opacity: .8;
    }
    #chh-nav .nav-back:active { background: rgba(0,207,255,.12); opacity: 1; }
    #chh-nav .nav-logo {
      width: 32px; height: 32px; object-fit: contain; flex-shrink: 0;
      filter: drop-shadow(0 0 6px rgba(245,166,35,.5));
    }
    #chh-nav .nav-title {
      font-family: 'Orbitron', monospace; font-size: 11px; font-weight: 900;
      letter-spacing: 2px; text-transform: uppercase;
      color: #00cfff; text-shadow: 0 0 8px #00cfff;
      flex: 1; text-align: center; line-height: 1.2;
    }
    #chh-nav .nav-spacer { width: 60px; flex-shrink: 0; }
    body { padding-top: 0 !important; }

    </style>
<script src="nexo-ui.js"></script>
<script src="cdh-logo.js" defer></script>
</head>
<body>
  <nav id="chh-nav">
    <a class="nav-back" href="index.html">← Menú</a>
    <img class="nav-logo" src="assets/logo/nav-logo.png" alt="CHH">
    <div class="nav-title">Mapa de Tiendas</div>
    <div class="nav-spacer"></div>
  </nav>


  <div class="container">

    <!-- HEADER -->
    <div class="header">
      <cdh-logo class="map-logo" mode="title"></cdh-logo>
      <p class="tagline">TCG · RED DE TIENDAS OFICIALES</p>
    </div>

    <!-- STATS -->
    <div class="stats-bar">
      <div class="stat-box">
        <span class="stat-num" id="total-stores">—</span>
        <span class="stat-label">TIENDAS OFICIALES</span>
      </div>
      <div class="stat-box">
        <span class="stat-num" id="total-states">—</span>
        <span class="stat-label">ESTADOS</span>
      </div>
    </div>

    <!-- MAPA -->
    <div class="map-card">
      <div class="map-header">
        <span class="badge">MAPA</span>
        <h2>TIENDAS POR UBICACIÓN</h2>
      </div>
      <div id="map"></div>
    </div>

    <!-- LISTA -->
    <div class="list-card">
      <div class="list-header">
        <h2>DIRECTORIO DE TIENDAS</h2>
      </div>
      <div class="search-box">
        <input type="text" id="search" placeholder="Buscar tienda, ciudad o estado..." oninput="filterStores()" />
      </div>
      <div id="store-list">
        <div class="loading">
          <div class="spinner-gold"></div><br>
          CARGANDO TIENDAS...
        </div>
      </div>
    </div>

  </div>

  <footer>
    <p>&copy; Codex Cómics 2016–2026 · Todos los derechos reservados</p>
  </footer>

  <script>
    // ============================================================
    // CONFIGURACIÓN — pega aquí la URL de tu Apps Script API
    // ============================================================
    const API_URL = ((window.CHH_CONFIG||{}).mapaTiendas||"https://script.google.com/macros/s/AKfycbxHm7PJh6st5eKZQuNB3dW49GuGphr2KLG_SJlST52w6CQFq871_hINdH0Wto0GztgoVQ/exec");
    // ============================================================

    let allStores = [];
    let map;
    let markers = [];

    // Coordenadas aproximadas por estado de México
    const STATE_COORDS = {
      "aguascalientes":       [21.8818, -102.2916],
      "baja california":      [30.8406, -115.2838],
      "baja california sur":  [26.0444, -111.6661],
      "campeche":             [18.8312, -90.5349],
      "chiapas":              [16.7569, -93.1292],
      "chihuahua":            [28.6353, -106.0889],
      "ciudad de méxico":     [19.4326, -99.1332],
      "cdmx":                 [19.4326, -99.1332],
      "coahuila":             [27.0587, -101.7068],
      "colima":               [19.2452, -103.7241],
      "durango":              [24.0277, -104.6532],
      "estado de méxico":     [19.2826, -99.6557],
      "guanajuato":           [21.0190, -101.2574],
      "guerrero":             [17.4392, -99.5451],
      "hidalgo":              [20.0911, -98.7624],
      "jalisco":              [20.6595, -103.3494],
      "michoacán":            [19.5665, -101.7068],
      "morelos":              [18.6813, -99.1013],
      "nayarit":              [21.7514, -104.8455],
      "nuevo león":           [25.5922, -99.9962],
      "oaxaca":               [17.0732, -96.7266],
      "puebla":               [19.0414, -98.2063],
      "querétaro":            [20.5888, -100.3899],
      "quintana roo":         [19.1817, -88.4791],
      "san luis potosí":      [22.1565, -100.9855],
      "sinaloa":              [25.1721, -107.4795],
      "sonora":               [29.2972, -110.3309],
      "tabasco":              [17.8409, -92.6189],
      "tamaulipas":           [24.2669, -98.8363],
      "tlaxcala":             [19.3139, -98.2404],
      "veracruz":             [19.1738, -96.1342],
      "yucatán":              [20.7099, -89.0943],
      "zacatecas":            [22.7709, -102.5832]
    };

    function getCoords(state) {
      const key = state.toLowerCase()
        .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
        .replace(/estado de mexico/,"estado de méxico");
      for (const [k, v] of Object.entries(STATE_COORDS)) {
        const kn = k.normalize("NFD").replace(/[\u0300-\u036f]/g,"");
        if (kn === key || k === state.toLowerCase()) return v;
      }
      // fallback centro de México
      return [23.6345, -102.5528];
    }

    function initMap() {
      map = L.map("map", {
        center: [23.6345, -102.5528],
        zoom: 5,
        zoomControl: true
      });

      // Mapa base SIN API key: OpenStreetMap oscurecido con filtro CSS (.tiles-oscuros).
      // (CARTO ahora exige API key y muestra la marca "API KEY REQUIRED".)
      // Si OSM falla varias veces, se cambia solo a Esri "Dark Gray" (tampoco pide key).
      let fallos = 0, cambiado = false;
      const osm = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
        maxZoom: 18, className: "tiles-oscuros"
      }).addTo(map);
      osm.on("tileerror", () => {
        if (cambiado || ++fallos < 4) return;
        cambiado = true; map.removeLayer(osm);
        L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}", {
          attribution: 'Tiles &copy; Esri', maxZoom: 16
        }).addTo(map);
      });
    }

    function goldIcon() {
      return L.divIcon({
        className: "",
        html: `<div style="
          width:32px;height:32px;
          background:linear-gradient(135deg,#f5a623,#e08c0a);
          border:2px solid rgba(245,166,35,0.6);
          border-radius:50% 50% 50% 0;
          transform:rotate(-45deg);
          box-shadow:0 0 12px rgba(245,166,35,0.5);
        "></div>`,
        iconSize: [32,32],
        iconAnchor: [16,32],
        popupAnchor: [0,-32]
      });
    }

    function addMarkers(stores) {
      markers.forEach(m => m.remove());
      markers = [];
      stores.forEach(s => {
        const coords = getCoords(s.state);
        // Pequeño offset para tiendas en el mismo estado
        const jitter = [(Math.random()-0.5)*0.8, (Math.random()-0.5)*0.8];
        const marker = L.marker(
          [coords[0]+jitter[0], coords[1]+jitter[1]],
          { icon: goldIcon() }
        ).addTo(map);

        const socialHtml = s.social
          ? `<div class="popup-social">🔗 <a href="${s.social.startsWith("http")?s.social:"https://"+s.social}" target="_blank">${s.social}</a></div>`
          : "";

        marker.bindPopup(`
          <div class="popup-store">🏆 ${s.store}</div>
          <div class="popup-city">📍 ${s.city}, ${s.state}</div>
          ${socialHtml}
          <div class="popup-id">${s.id}</div>
        `);
        markers.push(marker);
      });
    }

    function renderList(stores) {
      const container = document.getElementById("store-list");
      if (stores.length === 0) {
        container.innerHTML = '<div class="loading">NO SE ENCONTRARON TIENDAS</div>';
        return;
      }
      // Agrupar por estado
      const byState = {};
      stores.forEach(s => {
        const st = s.state || "Sin estado";
        if (!byState[st]) byState[st] = [];
        byState[st].push(s);
      });

      let html = "";
      Object.keys(byState).sort().forEach(state => {
        html += `<div class="state-group">
          <div class="state-title">▸ ${state.toUpperCase()} (${byState[state].length})</div>`;
        byState[state].forEach(s => {
          const socialHtml = s.social
            ? `<span class="store-social">🔗 <a href="${s.social.startsWith("http")?s.social:"https://"+s.social}" target="_blank">${s.social}</a></span>`
            : `<span class="store-social" style="color:#2a200a;">—</span>`;
          html += `<div class="store-row">
            <div>
              <div class="store-name">${s.store}</div>
              <div class="store-city">📍 ${s.city}</div>
            </div>
            ${socialHtml}
          </div>`;
        });
        html += `</div>`;
      });
      container.innerHTML = html;
    }

    function filterStores() {
      const q = document.getElementById("search").value.toLowerCase();
      const filtered = allStores.filter(s =>
        s.store.toLowerCase().includes(q) ||
        s.city.toLowerCase().includes(q) ||
        s.state.toLowerCase().includes(q)
      );
      renderList(filtered);
      addMarkers(filtered);
    }

    async function loadStores() {
      try {
        const res  = await fetch(API_URL);
        const data = await res.json();

        if (data.status !== "ok") throw new Error(data.message);

        allStores = data.tiendas;

        // Stats
        const states = new Set(allStores.map(s => s.state));
        document.getElementById("total-stores").textContent = allStores.length;
        document.getElementById("total-states").textContent = states.size;

        addMarkers(allStores);
        renderList(allStores);

      } catch(err) {
        document.getElementById("store-list").innerHTML =
          `<div class="loading" style="color:#ff4d6d;">ERROR AL CARGAR TIENDAS<br><small style="font-family:Rajdhani;font-size:13px;color:#8a7a5a;">${err.message}</small></div>`;
        document.getElementById("total-stores").textContent = "—";
        document.getElementById("total-states").textContent = "—";
      }
    }

    // Init
    initMap();
    loadStores();
  </script>

  <!-- Sistema de ajustes -->
  <script src="settings.js"></script>

<!-- Música de fondo persistente -->
<script src="bgm.js"></script>
</body>
</html>
