<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#04061a">
<title>Noticias · Choque de Héroes TCG</title>
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<!--
  NOTICIAS · se leen de noticias.json (la más reciente primero).
  Campos de cada noticia:
    fecha       "15 de Junio 2026" o "2026-06-15"
    titulo, resumen, texto   (en "texto" una línea en blanco separa párrafos)
    imagen      ruta de la imagen (horizontal 16:9)
    link        opcional: botón "Más información"
    linkTexto   opcional: texto de ese botón
    destacado   true = aparece arriba en grande (la más reciente destacada)
    categoria   opcional: Expansiones | Torneos | Comunidad | App | … (crea un filtro por cada una)
  Control: cruceta para moverte, A abre, B cierra, LB/RB noticia anterior/siguiente, LT/RT desplazan el texto.
-->
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--acc:var(--neon,#f5c842);--line:rgba(var(--nx-ln,143,176,255),.18);--mut:#8d9bc7;--txt:#eef2ff;
  --safeT:max(10px,env(safe-area-inset-top));--safeB:max(14px,env(safe-area-inset-bottom))}
html,body{min-height:100%;background:rgb(var(--nx-k1,4,6,26));color:var(--txt);font-family:'Rajdhani',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body{overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}

/* ═══ Barra superior ═══ */
.top-bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:calc(var(--safeT) + 2px) 16px 12px}
.back-btn{width:42px;height:38px;display:flex;align-items:center;justify-content:center;font-size:22px}
.top-title{font-family:'Orbitron',sans-serif;font-weight:900;font-size:clamp(20px,5.4vw,28px);letter-spacing:.06em;line-height:1;border-left:4px solid var(--acc);padding-left:12px}
.top-title small{display:block;font-family:'Rajdhani',sans-serif;font-weight:600;font-size:13px;letter-spacing:.02em;color:var(--mut);margin-top:4px}

/* ═══ Filtros ═══ */
#filtros{display:flex;gap:8px;overflow-x:auto;padding:4px 16px 14px;scrollbar-width:none}
#filtros::-webkit-scrollbar{display:none}
#filtros:empty{display:none}
.fil{flex-shrink:0;padding:7px 16px 7px 14px;font-weight:700;font-size:15px;background:rgba(var(--nx-k4,10,15,46),.85);border:1px solid var(--line);
  clip-path:polygon(0 0,100% 0,calc(100% - 9px) 100%,0 100%);transition:background .15s,color .15s}
.fil.on{background:var(--acc);color:#04061a;border-color:var(--acc)}
.fil:focus-visible{outline:2px solid #fff;outline-offset:-2px}

main{max-width:1100px;margin:0 auto;padding:0 16px calc(var(--safeB) + 70px)}

/* ═══ Destacada ═══ */
.hero{position:relative;display:block;width:100%;text-align:left;overflow:hidden;margin-bottom:18px;border:1px solid var(--line);
  background:rgba(var(--nx-k3,9,13,40),.9);clip-path:polygon(0 0,calc(100% - 18px) 0,100% 18px,100% 100%,0 100%)}
.hero .img{aspect-ratio:16/8;max-height:58vh;width:100%;background:rgb(var(--nx-k3,10,15,46)) center/cover no-repeat}
.hero .tx{position:absolute;left:0;right:0;bottom:0;padding:44px 18px 16px;background:linear-gradient(180deg,transparent,rgba(var(--nx-k1,4,6,26),.92) 55%)}
.hero h2{font-family:'Orbitron',sans-serif;font-weight:900;font-size:clamp(18px,4.6vw,30px);line-height:1.2;letter-spacing:.02em;max-width:820px}
.hero p{font-size:16px;color:#c9d2f2;margin-top:6px;max-width:720px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hero:hover,.hero:focus-visible{outline:none;border-color:var(--acc)}
.hero:focus-visible{box-shadow:inset 0 0 0 2px var(--acc)}

.meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;font-weight:600;color:var(--mut)}
.tag{font-family:'Orbitron',sans-serif;font-weight:700;font-size:10px;letter-spacing:.1em;padding:3px 8px;background:var(--acc);color:#04061a}
.tag.cat{background:rgba(var(--nx-ln,143,176,255),.16);color:#dfe6ff}
.tag.nuevo{background:#ff3d6b;color:#fff}

/* ═══ Lista ═══ */
#lista{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:760px){#lista{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:1080px){#lista{grid-template-columns:repeat(3,minmax(0,1fr))}}
.card{display:flex;flex-direction:column;text-align:left;overflow:hidden;border:1px solid var(--line);background:rgba(var(--nx-k3,9,13,40),.9);
  clip-path:polygon(0 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%);transition:transform .15s,border-color .15s}
.card .img{aspect-ratio:16/8;background:rgb(var(--nx-k3,10,15,46)) center/cover no-repeat;position:relative}
.card .bd{padding:12px 14px 16px;display:flex;flex-direction:column;gap:6px}
.card h3{font-family:'Orbitron',sans-serif;font-weight:700;font-size:15px;line-height:1.3;letter-spacing:.02em}
.card p{font-size:15px;color:#b9c3e6;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card:hover,.card:focus-visible{outline:none;border-color:var(--acc);transform:translateY(-2px)}
.card:focus-visible{box-shadow:inset 0 0 0 2px var(--acc)}
@media (max-width:759px){.card{flex-direction:row;align-items:stretch}.card .img{aspect-ratio:auto;width:38%;min-height:96px;flex-shrink:0}.card h3{font-size:14px}.card p{font-size:14px}}

.estado{text-align:center;padding:60px 20px;color:var(--mut)}
.estado b{display:block;font-family:'Orbitron',sans-serif;font-size:15px;color:#dfe6ff;margin-bottom:6px}
.estado button{margin-top:14px;padding:10px 20px;background:var(--acc);color:#04061a;font-family:'Orbitron',sans-serif;font-weight:700;font-size:12px;letter-spacing:.08em}
.spin{width:34px;height:34px;margin:0 auto 14px;border:3px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ═══ Detalle ═══ */
#det{position:fixed;inset:0;z-index:50;display:flex;justify-content:center;background:rgba(var(--nx-k1,4,6,26),.7);opacity:0;pointer-events:none;transition:opacity .2s}
#det.on{opacity:1;pointer-events:auto}
#det .pan{position:relative;width:min(860px,100%);height:100%;display:flex;flex-direction:column;background:rgba(var(--nx-k2,6,10,30),.98);border-left:1px solid var(--line);border-right:1px solid var(--line);
  transform:translateY(16px);transition:transform .22s}
#det.on .pan{transform:none}
#det .hd{display:flex;align-items:center;gap:8px;padding:calc(var(--safeT) + 2px) 12px 10px;border-bottom:1px solid var(--line)}
#det .hd .sp{flex:1;font-family:'Orbitron',sans-serif;font-size:12px;letter-spacing:.12em;color:var(--mut);text-align:center}
.ib{width:42px;height:40px;display:flex;align-items:center;justify-content:center;font-size:20px;background:rgba(var(--nx-k4,10,15,46),.9);border:1px solid var(--line)}
.ib:disabled{opacity:.3;cursor:default}
.ib:hover:not(:disabled),.ib:focus-visible{outline:none;border-color:var(--acc);color:var(--acc)}
#det .body{flex:1;overflow-y:auto;overscroll-behavior:contain}
#det .dimg{width:100%;aspect-ratio:16/8;max-height:50vh;background:rgb(var(--nx-k3,10,15,46)) center/cover no-repeat}
#det .cont{padding:18px 20px 40px;max-width:720px}
#det h1{font-family:'Orbitron',sans-serif;font-weight:900;font-size:clamp(20px,5vw,30px);line-height:1.2;margin:10px 0 14px}
#det .txt p{font-size:18px;line-height:1.6;color:#dfe5fb;margin-bottom:14px;font-weight:500}
#det .acc{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.bt{display:inline-flex;align-items:center;gap:8px;padding:12px 22px 12px 18px;font-family:'Orbitron',sans-serif;font-weight:700;font-size:12px;letter-spacing:.08em;
  clip-path:polygon(0 0,100% 0,calc(100% - 12px) 100%,0 100%)}
.bt.pri{background:var(--acc);color:#04061a}
.bt.sec{background:rgba(var(--nx-k4,10,15,46),.9);border:1px solid var(--line)}
.bt:focus-visible,.bt:hover{outline:2px solid #fff;outline-offset:-2px}
#det .pos{font-family:'Orbitron',sans-serif;font-size:11px;letter-spacing:.1em;color:var(--mut);padding:0 20px 18px}
.gpHint{display:none;font-size:13px;color:var(--mut);padding:0 20px 64px}
html.gp-on .gpHint{display:block}
.gpHint i{font-style:normal;display:inline-block;padding:0 5px;border-radius:4px;background:#9fb3cc;color:#04061a;font-weight:700;font-size:11px;margin:0 2px}
@media (prefers-reduced-motion:reduce){.card,#det,#det .pan{transition:none}.spin{animation:none}}
</style>
<script src="nexo-ui.js"></script>
</head>
<body>
<header class="top-bar">
  <a href="index.html" class="back-btn" aria-label="Regresar al menú">‹</a>
  <h1 class="top-title">NOTICIAS<small id="sub">Lo más reciente de Choque de Héroes</small></h1>
</header>
<div id="filtros" role="tablist" aria-label="Filtrar noticias"></div>
<main>
  <div id="destacada"></div>
  <div id="lista" role="list"></div>
  <div class="estado" id="estado"><div class="spin"></div>Cargando noticias…</div>
</main>

<div id="det" role="dialog" aria-modal="true" aria-labelledby="dTit">
  <div class="pan">
    <div class="hd">
      <button class="ib" id="dCerrar" type="button" aria-label="Cerrar">‹</button>
      <div class="sp" id="dPos"></div>
      <button class="ib" id="dAnt" type="button" aria-label="Noticia anterior">◀</button>
      <button class="ib" id="dSig" type="button" aria-label="Noticia siguiente">▶</button>
    </div>
    <div class="body" id="dBody">
      <div class="dimg" id="dImg"></div>
      <div class="cont">
        <div class="meta" id="dMeta"></div>
        <h1 id="dTit"></h1>
        <div class="txt" id="dTxt"></div>
        <div class="acc" id="dAcc"></div>
      </div>
      <div class="gpHint"><i>LB</i><i>RB</i> anterior / siguiente · <i>LT</i><i>RT</i> desplazar · <i>B</i> cerrar</div>
    </div>
  </div>
</div>

<script>
// ── Flag de tracking para badges (v3) ──
try { const s = JSON.parse(localStorage.getItem('chh_secciones_visitadas') || '[]'); if (!s.includes('noticias')) { s.push('noticias'); localStorage.setItem('chh_secciones_visitadas', JSON.stringify(s)); } } catch (e) {}

const $ = id => document.getElementById(id);
const esc = t => String(t ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const MESES = { enero: 0, febrero: 1, marzo: 2, abril: 3, mayo: 4, junio: 5, julio: 6, agosto: 7, septiembre: 8, setiembre: 8, octubre: 9, noviembre: 10, diciembre: 11 };
function fechaDe(n) {   // "15 de Junio 2026", "15 de junio de 2026" o "2026-06-15"
  const f = String(n.fecha || '').trim();
  const iso = f.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/); if (iso) return new Date(+iso[1], +iso[2] - 1, +iso[3]);
  const m = f.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').match(/(\d{1,2})\s+de\s+([a-z]+)(?:\s+de)?\s+(\d{4})/);
  if (m && MESES[m[2]] != null) return new Date(+m[3], MESES[m[2]], +m[1]);
  const d = new Date(f); return isNaN(d) ? new Date(0) : d;
}
const fechaTxt = n => n.fechaLegible || n.fecha || '';
const K_VISTAS = 'chh_noticias_vistas';
let vistas = []; try { vistas = JSON.parse(localStorage.getItem(K_VISTAS) || '[]'); } catch (e) {}
const marcarVista = n => { if (!vistas.includes(n.titulo)) { vistas.push(n.titulo); try { localStorage.setItem(K_VISTAS, JSON.stringify(vistas.slice(-200))); localStorage.setItem('chh_last_noticia', NOTICIAS[0] ? NOTICIAS[0].titulo : ''); } catch (e) {} } };
const esNueva = n => !vistas.includes(n.titulo) && (Date.now() - fechaDe(n).getTime() < 45 * 864e5);

let NOTICIAS = [], FILTRO = 'Todas', VISIBLES = [], ACT = -1;

async function cargar() {
  $('estado').innerHTML = '<div class="spin"></div>Cargando noticias…'; $('estado').style.display = '';
  try {
    const r = await fetch('noticias.json', { cache: 'no-cache' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    NOTICIAS = (await r.json() || []).filter(n => n && n.titulo).sort((a, b) => fechaDe(b) - fechaDe(a));
    if (!NOTICIAS.length) { $('estado').innerHTML = '<b>Todavía no hay noticias</b>Aquí aparecerán los anuncios de expansiones, torneos y novedades.'; return; }
    $('estado').style.display = 'none';
    pintarFiltros(); pintar();
    const h = location.hash.match(/^#n=(\d+)$/); if (h && NOTICIAS[+h[1]]) abrir(+h[1]);
    else setTimeout(() => { if (window.GP && GP.activo()) GP.enfocar(document.querySelector('.hero,.card')); }, 80);
  } catch (e) {
    $('estado').innerHTML = '<b>No se pudieron cargar las noticias</b>Revisa tu conexión e inténtalo de nuevo.<br><button type="button" id="reint">REINTENTAR</button>';
    $('reint').onclick = cargar;
  }
}
function pintarFiltros() {
  const cats = [...new Set(NOTICIAS.map(n => (n.categoria || '').trim()).filter(Boolean))];
  if (!cats.length) { $('filtros').innerHTML = ''; return; }
  $('filtros').innerHTML = ['Todas', ...cats].map(c => `<button type="button" class="fil${c === FILTRO ? ' on' : ''}" role="tab" aria-selected="${c === FILTRO}" data-c="${esc(c)}">${esc(c)}</button>`).join('');
  $('filtros').querySelectorAll('.fil').forEach(b => b.onclick = () => { FILTRO = b.dataset.c; pintarFiltros(); pintar(); });
}
function pintar() {
  VISIBLES = NOTICIAS.map((n, i) => i).filter(i => FILTRO === 'Todas' || (NOTICIAS[i].categoria || '').trim() === FILTRO);
  const nNuevas = NOTICIAS.filter(esNueva).length;
  $('sub').textContent = NOTICIAS.length + ' noticias' + (nNuevas ? ' · ' + nNuevas + (nNuevas === 1 ? ' nueva' : ' nuevas') : '');
  const iD = VISIBLES.find(i => NOTICIAS[i].destacado);
  const resto = VISIBLES.filter(i => i !== iD);
  const meta = n => `${n.destacado ? '<span class="tag">DESTACADO</span>' : ''}${esNueva(n) ? '<span class="tag nuevo">NUEVO</span>' : ''}${n.categoria ? '<span class="tag cat">' + esc(n.categoria) + '</span>' : ''}<span>${esc(fechaTxt(n))}</span>`;
  $('destacada').innerHTML = iD == null ? '' : (() => { const n = NOTICIAS[iD];
    return `<button type="button" class="hero" data-i="${iD}"><div class="img" style="background-image:url('${esc(n.imagen || '')}')"></div><div class="tx"><div class="meta">${meta(n)}</div><h2>${esc(n.titulo)}</h2><p>${esc(n.resumen || '')}</p></div></button>`; })();
  $('lista').innerHTML = resto.map(i => { const n = NOTICIAS[i];
    return `<button type="button" class="card" role="listitem" data-i="${i}"><div class="img" style="background-image:url('${esc(n.imagen || '')}')"></div><div class="bd"><div class="meta">${meta(n)}</div><h3>${esc(n.titulo)}</h3><p>${esc(n.resumen || String(n.texto || '').slice(0, 140))}</p></div></button>`; }).join('');
  document.querySelectorAll('.hero,.card').forEach(b => b.onclick = () => abrir(+b.dataset.i));
  if (!VISIBLES.length) { $('estado').style.display = ''; $('estado').innerHTML = '<b>Sin noticias en esta categoría</b>Prueba con otro filtro.'; } else $('estado').style.display = 'none';
}
function abrir(i) {
  const n = NOTICIAS[i]; if (!n) return;
  ACT = i; marcarVista(n);
  const pos = VISIBLES.indexOf(i);
  $('dPos').textContent = pos >= 0 ? (pos + 1) + ' / ' + VISIBLES.length : '';
  $('dAnt').disabled = pos <= 0; $('dSig').disabled = pos < 0 || pos >= VISIBLES.length - 1;
  $('dImg').style.display = n.imagen ? '' : 'none'; $('dImg').style.backgroundImage = n.imagen ? `url('${n.imagen.replace(/'/g, '%27')}')` : 'none';
  $('dMeta').innerHTML = `${n.destacado ? '<span class="tag">DESTACADO</span>' : ''}${n.categoria ? '<span class="tag cat">' + esc(n.categoria) + '</span>' : ''}<span>${esc(fechaTxt(n))}</span>`;
  $('dTit').textContent = n.titulo;
  $('dTxt').innerHTML = String(n.texto || n.resumen || '').split(/\n\s*\n|\r?\n/).map(p => p.trim()).filter(Boolean).map(p => '<p>' + esc(p) + '</p>').join('');
  const acc = [];
  if (n.link) acc.push(`<a class="bt pri" href="${esc(n.link)}" ${/^https?:/.test(n.link) ? 'target="_blank" rel="noopener"' : ''}>${esc(n.linkTexto || 'Más información')}</a>`);
  if (navigator.share) acc.push('<button type="button" class="bt sec" id="dShare">Compartir</button>');
  $('dAcc').innerHTML = acc.join('');
  if ($('dShare')) $('dShare').onclick = () => navigator.share({ title: n.titulo, text: n.resumen || n.titulo, url: location.href.split('#')[0] + '#n=' + i }).catch(() => {});
  $('dBody').scrollTop = 0;
  const yaAbierto = $('det').classList.contains('on');
  $('det').classList.add('on'); document.body.style.overflow = 'hidden';
  try { history[yaAbierto ? 'replaceState' : 'pushState']({ n: i }, '', '#n=' + i); } catch (e) {}
  setTimeout(() => { const f = n.link ? $('dAcc').querySelector('a') : ($('dSig').disabled ? $('dCerrar') : $('dSig')); if (window.GP && GP.activo()) GP.enfocar(f); else f && f.focus({ preventScroll: true }); }, 60);
}
function cerrar(desdeHist) {
  if (!$('det').classList.contains('on')) return false;
  $('det').classList.remove('on'); document.body.style.overflow = '';
  pintar();   // quita las marcas "NUEVO" de lo ya leído
  const el = document.querySelector(`[data-i="${ACT}"]`); ACT = -1;
  if (!desdeHist) { try { if (history.state && history.state.n != null) history.back(); else history.replaceState(null, '', location.pathname); } catch (e) {} }
  setTimeout(() => { if (!el) return; if (window.GP && GP.activo()) GP.enfocar(el); else el.focus({ preventScroll: true }); }, 60);
  return true;
}
function mover(d) {
  if (ACT < 0) return false;
  const pos = VISIBLES.indexOf(ACT), j = VISIBLES[pos + d];
  if (j == null) return true;
  abrir(j); return true;
}
$('dCerrar').onclick = () => cerrar();
$('dAnt').onclick = () => mover(-1);
$('dSig').onclick = () => mover(1);
$('det').addEventListener('click', e => { if (e.target === $('det')) cerrar(); });
window.addEventListener('popstate', () => { if ($('det').classList.contains('on')) cerrar(true); });
document.addEventListener('keydown', e => {
  if (!$('det').classList.contains('on')) return;
  if (e.key === 'Escape') { e.preventDefault(); cerrar(); }
  else if (e.key === 'ArrowLeft' && !e.target.closest('.acc')) { e.preventDefault(); mover(-1); }
  else if (e.key === 'ArrowRight' && !e.target.closest('.acc')) { e.preventDefault(); mover(1); }
});
// Deslizar a los lados en el detalle cambia de noticia
(function () { let x0 = null, y0 = 0; const b = $('dBody');
  b.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, { passive: true });
  b.addEventListener('touchend', e => { if (x0 == null) return; const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0; x0 = null; if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.5) mover(dx < 0 ? 1 : -1); }); })();

// ── Control (gamepad.js) ──
window.GP_CFG = {
  zonas: ['#filtros', '#destacada', '#lista'],
  inicial: () => $('det').classList.contains('on') ? $('dCerrar') : document.querySelector('.hero,.card') || document.querySelector('.back-btn'),
  atras: () => { if (cerrar()) return true; location.href = 'index.html'; return true; },
  ambito: () => $('det').classList.contains('on') ? $('det') : null,
  lbrb: d => $('det').classList.contains('on') ? mover(d) : false,
  get scroll() { return $('det').classList.contains('on') ? '#dBody' : null; },
  principalTxt: 'Abrir'
};
cargar();
</script>
<script src="gamepad.js"></script>
<!-- Música de fondo persistente -->
<script src="bgm.js"></script>
</body>
</html>
