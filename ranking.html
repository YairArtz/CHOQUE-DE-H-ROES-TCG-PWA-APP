<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#04061a">
<title>Ranking Global · Choque de Héroes TCG</title>
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<!--
  RANKING GLOBAL · datos de los torneos publicados (Apps Script).
  Puntos por posición: 1° 8 · 2° 5 · 3° 4 · 4° 3 · 5°-6° 2 · 7°-8° 1.
  Temporadas = año de la fecha del torneo. "Histórico" suma todo.
  Enlace directo a un jugador: ranking.html?id=<ID>
-->
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{--acc:var(--neon,#f5c842)}
:root{--line:rgba(var(--nx-ln,143,176,255),.18);--mut:#8d9bc7;--txt:#eef2ff;--oro:#f5c842;--plata:#cfd8ec;--bronce:#e09a5b;
  --safeT:max(10px,env(safe-area-inset-top));--safeB:max(14px,env(safe-area-inset-bottom))}
html,body{min-height:100%;background:rgb(var(--nx-k1,4,6,26));color:var(--txt);font-family:'Rajdhani',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit;background:none;border:0}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
.top-bar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding:calc(var(--safeT) + 2px) 16px 12px}
.back-btn{width:42px;height:38px;display:flex;align-items:center;justify-content:center;font-size:22px}
.top-title{font-family:'Orbitron',sans-serif;font-weight:900;font-size:clamp(20px,5.4vw,28px);letter-spacing:.06em;line-height:1;border-left:4px solid var(--acc);padding-left:12px;flex:1;min-width:0}
.top-title small{display:block;font-family:'Rajdhani',sans-serif;font-weight:600;font-size:13px;letter-spacing:.02em;color:var(--mut);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rf{width:40px;height:38px;display:flex;align-items:center;justify-content:center;font-size:20px;border:1px solid var(--line);background:rgba(var(--nx-k3,9,13,40),.85)}
.rf:hover,.rf:focus-visible{border-color:var(--acc);color:var(--acc);outline:none}
.rf.gira{animation:gira 1s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}

main{max-width:1180px;margin:0 auto;padding:4px 16px calc(var(--safeB) + 24px)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 14px 7px 12px;font-weight:700;font-size:15px;white-space:nowrap;background:rgba(var(--nx-k4,10,15,46),.85);border:1px solid var(--line);
  clip-path:polygon(0 0,100% 0,calc(100% - 9px) 100%,0 100%)}
.chip.on{background:var(--acc);color:#04061a;border-color:var(--acc)}
.chip:hover,.chip:focus-visible{outline:2px solid #fff;outline-offset:-2px}
#temps{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
#temps::-webkit-scrollbar{display:none}
.est{font-size:14px;color:var(--mut);margin:-4px 0 12px}
.est.off{color:#ffb36b}

.cols{display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
@media (min-width:960px){.cols{grid-template-columns:minmax(0,1fr) 340px;align-items:start}#lado{position:sticky;top:84px}}
h2{font-family:'Orbitron',sans-serif;font-weight:700;font-size:15px;letter-spacing:.06em;margin:0 0 10px;display:flex;align-items:center;gap:10px}
h2::after{content:"";flex:1;height:1px;background:var(--line)}
.panel{border:1px solid var(--line);background:rgba(var(--nx-k3,9,13,40),.88);clip-path:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,0 100%);padding:14px}

/* ═══ Podio ═══ */
#podio{display:grid;grid-template-columns:1fr 1.15fr 1fr;align-items:end;gap:10px;margin-bottom:18px}
.pd{position:relative;text-align:center;padding:16px 8px 12px;border:1px solid var(--line);background:linear-gradient(180deg,rgba(var(--nx-k5,20,26,70),.92),rgba(var(--nx-k2,6,10,30),.92));min-width:0}
.pd:hover,.pd:focus-visible{border-color:var(--acc);outline:none}
.pd.p1{padding-top:22px;padding-bottom:20px;border-color:rgba(245,200,66,.6);background:linear-gradient(180deg,rgba(245,200,66,.18),rgba(var(--nx-k2,6,10,30),.95) 70%)}
.hex{width:58px;height:66px;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;font-family:'Orbitron',sans-serif;font-weight:900;font-size:19px;color:#04061a;
  clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.p1 .hex{width:72px;height:82px;font-size:24px;background:var(--oro);box-shadow:0 0 0 0}
.p2 .hex{background:var(--plata)}.p3 .hex{background:var(--bronce)}
.pd .pos{position:absolute;top:6px;left:8px;font-family:'Orbitron',sans-serif;font-weight:900;font-size:13px;opacity:.75}
.pd b{display:block;font-family:'Orbitron',sans-serif;font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pd .pts{font-family:'Orbitron',sans-serif;font-weight:900;font-size:22px;margin-top:4px}
.p1 .pts{color:var(--oro);font-size:28px}
.pd small{display:block;font-size:13px;color:var(--mut)}

/* ═══ Tu posición ═══ */
#yo{display:none;align-items:center;gap:14px;margin-bottom:18px;padding:12px 16px;text-align:left;width:100%;border:1px solid var(--acc);
  background:linear-gradient(90deg,rgba(var(--nx-g1,139,92,255),.22),rgba(var(--nx-k3,9,13,40),.9));clip-path:polygon(0 0,100% 0,calc(100% - 14px) 100%,0 100%)}
#yo.on{display:flex}
#yo .n{font-family:'Orbitron',sans-serif;font-weight:900;font-size:30px;color:var(--acc);min-width:58px;text-align:center}
#yo .t{flex:1;min-width:0}
#yo .t b{font-family:'Orbitron',sans-serif;font-size:14px;display:block}
#yo .t span{font-size:15px;color:#d6dcff}
#yo:hover,#yo:focus-visible{outline:2px solid #fff;outline-offset:-2px}

/* ═══ Tabla ═══ */
.ctl{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.bus{flex:1 1 200px;display:flex;align-items:center;gap:8px;padding:0 12px;border:1px solid var(--line);background:rgba(var(--nx-k2,6,10,30),.9);min-height:40px}
.bus input{flex:1;min-width:0;outline:none;font-size:16px;font-weight:600}
.bus:focus-within{border-color:var(--acc)}
#orden{display:flex;gap:6px;flex-wrap:wrap}
.lh{display:grid;grid-template-columns:44px minmax(0,1fr) 62px 62px 62px;gap:8px;padding:0 12px 6px;font-size:13px;font-weight:700;color:var(--mut);letter-spacing:.04em}
.lh span:nth-child(n+3){text-align:right}
#lista{display:flex;flex-direction:column;gap:5px}
.fila{display:grid;grid-template-columns:44px minmax(0,1fr) 62px 62px 62px;gap:8px;align-items:center;width:100%;padding:9px 12px;text-align:left;
  border:1px solid transparent;background:rgba(var(--nx-k3,9,13,40),.82);transition:background .15s}
.fila:nth-child(odd){background:rgba(var(--nx-k2,6,10,30),.82)}
.fila:hover,.fila:focus-visible{background:rgba(var(--nx-k5,20,26,70),.95);border-color:var(--acc);outline:none}
.fila .r{font-family:'Orbitron',sans-serif;font-weight:900;font-size:16px;text-align:center}
.fila.t1 .r{color:var(--oro)}.fila.t2 .r{color:var(--plata)}.fila.t3 .r{color:var(--bronce)}
.fila b{display:block;font-family:'Orbitron',sans-serif;font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fila small{font-size:13px;color:var(--mut)}
.fila .v{text-align:right;font-weight:700;font-size:16px;font-variant-numeric:tabular-nums}
.fila .v.k{font-family:'Orbitron',sans-serif;color:var(--acc)}
.fila.yo{border-color:var(--acc);background:linear-gradient(90deg,rgba(var(--nx-g1,139,92,255),.28),rgba(var(--nx-k3,9,13,40),.85))}
.fila.brilla{animation:brilla 1.4s ease 2}
@keyframes brilla{50%{background:rgba(var(--nx-g1,139,92,255),.5)}}
@media (max-width:560px){.lh,.fila{grid-template-columns:38px minmax(0,1fr) 56px 46px}.lh span:nth-child(5),.fila .v:nth-child(5){display:none}}
.mas{display:block;margin:12px auto 0}
.vacio{padding:34px 10px;text-align:center;color:var(--mut);font-size:16px}
.cargando{height:46px;background:linear-gradient(90deg,rgba(var(--nx-k3,9,13,40),.8),rgba(var(--nx-k5,20,26,70),.9),rgba(var(--nx-k3,9,13,40),.8));background-size:200% 100%;animation:shim 1.2s linear infinite}
@keyframes shim{to{background-position:-200% 0}}

/* ═══ Lateral ═══ */
.cifras{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.cifras div{text-align:center;padding:10px 4px;border:1px solid var(--line);background:rgba(var(--nx-k2,6,10,30),.85)}
.cifras b{display:block;font-family:'Orbitron',sans-serif;font-weight:900;font-size:22px}
.cifras span{font-size:13px;color:var(--mut)}
.tor{display:block;width:100%;text-align:left;padding:9px 0;border-bottom:1px solid var(--line)}
.tor:last-child{border-bottom:0}
.tor b{display:block;font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tor span{font-size:14px;color:var(--mut)}
.tor span em{font-style:normal;color:var(--oro)}
.tor:hover,.tor:focus-visible{outline:none;color:var(--acc)}
.leyenda{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:16px;font-size:14px;color:var(--mut)}
.leyenda b{color:var(--txt)}

/* ═══ Ficha de jugador / torneo ═══ */
#velo{position:fixed;inset:0;z-index:80;background:rgba(2,3,12,.7);opacity:0;pointer-events:none;transition:opacity .2s}
#velo.on{opacity:1;pointer-events:auto}
#ficha{position:fixed;z-index:81;left:0;right:0;bottom:0;max-height:88vh;display:flex;flex-direction:column;background:rgb(var(--nx-k2,6,10,30));border-top:2px solid var(--acc);
  transform:translateY(105%);transition:transform .25s ease}
#ficha.on{transform:none}
@media (min-width:760px){#ficha{left:auto;top:0;bottom:0;width:440px;max-height:none;border-top:0;border-left:2px solid var(--acc);transform:translateX(105%)}}
.fh{display:flex;align-items:center;gap:14px;padding:18px 18px 12px}
.fh .hex{margin:0;width:58px;height:66px;background:var(--acc);flex-shrink:0}
.fh .t{flex:1;min-width:0}
.fh b{display:block;font-family:'Orbitron',sans-serif;font-weight:900;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fh span{font-size:15px;color:var(--mut)}
.x{width:40px;height:40px;font-size:22px;border:1px solid var(--line)}
.x:hover,.x:focus-visible{border-color:var(--acc);color:var(--acc);outline:none}
#fBody{overflow-y:auto;padding:0 18px calc(var(--safeB) + 14px);-webkit-overflow-scrolling:touch}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.kpi div{padding:10px 6px;text-align:center;border:1px solid var(--line);background:rgba(var(--nx-k3,9,13,40),.9)}
.kpi b{display:block;font-family:'Orbitron',sans-serif;font-weight:900;font-size:19px}
.kpi span{font-size:13px;color:var(--mut)}
.barra{display:flex;height:10px;margin:4px 0 6px;background:rgba(255,255,255,.08)}
.barra i{display:block;height:100%}
.hist{margin-top:10px}
.hist .h{display:grid;grid-template-columns:40px minmax(0,1fr) 42px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.hist .h .p{font-family:'Orbitron',sans-serif;font-weight:900;font-size:15px;text-align:center}
.hist .h b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hist .h small{font-size:13px;color:var(--mut)}
.hist .h .pt{text-align:right;font-weight:700;color:var(--acc)}
.acc2{display:flex;gap:8px;margin-top:14px}
.acc2 .chip{flex:1;justify-content:center}
.gpHint{display:none;margin-top:8px;font-size:13px;color:var(--mut)}
html.gp-on .gpHint{display:block}
.gpHint i{font-style:normal;display:inline-block;padding:0 5px;border-radius:4px;background:#9fb3cc;color:#04061a;font-weight:700;font-size:11px;margin:0 2px}
#toast{position:fixed;left:50%;bottom:calc(var(--safeB) + 20px);transform:translateX(-50%) translateY(20px);opacity:0;z-index:90;padding:10px 18px;background:var(--acc);color:#04061a;font-weight:700;font-size:15px;transition:opacity .2s,transform .2s;pointer-events:none}
#toast.on{opacity:1;transform:translateX(-50%)}
@media (prefers-reduced-motion:reduce){.cargando,.fila.brilla,.rf.gira{animation:none}#ficha{transition:none}}
</style>
<script src="nexo-ui.js"></script>

<body>
<header class="top-bar">
  <a href="index.html" class="back-btn" aria-label="Regresar al menú">‹</a>
  <h1 class="top-title">RANKING GLOBAL<small id="sub">Puntos de liga de los torneos oficiales</small></h1>
  <button class="rf" id="bRf" type="button" aria-label="Actualizar">⟳</button>
</header>
<main>
  <div id="temps" role="tablist" aria-label="Temporada"></div>
  <p class="est" id="est">Cargando resultados…</p>

  <div class="cols">
    <section>
      <button type="button" id="yo"><span class="n" id="yoN">—</span><span class="t"><b id="yoNom">Tu posición</b><span id="yoTxt"></span></span></button>
      <div id="podio"></div>
      <h2>Tabla de líderes</h2>
      <div class="ctl">
        <label class="bus"><span aria-hidden="true">🔍</span><input type="text" id="q" placeholder="Buscar jugador o ID" autocomplete="off" enterkeyhint="search"></label>
        <div id="orden">
          <button class="chip on" type="button" data-o="pts">Puntos</button>
          <button class="chip" type="button" data-o="wins">Victorias</button>
          <button class="chip" type="button" data-o="torneos">Torneos</button>
          <button class="chip" type="button" data-o="prom">Promedio</button>
        </div>
      </div>
      <div class="lh" aria-hidden="true"><span>#</span><span>Jugador</span><span>Pts</span><span>Torn.</span><span>Vict.</span></div>
      <div id="lista"><div class="cargando"></div><div class="cargando"></div><div class="cargando"></div></div>
      <button class="chip mas" id="mas" type="button" hidden>Ver más jugadores</button>
    </section>

    <aside id="lado">
      <div class="panel">
        <div class="cifras"><div><b id="cJug">—</b><span>Jugadores</span></div><div><b id="cTor">—</b><span>Torneos</span></div><div><b id="cPts">—</b><span>Puntos</span></div></div>
        <h2>Torneos recientes</h2>
        <div id="torneos"></div>
        <div class="leyenda"><span>1° <b>8</b></span><span>2° <b>5</b></span><span>3° <b>4</b></span><span>4° <b>3</b></span><span>5°–6° <b>2</b></span><span>7°–8° <b>1</b></span><span>puntos por posición</span></div>
      </div>
    </aside>
  </div>
</main>

<div id="velo"></div>
<section id="ficha" role="dialog" aria-modal="true" aria-labelledby="fNom" aria-hidden="true">
  <div class="fh"><div class="hex" id="fHex"></div><div class="t"><b id="fNom"></b><span id="fSub"></span></div><button class="x" id="fX" type="button" aria-label="Cerrar">✕</button></div>
  <div id="fBody"></div>
</section>
<div id="toast" role="status"></div>

<script>
// ── Flag de tracking para badges (v3) ──
try { const s = JSON.parse(localStorage.getItem('chh_secciones_visitadas') || '[]'); if (!s.includes('ranking')) { s.push('ranking'); localStorage.setItem('chh_secciones_visitadas', JSON.stringify(s)); } } catch (e) {}

const API_URL = "https://script.google.com/macros/s/AKfycbx1rOqnmqWhics45UF40n81V9s-W5VgmhQGtc-UNIERGjkZGN8n1mVHkk0B1VO8PYJWOQ/exec";
const POINTS = [8, 5, 4, 3, 2, 2, 1, 1], K_CACHE = 'chh_ranking_cache', PAG = 50;
const $ = id => document.getElementById(id);
const esc = t => String(t ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const normName = s => (s || '').toString().trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/\s+/g, ' ');
const normId = s => { const v = (s || '').toString().trim().toUpperCase(); return v === '—' || v === '-' ? '' : v; };
const iniciales = n => { const p = String(n || '?').trim().split(/\s+/).filter(Boolean); return ((p[0] || '?')[0] + (p.length > 1 ? p[p.length - 1][0] : (p[0] || '')[1] || '')).toUpperCase(); };
const MESES = { ene: 0, feb: 1, mar: 2, abr: 3, may: 4, jun: 5, jul: 6, ago: 7, sep: 8, set: 8, oct: 9, nov: 10, dic: 11 };
function fechaDe(s) {   // ISO, dd/mm/aaaa, "14 de marzo de 2026", o lo que entienda Date
  s = String(s || '').trim(); if (!s) return null; let m;
  if ((m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return new Date(+m[1], m[2] - 1, +m[3]);
  if ((m = s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})/))) return new Date(+m[3] < 100 ? 2000 + +m[3] : +m[3], m[2] - 1, +m[1]);
  if ((m = normName(s).match(/(\d{1,2})\s*(?:de\s*)?([a-z]{3})[a-z]*\.?\s*(?:de\s*|del\s*)?(\d{4})/)) && MESES[m[2]] != null) return new Date(+m[3], MESES[m[2]], +m[1]);
  const d = new Date(s); return isNaN(d) ? null : d;
}
const fechaTxt = d => d ? d.toLocaleDateString('es-MX', { day: 'numeric', month: 'short', year: 'numeric' }) : 'Sin fecha';
function toast(t) { const el = $('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('on'), 2200); }
function sesion() { try { const s = JSON.parse(localStorage.getItem('nhSesion') || 'null'); return s && s.tipo !== 'tienda' && s.id ? s : null; } catch (e) { return null; } }

let TORNEOS = [], TEMP = 'hist', ORDEN = 'pts', LIMITE = PAG, RANK = [], ORDENADO = [];

// ── Torneos normalizados (dedup de nombres sin ID con el ID que tengan en otra fila) ──
function prepararTorneos(results) {
  const nameToId = {};
  results.forEach(r => { for (let i = 1; i <= 8; i++) { const n = normName(r['p' + i + '_name']), id = normId(r['p' + i + '_id']); if (n && id && !nameToId[n]) nameToId[n] = id; } });
  return results.map((r, k) => {
    const f = fechaDe(r.tourdate), lug = [];
    for (let i = 0; i < 8; i++) {
      const raw = r['p' + (i + 1) + '_name']; if (!raw) continue;
      const n = normName(raw), rowId = normId(r['p' + (i + 1) + '_id']), id = rowId || nameToId[n] || '';
      lug.push({ pos: i + 1, name: String(raw).trim(), id, conId: !!rowId, key: id ? 'id:' + id : 'nm:' + n });
    }
    return { k, nombre: String(r.tourname || 'Torneo').trim(), fecha: f, fechaRaw: r.tourdate || '', anio: f ? f.getFullYear() : null, tienda: r.storeid || '', lug };
  }).sort((a, b) => (b.fecha ? +b.fecha : 0) - (a.fecha ? +a.fecha : 0));
}
function torneosTemp() { return TEMP === 'hist' ? TORNEOS : TORNEOS.filter(t => String(t.anio) === TEMP); }
function construir() {
  const map = {};
  torneosTemp().forEach(t => t.lug.forEach(l => {
    const p = map[l.key] || (map[l.key] = { key: l.key, name: l.name, id: l.id, pts: 0, torneos: 0, wins: 0, podios: [0, 0, 0], sumPos: 0, hist: [] });
    if (l.id && !p.id) p.id = l.id; if (l.conId) p.name = l.name;
    const pts = POINTS[l.pos - 1] || 0; p.pts += pts; p.torneos++; p.sumPos += l.pos; if (l.pos === 1) p.wins++; if (l.pos <= 3) p.podios[l.pos - 1]++;
    p.hist.push({ t, pos: l.pos, pts });
  }));
  RANK = Object.values(map); RANK.forEach(p => p.prom = p.pts / p.torneos);
  // Posición oficial: siempre por puntos (los otros órdenes solo reacomodan la vista)
  RANK.sort((a, b) => b.pts - a.pts || b.wins - a.wins || b.podios[1] - a.podios[1] || b.torneos - a.torneos || a.name.localeCompare(b.name));
  RANK.forEach((p, i) => p.rank = (i && p.pts === RANK[i - 1].pts && p.wins === RANK[i - 1].wins && p.podios[1] === RANK[i - 1].podios[1]) ? RANK[i - 1].rank : i + 1);
}

// ── Vista ──
function pintarTemps() {
  const anios = [...new Set(TORNEOS.map(t => t.anio).filter(Boolean))].sort((a, b) => b - a);
  $('temps').innerHTML = anios.map(a => `<button class="chip${TEMP === String(a) ? ' on' : ''}" type="button" role="tab" data-t="${a}">Temporada ${a}</button>`).join('') +
    `<button class="chip${TEMP === 'hist' ? ' on' : ''}" type="button" role="tab" data-t="hist">Histórico</button>`;
  $('temps').querySelectorAll('[data-t]').forEach(b => b.onclick = () => { TEMP = b.dataset.t; LIMITE = PAG; todo(); });
}
function pintarPodio() {
  const top = RANK.slice(0, 3);

  $('podio').innerHTML = [1, 0, 2].map(i => { const p = top[i]; if (!p) return '<div></div>';
    return `<button type="button" class="pd p${i + 1}" data-k="${esc(p.key)}"><span class="pos">${p.rank}°</span><div class="hex">${esc(iniciales(p.name))}</div><b>${esc(p.name)}</b><small>${esc(p.id || 'Sin ID')}</small><div class="pts">${p.pts}</div><small>${p.wins} ${p.wins === 1 ? 'victoria' : 'victorias'}</small></button>`; }).join('');
  $('podio').querySelectorAll('[data-k]').forEach(b => b.onclick = () => abrirJugador(b.dataset.k));
}
function yoKey() { const s = sesion(); if (!s) return null; const id = normId(s.id); const p = RANK.find(x => x.id === id) || RANK.find(x => normName(x.name) === normName(s.nombre || s.nick)); return p ? p.key : null; }
function pintarYo() {
  const s = sesion(), el = $('yo'); if (!s) { el.classList.remove('on'); return; }
  el.classList.add('on'); const k = yoKey(), p = RANK.find(x => x.key === k);
  $('yoNom').textContent = s.nick || s.nombre || 'Tu posición';
  if (!p) { $('yoN').textContent = '—'; $('yoTxt').textContent = TEMP === 'hist' ? 'Aún no apareces en el ranking. Juega un torneo oficial para sumar puntos.' : 'Sin puntos en esta temporada.'; el.onclick = null; return; }
  const arriba = RANK.slice().reverse().find(x => x.pts > p.pts);
  $('yoN').textContent = p.rank + '°';
  $('yoTxt').textContent = p.pts + ' pts de ' + RANK.length + ' jugadores · ' + (arriba ? 'te faltan ' + (arriba.pts - p.pts) + ' para el ' + arriba.rank + '°' : 'vas en primer lugar');
  el.onclick = () => irAFila(p.key);
}
function ordenar() {
  const q = normName($('q').value), L = RANK.slice();
  if (ORDEN === 'wins') L.sort((a, b) => b.wins - a.wins || a.rank - b.rank);
  else if (ORDEN === 'torneos') L.sort((a, b) => b.torneos - a.torneos || a.rank - b.rank);
  else if (ORDEN === 'prom') L.sort((a, b) => (b.torneos >= 2) - (a.torneos >= 2) || b.prom - a.prom || a.rank - b.rank);
  ORDENADO = q ? L.filter(p => normName(p.name).includes(q) || p.id.toLowerCase().includes(q)) : L;
}
function pintarLista() {
  ordenar(); const L = ORDENADO, yk = yoKey();
  if (!RANK.length) { $('lista').innerHTML = '<div class="vacio">Todavía no hay torneos registrados en esta temporada.</div>'; $('mas').hidden = true; return; }
  if (!L.length) { $('lista').innerHTML = '<div class="vacio">Ningún jugador coincide con “' + esc($('q').value) + '”.</div>'; $('mas').hidden = true; return; }

  $('lista').innerHTML = L.slice(0, LIMITE).map(p => `<button type="button" class="fila${p.rank <= 3 ? ' t' + p.rank : ''}${p.key === yk ? ' yo' : ''}" data-k="${esc(p.key)}">
    <span class="r">${p.rank}</span><span><b>${esc(p.name)}</b><small>${esc(p.id || 'Sin ID')}${p.podios[0] + p.podios[1] + p.podios[2] ? ' · ' + (p.podios[0] ? '🥇' + p.podios[0] + ' ' : '') + (p.podios[1] ? '🥈' + p.podios[1] + ' ' : '') + (p.podios[2] ? '🥉' + p.podios[2] : '') : ''}</small></span>
    <span class="v k">${col(p)}</span><span class="v">${p.torneos}</span><span class="v">${p.wins}</span></button>`).join('');
  $('lista').querySelectorAll('[data-k]').forEach(b => b.onclick = () => abrirJugador(b.dataset.k));
  $('mas').hidden = L.length <= LIMITE; $('mas').textContent = 'Ver más jugadores (' + (L.length - LIMITE) + ')';
  document.querySelector('.lh span:nth-child(3)').textContent = ORDEN === 'prom' ? 'Prom.' : 'Pts';
}
function pintarLado() {
  const T = torneosTemp();
  $('cJug').textContent = RANK.length; $('cTor').textContent = T.length; $('cPts').textContent = RANK.reduce((s, p) => s + p.pts, 0);
  $('torneos').innerHTML = T.length ? T.slice(0, 6).map(t => `<button type="button" class="tor" data-t="${t.k}"><b>${esc(t.nombre)}</b><span>${fechaTxt(t.fecha)} · ${t.lug.length} jugadores${t.lug[0] ? ' · <em>🏆 ' + esc(t.lug[0].name) + '</em>' : ''}</span></button>`).join('') : '<div class="vacio" style="padding:14px 0">Sin torneos.</div>';
  $('torneos').querySelectorAll('[data-t]').forEach(b => b.onclick = () => abrirTorneo(+b.dataset.t));

function todo() {
  construir(); pintarTemps(); pintarYo(); pintarPodio(); pintarLista(); pintarLado();
  $('sub').textContent = (TEMP === 'hist' ? 'Histórico' : 'Temporada ' + TEMP) + ' · ' + RANK.length + ' jugadores';

function irAFila(k) {
  $('q').value = ''; const i = (ordenar(), ORDENADO.findIndex(p => p.key === k)); if (i < 0) return;
  if (i >= LIMITE) LIMITE = Math.ceil((i + 1) / PAG) * PAG; pintarLista();
  const el = $('lista').querySelector(`[data-k="${CSS.escape(k)}"]`); if (!el) return;
  el.scrollIntoView({ behavior: 'smooth', block: 'center' }); el.classList.remove('brilla'); void el.offsetWidth; el.classList.add('brilla'); el.focus({ preventScroll: true });
}

// ── Fichas ──
let _volverA = null;
function abrirFicha(hexTxt, nom, sub, html) {
  _volverA = document.activeElement;
  $('fHex').textContent = hexTxt; $('fNom').textContent = nom; $('fSub').textContent = sub; $('fBody').innerHTML = html; $('fBody').scrollTop = 0;
  $('ficha').classList.add('on'); $('velo').classList.add('on'); $('ficha').setAttribute('aria-hidden', 'false');
  $('fBody').querySelectorAll('[data-k]').forEach(b => b.onclick = () => abrirJugador(b.dataset.k));
  $('fBody').querySelectorAll('[data-t]').forEach(b => b.onclick = () => abrirTorneo(+b.dataset.t));
  _volverA = (window.GP && GP.activo() && GP.foco()) || _volverA;
  setTimeout(() => { const f = $('fBody').querySelector('button') || $('fX'); if (window.GP && GP.activo()) GP.enfocar(f); else $('fX').focus({ preventScroll: true }); }, 60);
}
function cerrarFicha() {
  if (!$('ficha').classList.contains('on')) return false;
  $('ficha').classList.remove('on'); $('velo').classList.remove('on'); $('ficha').setAttribute('aria-hidden', 'true');
  if (history.state && history.state.ficha) history.replaceState(null, '', location.pathname);
  const v = _volverA && document.contains(_volverA) ? _volverA : document.querySelector('.fila');
  setTimeout(() => { if (!v) return; if (window.GP && GP.activo()) GP.enfocar(v); else v.focus({ preventScroll: true }); }, 60); return true;
}
function abrirJugador(k) {
  const p = RANK.find(x => x.key === k); if (!p) return;
  const pos = [0, 0, 0, 0]; p.hist.forEach(h => pos[Math.min(h.pos, 4) - 1]++);
  const tot = p.torneos, mejor = Math.min(...p.hist.map(h => h.pos)), promPos = (p.sumPos / tot).toFixed(1), pctTop3 = Math.round((p.podios[0] + p.podios[1] + p.podios[2]) / tot * 100);
  const seg = (n, c) => n ? `<i style="width:${n / tot * 100}%;background:${c}"></i>` : '';
  const html = `<div class="kpi"><div><b>${p.rank}°</b><span>Lugar</span></div><div><b>${p.pts}</b><span>Puntos</span></div><div><b>${p.torneos}</b><span>Torneos</span></div>
      <div><b>${p.wins}</b><span>Victorias</span></div><div><b>${mejor}°</b><span>Mejor lugar</span></div><div><b>${promPos}</b><span>Lugar promedio</span></div></div>
    <h2>Resultados</h2>
    <div class="barra" role="img" aria-label="Distribución de lugares">${seg(pos[0], 'var(--oro)')}${seg(pos[1], 'var(--plata)')}${seg(pos[2], 'var(--bronce)')}${seg(pos[3], 'rgba(143,176,255,.45)')}</div>
    <p class="est">🥇 ${pos[0]} · 🥈 ${pos[1]} · 🥉 ${pos[2]} · otros ${pos[3]} — ${pctTop3}% de sus torneos en el podio · ${(p.pts / tot).toFixed(1)} pts por torneo</p>
    <h2>Historial</h2>
    <div class="hist">${p.hist.slice().sort((a, b) => (b.t.fecha ? +b.t.fecha : 0) - (a.t.fecha ? +a.t.fecha : 0)).map(h => `<button type="button" class="h" data-t="${h.t.k}" style="width:100%;text-align:left">
      <span class="p" style="color:${h.pos === 1 ? 'var(--oro)' : h.pos === 2 ? 'var(--plata)' : h.pos === 3 ? 'var(--bronce)' : 'inherit'}">${h.pos}°</span>
      <span><b>${esc(h.t.nombre)}</b><small>${fechaTxt(h.t.fecha)}</small></span><span class="pt">+${h.pts}</span></button>`).join('')}</div>
    <div class="acc2"><button class="chip" type="button" id="fIr">Ver en la tabla</button><button class="chip" type="button" id="fComp">Compartir</button></div>
    <p class="gpHint"><i>B</i> cerrar</p>`;
  abrirFicha(iniciales(p.name), p.name, (p.id || 'Sin ID') + ' · ' + (TEMP === 'hist' ? 'Histórico' : 'Temporada ' + TEMP), html);
  if (p.id) history.replaceState({ ficha: 1 }, '', '?id=' + encodeURIComponent(p.id) + (TEMP !== 'hist' ? '&t=' + TEMP : ''));
  $('fIr').onclick = () => { cerrarFicha(); irAFila(k); };
  $('fComp').onclick = () => compartir(p);
}
async function compartir(p) {
  const url = location.origin + location.pathname + (p.id ? '?id=' + encodeURIComponent(p.id) : '');
  const txt = `${p.name} va en ${p.rank}° lugar del Ranking Global de Choque de Héroes TCG con ${p.pts} puntos (${TEMP === 'hist' ? 'histórico' : 'temporada ' + TEMP}).`;
  try { if (navigator.share) { await navigator.share({ title: 'Ranking Global · Choque de Héroes', text: txt, url }); return; } } catch (e) { if (e.name === 'AbortError') return; }

}

      return `<button type="button" class="h" ${p ? 'data-k="' + esc(l.key) + '"' : ''} style="width:100%;text-align:left">
      <span class="p" style="color:${l.pos === 1 ? 'var(--oro)' : l.pos === 2 ? 'var(--plata)' : l.pos === 3 ? 'var(--bronce)' : 'inherit'}">${l.pos}°</span>
      <span><b>${esc(l.name)}</b><small>${esc(l.id || 'Sin ID')}</small></span><span class="pt">+${POINTS[l.pos - 1]}</span></button>`; }).join('')}</div>

$('fX').onclick = cerrarFicha; $('velo').addEventListener('click', cerrarFicha);

// Deslizar hacia abajo para cerrar (celular)

  $('ficha').addEventListener('touchend', e => { if (y0 != null && e.changedTouches[0].clientY - y0 > 90 && innerWidth < 760) cerrarFicha(); y0 = null; }, { passive: true }); })();

// ── Datos (con copia local para verlo sin conexión) ──
function hace(ms) { const m = Math.round((Date.now() - ms) / 60000); return m < 1 ? 'hace un momento' : m < 60 ? 'hace ' + m + ' min' : m < 1440 ? 'hace ' + Math.round(m / 60) + ' h' : 'hace ' + Math.round(m / 1440) + ' días'; }
function usarDatos(res, ts, offline) {
  TORNEOS = prepararTorneos(res || []);
  if (TEMP !== 'hist' && !TORNEOS.some(t => String(t.anio) === TEMP)) TEMP = 'hist';
  todo();
  $('est').className = 'est' + (offline ? ' off' : '');
  $('est').textContent = offline ? '⚠ Sin conexión · mostrando los datos guardados ' + hace(ts) : 'Actualizado ' + hace(ts) + ' · ' + TORNEOS.length + ' torneos registrados';
}
let _primera = true;
async function cargar(manual) {
  const prev = (() => { try { return JSON.parse(localStorage.getItem(K_CACHE) || 'null'); } catch (e) { return null; } })();
  if (_primera && prev && prev.res) usarDatos(prev.res, prev.ts, false);
  $('bRf').classList.add('gira');
  const ctrl = new AbortController(), to = setTimeout(() => ctrl.abort(), 20000);

    const r = await fetch(API_URL, { signal: ctrl.signal }); const data = await r.json();
    if (data.status !== 'ok') throw new Error(data.message || 'API');
    const ts = Date.now(); try { localStorage.setItem(K_CACHE, JSON.stringify({ ts, res: data.resultados })); } catch (e) {}
    usarDatos(data.resultados, ts, false); if (manual) toast('✓ Ranking actualizado');
  } catch (e) {

}
function enlaceDirecto() {
  const u = new URLSearchParams(location.search), id = normId(u.get('id')), t = u.get('t');
  if (t && TORNEOS.some(x => String(x.anio) === t)) { TEMP = t; todo(); }
  if (id) { const p = RANK.find(x => x.id === id); if (p) abrirJugador(p.key); else toast('No se encontró al jugador ' + id); }
}
