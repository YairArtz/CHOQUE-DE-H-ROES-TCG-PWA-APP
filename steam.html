<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Choque de Héroes: Nexotlan</title>
<!-- Menú principal de la versión de escritorio (Steam). Solo se usa dentro del contenedor de Electron. -->
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--gold:#f5a623;--cyan:#36d6ff;--uh:1vh;--uw:1vw}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#040a1e;color:#eef2ff;font-family:'Rajdhani',sans-serif;user-select:none}
.fondo{position:fixed;inset:0;background:url(fondos/nexo_abismo.jpg) center/cover no-repeat;filter:saturate(1.1) brightness(.75);transform:scale(1.05);animation:deriva 40s ease-in-out infinite alternate}
@keyframes deriva{to{transform:scale(1.12) translate(-1.5%,-1%)}}
.trama{position:fixed;inset:0;pointer-events:none;background:radial-gradient(rgba(150,190,255,.10) 1px,transparent 1.6px) 0 0/6px 6px,linear-gradient(90deg,rgba(4,10,30,.95) 0%,rgba(4,10,30,.78) 40%,rgba(4,10,30,.15) 75%,rgba(4,10,30,.5) 100%)}
.trama::after{content:'';position:absolute;right:-6%;top:-10%;bottom:-10%;width:52%;transform:skewX(-11deg);background:repeating-linear-gradient(90deg,rgba(54,214,255,.05) 0 2px,transparent 2px 70px);border-left:2px solid rgba(245,166,35,.2)}
.sa{position:fixed;inset:0;display:grid;grid-template-columns:minmax(330px,36%) 1fr;padding:4vh 4vw}
.izq{display:flex;flex-direction:column;justify-content:center;gap:clamp(6px,1.2vh,12px)}
.kick{font-family:'Orbitron',monospace;font-weight:900;font-size:12px;letter-spacing:.36em;color:#5cc8ff;margin-bottom:4px}
.re{--pa:polygon(0 10%,70% 10%,74% 0,100% 0,94% 100%,4% 100%,0 84%);position:relative;isolation:isolate;height:clamp(70px,15vh,120px);width:100%;background:none;border:0;text-align:left;cursor:pointer;
  filter:drop-shadow(0 6px 14px rgba(0,0,0,.45));transition:transform .25s cubic-bezier(.2,.9,.3,1.25),filter .3s;margin-bottom:6px}
.re::after{content:'';position:absolute;inset:0;z-index:-2;clip-path:var(--pa);background:radial-gradient(rgba(255,255,255,.28) 1.1px,transparent 1.7px) 0 0/7px 7px,linear-gradient(135deg,#ffe08a 0%,#ffbf3c 45%,#ff8a1f 100%)}
.re::before{content:'';position:absolute;inset:4px;z-index:-1;clip-path:var(--pa);background:linear-gradient(135deg,rgba(255,255,255,.35),transparent 30%)}
.re b{position:absolute;left:8%;top:50%;translate:0 -42%;font-family:'Orbitron',monospace;font-weight:900;font-size:clamp(26px,5.6vh,46px);color:#fff;transform:skewX(-8deg);
  text-shadow:0 3px 0 #b85a00,2px 0 0 #b85a00,-2px 0 0 #b85a00,0 -2px 0 #b85a00,0 8px 18px rgba(120,50,0,.45)}
.re small{position:absolute;right:9%;bottom:13%;font-family:'Orbitron',monospace;font-weight:900;font-size:11px;letter-spacing:.18em;color:#5a2d00}
.op{--po:polygon(16px 0,100% 0,calc(100% - 16px) 100%,0 100%);position:relative;isolation:isolate;display:flex;align-items:center;gap:14px;width:90%;height:clamp(40px,7.4vh,58px);padding:0 26px 0 24px;
  background:none;color:#eef2ff;border:0;cursor:pointer;text-align:left;filter:drop-shadow(0 3px 6px rgba(0,0,0,.35));transition:transform .24s cubic-bezier(.2,.9,.3,1.3),filter .3s,color .15s}
.op::after{content:'';position:absolute;inset:0;z-index:-2;clip-path:var(--po);background:linear-gradient(90deg,#0f2058,#0b1844 70%,#0a1538)}
.op i{position:absolute;inset:0;z-index:-1;clip-path:var(--po);opacity:0;transition:opacity .2s;background:radial-gradient(rgba(255,255,255,.3) 1px,transparent 1.6px) 0 0/6px 6px,linear-gradient(90deg,#ffd166,#f5a623 60%,#ff8a1f)}
.op::before{content:'';position:absolute;left:3px;top:0;bottom:0;width:5px;background:var(--cyan);transform:skewX(-17deg);transform-origin:bottom}
.op:nth-of-type(3){margin-left:4%}.op:nth-of-type(4){margin-left:1%}.op:nth-of-type(5){margin-left:6%}.op:nth-of-type(6){margin-left:2%}.op:nth-of-type(7){margin-left:5%}
.op .ic{font-size:22px;width:1.4em;text-align:center}
.op b{font-family:'Orbitron',monospace;font-weight:900;font-size:clamp(13px,2.7vh,18px);letter-spacing:.06em}
.op small{margin-left:auto;font-family:'Orbitron',monospace;font-size:10.5px;font-weight:700;color:#9fb3dd;white-space:nowrap}
.op.sal{margin-top:10px}.op.sal::before{background:#ff2f5a}.op.sal::after{background:linear-gradient(90deg,#3a0c22,#260818)}
.op:is(:hover,:focus-visible,.gp-foco){outline:0;transform:translateX(12px);color:#1a0f00;filter:drop-shadow(0 0 7px rgba(255,200,80,.9)) drop-shadow(0 0 18px rgba(255,140,30,.45))}
.op:is(:hover,:focus-visible,.gp-foco) i{opacity:1}.op:is(:hover,:focus-visible,.gp-foco) small{color:#4a2600}
.op:is(:hover,:focus-visible,.gp-foco)::before{background:#fff;box-shadow:0 0 10px #fff}
.op.sal:is(:hover,:focus-visible,.gp-foco) i{background:linear-gradient(90deg,#ff8aa6,#ff2f5a 60%,#c4123c)}.op.sal:is(:hover,:focus-visible,.gp-foco){color:#fff}
.re:is(:hover,:focus-visible,.gp-foco){outline:0;transform:translateX(8px) scale(1.012);filter:drop-shadow(0 0 10px rgba(255,209,102,.95)) drop-shadow(0 0 26px rgba(255,140,30,.55))}
.der{display:flex;align-items:center;justify-content:center}
nexotlan-logo{width:min(760px,95%);display:block}
.pie{position:fixed;left:4vw;bottom:2.4vh;font-family:'Orbitron',monospace;font-size:10px;letter-spacing:.14em;color:#7d90bb}
.izq>*{animation:entra .4s cubic-bezier(.2,.9,.3,1.2) both}
.izq>*:nth-child(2){animation-delay:.04s}.izq>*:nth-child(3){animation-delay:.08s}.izq>*:nth-child(4){animation-delay:.12s}.izq>*:nth-child(5){animation-delay:.16s}.izq>*:nth-child(6){animation-delay:.2s}.izq>*:nth-child(7){animation-delay:.24s}.izq>*:nth-child(8){animation-delay:.28s}
@keyframes entra{from{opacity:0;translate:-40px 0}to{opacity:1;translate:0 0}}
</style>
<script src="iconos.js"></script>   <!-- íconos propios (assets/iconos/iconos.txt) -->
</head>
<body>
<div class="fondo"></div><div class="trama"></div>
<div class="sa">
  <div class="izq">
    <div class="kick">CHOQUE DE HÉROES</div>
    <button class="re" data-ir="nexotlan.html" id="opAventura"><b>AVENTURA</b><small>NEXOTLAN</small></button>
    <button class="op" data-ir="simulacion.html"><i></i><span class="ic">⚔</span><b>CHOQUE LIBRE</b><small>Contra la CPU</small></button>
    <button class="op" data-ir="arcade.html"><i></i><span class="ic">🕹</span><b>ARCADE</b><small>Rivales en serie</small></button>
    <button class="op" data-ir="constructor.html"><i></i><span class="ic">🧰</span><b>CONSTRUCTOR</b><small>Arma tus barajas</small></button>
    <button class="op" data-ir="academia.html"><i></i><span class="ic">🎓</span><b>ACADEMIA</b><small>Aprende a jugar</small></button>
    <button class="op" data-ir="ajustes.html"><i></i><span class="ic">⚙</span><b>AJUSTES</b></button>
    <button class="op sal" id="opSalir"><i></i><span class="ic">⏻</span><b>SALIR</b></button>
  </div>
  <div class="der"><nexotlan-logo mode="title"></nexotlan-logo></div>
</div>
<div class="pie">© Codex Studio · Yair Artz · F11 pantalla completa</div>
<script src="nexotlan-logo.js" defer></script>
<script src="gamepad.js" defer></script>
<script>
document.querySelectorAll('[data-ir]').forEach(b => b.onclick = () => { location.href = b.dataset.ir; });
document.getElementById('opSalir').onclick = () => { if (window.chhEscritorio) chhEscritorio.salir(); else window.close(); };
window.GP_CFG = { principal: () => document.getElementById('opAventura'), principalTxt: 'Aventura' };
window.addEventListener('load', () => { try { document.getElementById('opAventura').focus({ preventScroll: true }); } catch (e) {} });
</script>
</body>
</html>
